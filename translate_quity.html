    function hasTranslateText(it) {
      if (!it || typeof it !== 'object') return false;
      const activeLanguage = getCurrentTargetLanguage();
      if (!activeLanguage) return false;
      const results = ensureItemTranslateResults(it, activeLanguage);
      return Object.values(results).some((translateResult) => !!getTranslateResultText(translateResult));
    }

    function isItemTranslateReady(it) {
      return !!(it && typeof it === 'object' && !it._retranslating && getSelectedTargetLanguages().some((language) => hasTranslateTextForLanguage(it, language)));
    }

    function hasTranslateTextForLanguage(it, language) {
      if (!it || typeof it !== 'object') return false;
      const resolvedLanguage = normalizeLanguageCode(language);
      if (!resolvedLanguage) return false;
      const results = ensureItemTranslateResults(it, resolvedLanguage);
      return Object.values(results).some((translateResult) => !!getTranslateResultText(translateResult));
    }

    function isItemTranslateReadyForLanguage(it, language) {
      return !!(it && typeof it === 'object' && !it._retranslating && hasTranslateTextForLanguage(it, language));
    }

    function isItemReadyForAnySelectedLanguage(it) {
      return !!(it && typeof it === 'object' && !it._retranslating
        && getSelectedTargetLanguages().some((language) => isItemTranslateReadyForLanguage(it, language)));
    }

    function getTranslationValidationError(translatedText, expectedRows) {
      const rawText = String(translatedText || '').trim();
      if (!rawText) return '对应译文为空，无法进行质检';
      try {
        const arr = deserializeContentArray(rawText, 'translated_content');
        if (!Array.isArray(arr) || arr.length === 0) return '对应译文不是有效的字幕数组或数组为空';
        const nonEmptyCount = arr.filter((item) => item && item.t != null && String(item.t).trim() !== '').length;
        if (nonEmptyCount === 0) return '对应译文的所有字幕文本均为空，无法进行质检';
        const expected = toInt(expectedRows);
        if (expected != null && arr.length !== expected) {
          return `译文条目数不一致：原文 ${expected} 条，译文 ${arr.length} 条`;
        }
      } catch (err) {
        return `对应译文结构无法解析：${err && err.message ? err.message : String(err)}`;
      }
      return '';
    }

    function isTranslateResultFailed(it, translateResult) {
      if (!translateResult || typeof translateResult !== 'object') return false;
      if (translateResult.error_msg || translateResult.parse_error) return true;
      const state = translateResult.query_response && translateResult.query_response.data
        ? translateResult.query_response.data.state
        : null;
      if (state != null && typeof state === 'number' && state < 0) return true;
      const text = getTranslateResultText(translateResult);
      return !!text && getTranslateResultStatusInfo(it, translateResult).cls === 'bad';
    }

    function getItemLanguageProgressInfo(it, language) {
      const resolvedLanguage = normalizeLanguageCode(language);
      if (!resolvedLanguage) return null;
      const translateTemplateIds = getTranslateTemplateIds();
      const qualityTemplateIds = getQualityTemplateIds();
      const translateResults = ensureItemTranslateResults(it, resolvedLanguage);
      const qualityResults = ensureItemQualityResults(it, resolvedLanguage);
      const translateDone = translateTemplateIds.filter((templateId) => {
        const result = translateResults[templateId];
        return !!getTranslateResultText(result) || isTranslateResultFailed(it, result);
      }).length;
      const translateFailed = translateTemplateIds.filter((templateId) => isTranslateResultFailed(it, translateResults[templateId])).length;
      const qualityDone = translateTemplateIds.reduce((sum, translateTemplateId) => {
        const qualityForTranslate = qualityResults[translateTemplateId] || {};
        const done = qualityTemplateIds.filter((qualityTemplateId) => {
          const result = qualityForTranslate[qualityTemplateId];
          return !!getQualityResultRawText(result) || !!(result && result.error_msg);
        }).length;
        return sum + done;
      }, 0);
      const qualityTotal = translateTemplateIds.length * qualityTemplateIds.length;
      return {
        language: resolvedLanguage,
        label: getLanguageLabel(resolvedLanguage),
        translateDone,
        translateTotal: translateTemplateIds.length,
        translateFailed,
        qualityDone,
        qualityTotal,
      };
    }

    function countTranslateTasksInSelection() {
      const languages = getSelectedTargetLanguages();
      const translateTemplateCount = getTranslateTemplateIds().length;
      if (!languages.length || !translateTemplateCount) return 0;
      return Array.from(checkedSet).reduce((sum, idx) => {
        if (idx < 0 || idx >= items.length) return sum;
        return sum + languages.length * translateTemplateCount;
      }, 0);
    }

    function countReadyQualityTasksInSelection() {
      const languages = getSelectedTargetLanguages();
      const translateTemplateCount = getTranslateTemplateIds().length;
      const qualityTemplateCount = getQualityTemplateIds().length;
      if (!languages.length || !translateTemplateCount || !qualityTemplateCount) return 0;
      return Array.from(checkedSet).reduce((sum, idx) => {
        if (idx < 0 || idx >= items.length) return sum;
        return sum + languages.reduce((languageSum, language) => {
          const readyTranslateCount = getTranslateTemplateIds().filter((templateId) => {
            const translateResult = getItemTranslateResult(items[idx], templateId, language);
            return !!getTranslateResultText(translateResult);
          }).length;
          return languageSum + (readyTranslateCount * qualityTemplateCount);
        }, 0);
      }, 0);
    }

    async function requestBatchWakeLock() {
      if (!('wakeLock' in navigator) || batchWakeLock) return false;
      try {
        batchWakeLock = await navigator.wakeLock.request('screen');
        batchWakeLock.addEventListener('release', () => {
          batchWakeLock = null;
        });
        return true;
      } catch (_) {
        batchWakeLock = null;
        return false;
      }
    }

    async function releaseBatchWakeLock() {
      if (!batchWakeLock) return;
      try {
        await batchWakeLock.release();
      } catch (_) {
        // ignore
      } finally {
        batchWakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && (bulkRunning || qualityRunning)) {
        requestBatchWakeLock();
      }
    });

    function getItemExecutionProgressText(it) {
      const languages = getSelectedTargetLanguages();
      if (!languages.length) return '';
      const infos = languages
        .map((language) => getItemLanguageProgressInfo(it, language))
        .filter(Boolean);
      if (!infos.length) return '';
      const parts = infos.map((info) => {
        const translatePart = `${info.translateDone}/${info.translateTotal}`;
        const qualityPart = info.qualityTotal > 0 ? `${info.qualityDone}/${info.qualityTotal}` : '0/0';
        const failedPart = info.translateFailed > 0 ? ` 失败${info.translateFailed}` : '';
        return `${info.label} 翻 ${translatePart} 质 ${qualityPart}${failedPart}`;
      });
      const totalDoneLanguages = infos.filter((info) => info.translateDone >= info.translateTotal && (info.qualityTotal === 0 || info.qualityDone >= info.qualityTotal)).length;
      return `进展：已完成 ${totalDoneLanguages}/${infos.length} 语言；${parts.join(' · ')}`;
    }

    function getLanguageAggregateProgressText() {
      const languages = getSelectedTargetLanguages();
      const infos = languages
        .map((language) => {
          const counts = items.reduce((acc, it) => {
            const info = getItemLanguageProgressInfo(it, language);
            if (!info) return acc;
            acc.translateDone += info.translateDone;
            acc.translateTotal += info.translateTotal;
            acc.qualityDone += info.qualityDone;
            acc.qualityTotal += info.qualityTotal;
            return acc;
          }, { translateDone: 0, translateTotal: 0, qualityDone: 0, qualityTotal: 0 });
          return { language, ...counts };
        })
        .filter((info) => info.translateTotal > 0 || info.qualityTotal > 0);
      if (!infos.length) return '暂无执行进展';
      return infos.map((info) => `${getLanguageLabel(info.language)}：翻译 ${info.translateDone}/${info.translateTotal}，质检 ${info.qualityDone}/${info.qualityTotal}`).join(' · ');
    }

    function getFailedTranslateTemplateIds(it, language) {
      if (!it || typeof it !== 'object') return [];
      const resolvedLanguage = normalizeLanguageCode(language);
      if (!resolvedLanguage) return [];
      return getOrderedTranslateTemplateIdsForItem(it, resolvedLanguage).filter((templateId) => {
        const translateResult = getItemTranslateResult(it, templateId, resolvedLanguage);
        return isTranslateResultFailed(it, translateResult);
      });
    }

    function getFailedQualityTranslateTemplateIds(it, language) {
      if (!it || typeof it !== 'object') return [];
      const resolvedLanguage = normalizeLanguageCode(language);
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      if (!resolvedLanguage || !qualityTemplateId) return [];
      return getOrderedTranslateTemplateIdsForItem(it, resolvedLanguage).filter((translateTemplateId) => {
        const translateResult = getItemTranslateResult(it, translateTemplateId, resolvedLanguage);
        if (!getTranslateResultText(translateResult)) return false;
        const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId, resolvedLanguage);
        return !!(qualityResult && qualityResult.error_msg);
      });
    }

    function countFailedTasksInSelection() {
      const languages = getSelectedTargetLanguages();
      return Array.from(checkedSet).reduce((sum, idx) => {
        if (!Number.isInteger(idx) || idx < 0 || idx >= items.length) return sum;
        const it = items[idx];
        return sum + languages.reduce((languageSum, language) => (
          languageSum
          + getFailedTranslateTemplateIds(it, language).length
          + getFailedQualityTranslateTemplateIds(it, language).length
        ), 0);
      }, 0);
    }

    function tryParseQualityResult(text) {
      if (!text) return null;
      try {
        return JSON.parse(cleanMarkdownCodeBlock(String(text)));
      } catch (_) {
        return null;
      }
    }

    function getQualityResultRawText(qualityResult) {
      if (!qualityResult || typeof qualityResult !== 'object') return '';
      return qualityResult.text || (
        qualityResult.query_response && qualityResult.query_response.data
          ? qualityResult.query_response.data.text || ''
          : ''
      ) || '';
    }

    function extractQualityScore(scoreText) {
      if (!scoreText) return null;
      const raw = cleanMarkdownCodeBlock(String(scoreText));
      const parsed = tryParseQualityResult(raw);
      const candidates = [];
      const nestedScores = [];
      function collectNestedScores(value, depth = 0) {
        if (!value || typeof value !== 'object' || depth > 6) return;
        if (Array.isArray(value)) {
          value.forEach((item) => collectNestedScores(item, depth + 1));
          return;
        }
        Object.entries(value).forEach(([key, nestedValue]) => {
          if (String(key).toLowerCase() === 'score') {
            const n = Number(nestedValue);
            if (Number.isFinite(n)) nestedScores.push(n);
          } else if (nestedValue && typeof nestedValue === 'object') {
            collectNestedScores(nestedValue, depth + 1);
          }
        });
      }
      if (parsed && typeof parsed === 'object') {
        candidates.push(parsed.score, parsed.total_score, parsed.quality_score, parsed.avg_score, parsed.final_score);
        if (parsed.result && typeof parsed.result === 'object') {
          candidates.push(parsed.result.score, parsed.result.total_score, parsed.result.quality_score);
        }
        collectNestedScores(parsed);
      }
      for (const value of candidates) {
        const n = Number(value);
        if (Number.isFinite(n)) return n;
      }
      if (nestedScores.length) {
        return Math.round((nestedScores.reduce((sum, score) => sum + score, 0) / nestedScores.length) * 100) / 100;
      }
      const matched = raw.match(/["']?(?:score|评分|质检分|质量分|总分|得分)["']?\s*[:：=]?\s*(\d+(?:\.\d+)?)/i);
      if (matched) {
        const n = Number(matched[1]);
        if (Number.isFinite(n)) return n;
      }
      return null;
    }

    function getQualityScores(it, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object') return [];
      const templateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const translateTemplateIds = getOrderedTranslateTemplateIdsForItem(it, language);
      return translateTemplateIds
        .map((translateTemplateId) => getItemQualityResult(it, templateId, translateTemplateId, language))
        .map((qualityResult) => {
          const scoreText = getQualityResultRawText(qualityResult);
          const score = extractQualityScore(scoreText);
          return score;
        })
        .filter((score) => score != null);
    }

    // 获取列表项质检信息文本，格式：质检task_id:{task_id}, 质检分:{score}
    function getItemQualityInfoText(it) {
      if (!it || typeof it !== 'object') return '-';
      const activeLanguage = getCurrentTargetLanguage();
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const translateTemplateIds = getOrderedTranslateTemplateIdsForItem(it, activeLanguage);
      const parts = translateTemplateIds
        .map((translateTemplateId) => {
          const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId, activeLanguage);
          if (!qualityResult) return null;
          const taskId = qualityResult.task_id || '-';
          const scoreText = getQualityResultRawText(qualityResult);
          const score = extractQualityScore(scoreText);
          return `质检task_id:${taskId} 质检分:${score == null ? '未返回' : String(score)}`;
        })
        .filter(Boolean);
      return parts.length ? parts.join('\n') : '-';
    }

    function getQualityCheckStatus(it) {
      if (!it || typeof it !== 'object') return { text: '待质检', cls: 'warn' };
      const activeLanguage = getCurrentTargetLanguage();
      const failedLanguages = getFailedQualityLanguageCodes(it);
      const failureSummary = failedLanguages.length ? `失败语种:${formatLanguageCodeList(failedLanguages)}` : '';
      const scores = getQualityScores(it, activeLanguage);
      if (scores.length > 0) {
        const avgScore = Math.round(scores.reduce((sum, score) => sum + score, 0) / scores.length);
        return { text: `评价质检分:${avgScore}分`, cls: it._qualityChecking ? 'run' : 'ok', extra: failureSummary };
      }

      const templateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const qualityResults = getOrderedTranslateTemplateIdsForItem(it, activeLanguage)
        .map((translateTemplateId) => getItemQualityResult(it, templateId, translateTemplateId, activeLanguage))
        .filter(Boolean);
      const hasError = qualityResults.some((qualityResult) => qualityResult && qualityResult.error_msg);
      if (it._qualityChecking) return { text: '质检中', cls: 'run' };
      if (hasError) return { text: '质检失败', cls: 'bad', extra: failureSummary };
      const hasAnyText = qualityResults.some((qualityResult) => {
        const text = qualityResult && qualityResult.text ? qualityResult.text : (
          qualityResult && qualityResult.query_response && qualityResult.query_response.data
            ? qualityResult.query_response.data.text || ''
            : ''
        );
        return !!text;
      });
      if (!hasAnyText) return { text: '待质检', cls: 'warn', extra: failureSummary };
      return { text: '评价质检已完成', cls: 'ok', extra: failureSummary };
    }

    function buildQualityCheckPrompt({ originItems, translatedText, originLang, targetLang }) {
      return normalizeNewlines([
        '请对以下字幕翻译结果进行质量检查，并按照质量分析模板的要求输出结果。',
        `原语言：${originLang || ''}`,
        `目标语言：${targetLang || ''}`,
        '',
        '原文条目(JSON)：',
        JSON.stringify(originItems, null, 2),
        '',
        '译文结果(JSON/文本)：',
        String(translatedText || '').trim(),
      ].join('\n'));
    }

    function buildQualityTaskIdMarkup(it) {
      if (!it || typeof it !== 'object') return '';
      const activeLanguage = getCurrentTargetLanguage();
      const selectedTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const orderedTranslateTemplateIds = getOrderedTranslateTemplateIdsForItem(it, activeLanguage);

      return orderedTranslateTemplateIds
        .map((translateTemplateId) => {
          const qualityResult = getItemQualityResult(it, selectedTemplateId, translateTemplateId, activeLanguage);
          const taskId = qualityResult ? qualityResult.task_id || '' : '';
          if (!taskId) return '';
          const scoreText = getQualityResultRawText(qualityResult);
          const parsedScore = tryParseQualityResult(scoreText);
          const score = extractQualityScore(scoreText);
          const issuesCount = parsedScore && Array.isArray(parsedScore.issues) ? parsedScore.issues.length : null;
          const canRetrigger = isItemReadyForAnySelectedLanguage(it) && !it._qualityChecking;
          const scoreMarkup = score == null
            ? ''
            : `<span class="badge quality-task-score">质检分: ${escapeHtml(String(score))}</span>`;
          const issuesMarkup = issuesCount == null
            ? ''
            : `<span class="badge quality-task-issues">异常翻译数量: ${escapeHtml(String(issuesCount))}</span>`;
          const rerunBtnMarkup = `
            <button
              class="mini-copy-btn"
              type="button"
              data-action="quality-check-template"
              data-translate-template-id="${escapeHtml(String(translateTemplateId))}"
              ${canRetrigger ? '' : 'disabled'}
            >重新质检</button>
          `;
          return `
            <span class="quality-task-block">
              <span class="badge task-id" data-action="task-text" data-task-id="${escapeHtml(String(taskId))}">
                质检task_id(${escapeHtml(String(translateTemplateId || '-'))}): ${escapeHtml(String(taskId))}
              </span>
              <button class="mini-copy-btn" type="button" data-action="copy-task" data-task-id="${escapeHtml(String(taskId))}">复制</button>
              ${scoreMarkup ? `<span class="quality-task-break"></span>${scoreMarkup}${issuesMarkup}` : ''}
              ${rerunBtnMarkup}
            </span>
          `;
        })
        .filter(Boolean)
        .join('');
    }

    function updateBulkControls() {
      const total = items.length;
      const checked = checkedSet.size;
      const hasItems = total > 0;
      const languages = getSelectedTargetLanguages();
      const languageCount = languages.length;
      const translateTaskCount = countTranslateTasksInSelection();
      const readyChecked = countReadyQualityTasksInSelection();
      const failedTaskCount = countFailedTasksInSelection();
      const canBulkTranslate = hasItems && checked > 0 && languageCount > 0 && !bulkRunning && !qualityRunning;
      const canQualityCheck = hasItems && readyChecked > 0 && !bulkRunning && !qualityRunning;
      const canRetryFailed = hasItems && failedTaskCount > 0 && !bulkRunning && !qualityRunning;

      bulkRetranslateBtn.disabled = !canBulkTranslate;
      bulkRetranslateBtn.textContent = `全部翻译（${translateTaskCount}）`;
      bulkQualityCheckBtn.disabled = !canQualityCheck;
      bulkQualityCheckBtn.textContent = `全部质检（${readyChecked}）`;
      retryFailedBtn.disabled = !canRetryFailed;
      retryFailedBtn.textContent = `失败全部重试（${failedTaskCount}）`;
      if (stopBatchBtn) stopBatchBtn.disabled = !(bulkRunning || qualityRunning);
      bulkQualityCheckBtn.title = canQualityCheck || !hasItems || checked === 0
        ? ''
        : '请先勾选至少一个已翻译完成的条目';
      retryFailedBtn.title = failedTaskCount > 0 ? '只重试勾选条目、勾选语种中的失败任务' : '';

      if (!hasItems) {
        selectAllEl.checked = false;
        selectAllEl.indeterminate = false;
        selectAllEl.disabled = true;
        retryFailedBtn.disabled = true;
        if (stopBatchBtn) stopBatchBtn.disabled = true;
        return;
      }
      selectAllEl.disabled = false;
      selectAllEl.indeterminate = checked > 0 && checked < total;
      selectAllEl.checked = total > 0 && checked === total;
    }

    function toInt(v) {
      const n = Number(String(v ?? '').trim());
      return Number.isFinite(n) ? n : null;
    }

    function getTranslateStatus(it) {
      if (!it || typeof it !== 'object') return { text: '未翻译', cls: 'warn' };
      if (it._retranslating) return { text: '翻译中', cls: 'run' };
      const failedLanguages = getFailedTranslateLanguageCodes(it);
      const failureSummary = failedLanguages.length ? `失败语种:${formatLanguageCodeList(failedLanguages)}` : '';

      const hasTask = !!it.translate_task_id;
      const hasResp = !!it.translate_query_response;
      if (!hasTask && !hasResp) return { text: '未翻译', cls: 'warn' };

      const state = hasResp && it.translate_query_response.data ? it.translate_query_response.data.state : null;
      if (it.translate_error_msg) return { text: it.translate_error_msg, cls: 'bad', extra: failureSummary };
      if (state != null && typeof state === 'number' && state < 0) {
        const detail = it.translate_query_response && it.translate_query_response.data
          ? (it.translate_query_response.data.state_detail || it.translate_query_response.data.error || '')
          : '';
        return { text: `任务失败${detail ? `：${detail}` : ''}`, cls: 'bad', extra: failureSummary };
      }
      if (state !== 1) return { text: '进行中/等待', cls: 'run' };

      if (it.translate_parse_error) return { text: '翻译结构异常', cls: 'bad', extra: [failureSummary, '结果结构异常'].filter(Boolean).join('；') };

      const origin = toInt(it.origin_rows);
      const translated = toInt(it.translate_rows);
      if (origin == null || translated == null) return { text: '已完成', cls: 'ok', extra: failureSummary };
      if (origin !== translated) return { text: '翻译结构异常', cls: 'bad', extra: [failureSummary, '行数不一致'].filter(Boolean).join('；') };
      return { text: '翻译结构正常', cls: 'ok', extra: failureSummary };
    }

    // 检查翻译结果中是否存在空的 t 值
    function hasEmptyTranslation(it) {
      if (!it || typeof it !== 'object') return false;
      if (!it.translate_query_response || !it.translate_query_response.data) return false;
      const text = it.translate_query_response.data.text;
      if (!text) return false;
      try {
        const arr = deserializeContentArray(text, 'data.text');
        if (!Array.isArray(arr)) return false;
        return arr.some(item => item && (item.t === '' || item.t === null || item.t === undefined));
      } catch (_) {
        return false;
      }
    }

    // 更新翻译统计（成功/瑕疵/失败占比）
    function updateTranslateStats() {
      translateStatsEl.style.display = 'none';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildSubtitleArrayItem(entry, idx) {
      const originArr = deserializeContentArray(entry, `items[${idx}]`);
      const preview = originArr
        .slice(0, 4)
        .map((item) => item && item.t != null ? String(item.t).trim() : '')
        .filter((text) => text)
        .join('\n');

      return {
        origin_content: typeof entry === 'string' ? entry : JSON.stringify(originArr),
        origin_lang: '',
        target_lang: '',
        origin_rows: String(originArr.length),
        output_rows: '-',
        translate_rows: '-',
        _origin_preview: preview || '// 无字幕文本',
      };
    }

    function normalizeToItems(data) {
      // 兼容两种结构：
      // 1. 旧结构：对象数组 / 单对象
      // 2. 新结构：数组中的每一项是字幕 JSON 字符串（或字幕数组）
      if (Array.isArray(data)) {
        return data.map((entry, idx) => {
          if (typeof entry === 'string' || Array.isArray(entry)) {
            return buildSubtitleArrayItem(entry, idx);
          }
          if (entry && typeof entry === 'object') return entry;
          throw new Error(`第 ${idx + 1} 项类型不支持`);
        });
      }
      if (data && typeof data === 'object') return [data];
      throw new Error('文件顶层必须是对象或数组');
    }

    function renderItemsList() {
      if (!Array.isArray(items) || items.length === 0) {
        itemsListEl.innerHTML = '<li class="item"><div class="row1">没有条目</div><div class="row2">-</div></li>';
        updateBulkControls();
        return;
      }
      itemsListEl.innerHTML = items.map((it, idx) => {
        const activeLanguage = getCurrentTargetLanguage();
        if (it && typeof it === 'object' && activeLanguage) {
          syncPrimaryTranslateFields(it, activeLanguage);
          syncPrimaryQualityFields(it, activeLanguage);
        }
        const originRows = it && typeof it === 'object' ? (it.origin_rows ?? '-') : '-';
        const running = !!(it && typeof it === 'object' && it._retranslating);
        const qualityRunningForItem = !!(it && typeof it === 'object' && it._qualityChecking);
        const prog = it && typeof it === 'object' ? (it._progress ?? '') : '';
        const qualityProg = it && typeof it === 'object' ? (it._quality_progress ?? '') : '';
        const executionProgress = it && typeof it === 'object' ? getItemExecutionProgressText(it) : '';
        const st = getTranslateStatus(it);
        const qualitySt = getQualityCheckStatus(it);
        const hasEmpty = hasEmptyTranslation(it);
        const active = idx === selected ? ' active' : '';
        const checked = checkedSet.has(idx) ? 'checked' : '';
        const qualityInfoText = getItemQualityInfoText(it);
        return `
          <li class="item${active}" data-idx="${idx}">
            <div class="row1">
              <div class="row1-left">
                <input type="checkbox" data-action="check" data-idx="${idx}" ${checked} />
                <span class="badge">#${idx + 1}</span>
                <span class="badge">字幕原文行数: ${escapeHtml(String(originRows))}</span>
                <span class="badge ${escapeHtml(st.cls)}">${escapeHtml(st.text)}</span>
                ${st.extra ? `<span class="badge bad">${escapeHtml(st.extra)}</span>` : ''}
                <span class="badge ${escapeHtml(qualitySt.cls)}">${escapeHtml(qualitySt.text)}</span>
                ${qualitySt.extra ? `<span class="badge bad">${escapeHtml(qualitySt.extra)}</span>` : ''}
                ${hasEmpty ? '<span class="badge warn">存在翻译结果为空的项</span>' : ''}
                ${executionProgress ? `<span class="badge exec-progress">${escapeHtml(executionProgress)}</span>` : ''}
                ${prog ? `<span class="badge">${escapeHtml(String(prog))}</span>` : ''}
                ${qualityProg ? `<span class="badge">${escapeHtml(String(qualityProg))}</span>` : ''}
              </div>
              <div class="row1-right">
                <button class="small-btn" data-action="retranslate" data-idx="${idx}" ${running ? 'disabled' : ''}>重新翻译</button>
                <button class="small-btn" data-action="quality-check" data-idx="${idx}" ${(!isItemReadyForAnySelectedLanguage(it) || qualityRunningForItem) ? 'disabled' : ''}>重新质检</button>
              </div>
            </div>
            <div class="row2">${escapeHtml(qualityInfoText)}</div>
          </li>
        `;
      }).join('');
      updateBulkControls();
      updateTranslateStats();
      updateAllQualityTemplateAverageBadges();
    }

    function selectItem(idx) {
      if (!Number.isInteger(idx) || idx < 0 || idx >= items.length) return;
      selected = idx;
      selectedIndexEl.textContent = `#${idx + 1}`;
      detailSelectedEl.textContent = `#${idx + 1}`;
      renderItemsList();

      const obj = items[idx];

      const originArr = deserializeContentArray(obj && typeof obj === 'object' ? obj.origin_content : null, 'origin_content');
      lastOriginPretty = JSON.stringify(originArr, null, 2);
      jsonPreviewEl.textContent = lastOriginPretty;

      // 展示翻译结果 data.text 与翻译质量结果
      syncPrimaryTranslateFields(obj, getCurrentTargetLanguage());
      syncPrimaryQualityFields(obj, getCurrentTargetLanguage());
      renderTranslatePreview(obj);
      renderQualityPreview(obj);

      setStatus('已加载条目详情', 'success');
    }

    function computeTranslateRowsForItem(it) {
      if (!it || typeof it !== 'object') return '-';
      // 仅使用接口响应中的 data.text（成功反序列化后）的数组长度
      if (it.translate_query_response && it.translate_query_response.data && it.translate_query_response.data.text) {
        try {
          const arr = deserializeContentArray(it.translate_query_response.data.text, 'data.text');
          return String(Array.isArray(arr) ? arr.length : '-');
        } catch (_) {
          return '-';
        }
      }
      return '-';
    }

    async function handleFile(file) {
      clearView();
      if (!file) return;

      pickedFileNameEl.textContent = file.name || '未选择';
      fileNameEl.textContent = file.name || '-';
      setStatus('正在解析文件...', '');

      const text = await file.text();
      const root = JSON.parse(text);
      items = normalizeToItems(root);
      // 初始不计算 translate_rows：必须等接口响应 data.text 成功反序列化后才有值
      for (const it of items) {
        if (it && typeof it === 'object') {
          if (!it.origin_rows || it.origin_rows === '-') {
            try {
              const originArr = deserializeContentArray(it.origin_content, 'origin_content');
              it.origin_rows = String(Array.isArray(originArr) ? originArr.length : '-');
              if (!it._origin_preview) {
                it._origin_preview = originArr
                  .slice(0, 4)
                  .map((item) => item && item.t != null ? String(item.t).trim() : '')
                  .filter((text) => text)
                  .join('\n');
              }
            } catch (_) {
              // ignore preview fallback errors
            }
          }
          syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
        }
      }
      applySelectedTargetLanguageToItems();
      itemsCountEl.textContent = String(items.length);
      selectedIndexEl.textContent = '-';
      // 默认全选第一项（用于详情展示），但不默认勾选
      updateBulkControls();

      selected = 0;
      renderItemsList();
      selectItem(0);
      setStatus('文件解析成功', 'success');
    }

    qualityPreviewEl.addEventListener('click', (e) => {

    async function retranslateItemSingleLanguage(idx, translateTemplateIdsOverride, targetLanguageOverride, signal = null) {
      const it = items[idx];
      if (!it || typeof it !== 'object') return false;
      if (it._retranslating) return false;
      let targetLang = '';
      try {
        throwIfAborted(signal);
        saveConfig();
        const originContent = it.origin_content;
        const subtitleLen = it.origin_rows;
        targetLang = normalizeLanguageCode(targetLanguageOverride || it.target_lang || getCurrentTargetLanguage());
        const originLang = it.origin_lang ?? '';
        const translateTemplateIds = Array.isArray(translateTemplateIdsOverride) && translateTemplateIdsOverride.length
          ? translateTemplateIdsOverride.filter((value) => value)
          : getTranslateTemplateIds();
        if (!translateTemplateIds.length) {
          throw new Error('请先填写至少一个字幕翻译模板id');
        }
        if (!targetLang) {
          throw new Error('请先勾选至少一个翻译语种');
        }
        const isPartialRetry = Array.isArray(translateTemplateIdsOverride) && translateTemplateIdsOverride.length > 0;
        // 与 Python 版本保持一致：先反序列化为数组，再以缩进=2 的 JSON 文本发送（避免 \" 这类转义形态）
        let textPrompt = '';
        let arr;
        try {
          arr = deserializeContentArray(originContent, 'origin_content');
          textPrompt = normalizeNewlines(JSON.stringify(arr, null, 2));
        } catch (e) {
          it.translate_error_msg = `origin_content 反序列化失败：${e && e.message ? e.message : String(e)}`;
          renderItemsList();
          return false;
        }

        it._retranslating = true;
        const translateResults = ensureItemTranslateResults(it, targetLang);
        if (!isPartialRetry) {
          it.translate_task_id = '';
          it.translate_template_id = translateTemplateIds[0] || '';
          if (!it.translate_results_by_lang || typeof it.translate_results_by_lang !== 'object') it.translate_results_by_lang = {};
          it.translate_results_by_lang[targetLang] = {};
          it.translate_error_msg = '';
          it.translate_parse_error = '';
          it.quality_check_task_id = '';
          it.quality_check_query_response = null;
          it.quality_check_text = '';
          it.quality_check_error_msg = '';
          if (!it.quality_check_results_by_lang || typeof it.quality_check_results_by_lang !== 'object') it.quality_check_results_by_lang = {};
          it.quality_check_results_by_lang[targetLang] = {};
        } else {
          translateTemplateIds.forEach((translateTemplateId) => {
            translateResults[translateTemplateId] = {
              task_id: '',
              text: '',
              query_response: null,
              error_msg: '',
              parse_error: '',
              rows: '-',
            };
            const qualityResults = ensureItemQualityResults(it, targetLang);
            delete qualityResults[translateTemplateId];
          });
          syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
          syncPrimaryQualityFields(it, getCurrentTargetLanguage());
        }
        it._qualityChecking = false;
        it._quality_progress = '';
        renderItemsList();
        setStatus(`正在重新翻译 #${idx + 1} · ${getLanguageLabel(targetLang)}，共 ${translateTemplateIds.length} 个模板...`, '');

        const mappedOriginLang = mapLanguageToZhDesc(originLang);
        const mappedTargetLang = mapLanguageToZhDesc(targetLang);
        let failedCount = 0;
        for (let i = 0; i < translateTemplateIds.length; i += 1) {
          const translateTemplateId = translateTemplateIds[i];
          const results = ensureItemTranslateResults(it, targetLang);
          results[translateTemplateId] = {
            task_id: '',
            text: '',
            query_response: null,
            error_msg: '',
            parse_error: '',
            rows: '-',
          };
          const templateIndexText = `${getLanguageLabel(targetLang)} · 模板 ${i + 1}/${translateTemplateIds.length}`;
          try {
            const res = await requestLlmChatAsync({
              textPrompt,
              subtitleLen,
              originLang: mappedOriginLang,
              language: mappedTargetLang,
              templateIdValue: translateTemplateId,
              emptyTemplateMessage: '请先填写字幕翻译模板id',
              signal,
              onProgress: ({ stage, progress, taskId }) => {
                if (stage === 'create') it._progress = progress ? `翻译 ${templateIndexText} ${progress}` : `翻译 ${templateIndexText} 创建中`;
                else if (stage === 'created' && taskId) {
                  results[translateTemplateId].task_id = taskId;
                  it._progress = `翻译 ${templateIndexText} 已创建`;
                }
                else if (typeof progress !== 'undefined' && progress !== null && progress !== '') it._progress = `翻译 ${templateIndexText} ${progress}`;
                else it._progress = `翻译 ${templateIndexText} 进行中`;
                syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
                renderItemsList();
                if (selected === idx) renderTranslatePreview(it);
              },
            });

            results[translateTemplateId] = {
              task_id: res.taskId || results[translateTemplateId].task_id || '',
              text: res.text || '',
              query_response: res.queryResponse || null,
              error_msg: '',
              parse_error: '',
              rows: '-',
            };
            results[translateTemplateId].rows = computeTranslateRowsFromResult(results[translateTemplateId]);
          } catch (err) {
            failedCount += 1;
            const errorResult = {
              task_id: results[translateTemplateId].task_id || '',
              text: '',
              query_response: err && err.queryResponse ? err.queryResponse : null,
              error_msg: `任务失败：${err && err.message ? err.message : String(err)}`,
              parse_error: '',
              rows: '-',
            };
            if (errorResult.query_response && errorResult.query_response.data && errorResult.query_response.data.text) {
              errorResult.rows = computeTranslateRowsFromResult(errorResult);
            }
            results[translateTemplateId] = errorResult;
            if (isAbortError(err)) throw err;
          }
          syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
          renderItemsList();
          if (selected === idx) {
            renderTranslatePreview(it);
            renderQualityTemplateSelector();
            renderQualityPreview(it);
          }
        }

        syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
        if (selected === idx) {
          renderTranslatePreview(it);
          renderQualityTemplateSelector();
          renderQualityPreview(it);
        }

        if (failedCount > 0) {
          setStatus(`重新翻译完成：#${idx + 1} · ${getLanguageLabel(targetLang)} 共 ${translateTemplateIds.length} 个模板，失败 ${failedCount} 个`, 'error');
          return false;
        }
        setStatus(`重新翻译完成：已更新 #${idx + 1} · ${getLanguageLabel(targetLang)} 的 ${translateTemplateIds.length} 个模板译文（内存）`, 'success');
        return true;
      } catch (err) {
        if (isAbortError(err)) {
          setStatus(`已停止翻译 #${idx + 1} · ${getLanguageLabel(targetLang || getCurrentTargetLanguage())}`, 'error');
          return false;
        }
        // 任务失败/请求失败：记录到条目上，列表可见
        if (it && typeof it === 'object') {
          it.translate_error_msg = `任务失败：${err && err.message ? err.message : String(err)}`;
          // 若错误对象携带接口响应，也保留下来方便排查
          if (err && err.queryResponse) it.translate_query_response = err.queryResponse;
        }
        setStatus(`重新翻译失败：${err && err.message ? err.message : String(err)}`, 'error');
        return false;
      } finally {
        const it2 = items[idx];
        if (it2 && typeof it2 === 'object') {
          it2._retranslating = false;
          it2._progress = '';
        }
        renderItemsList();
      }
    }

    async function retranslateItem(idx, translateTemplateIdsOverride, targetLanguagesOverride, signal = null) {
      const languages = Array.isArray(targetLanguagesOverride) && targetLanguagesOverride.length
        ? targetLanguagesOverride.map((language) => normalizeLanguageCode(language)).filter(Boolean)
        : getSelectedTargetLanguages();
      if (!languages.length) {
        setStatus('请先勾选至少一个翻译语种', 'error');
        return false;
      }
      let ok = true;
      for (const language of languages) {
        throwIfAborted(signal);
        const itemOk = await retranslateItemSingleLanguage(idx, translateTemplateIdsOverride, language, signal);
        ok = ok && itemOk;
      }
      return ok;
    }

    async function qualityCheckItemSingleLanguage(idx, translateTemplateIdsOverride, targetLanguageOverride, signal = null) {
      const it = items[idx];
      if (!it || typeof it !== 'object') return false;
      if (it._qualityChecking) return false;
      let targetTranslateTemplateIds = [];
      let targetLang = '';
      try {
        throwIfAborted(signal);
        saveConfig();
        const originArr = deserializeContentArray(it.origin_content, 'origin_content');
        const qualityTemplateIds = getQualityTemplateIds();
        if (!qualityTemplateIds.length) {
          throw new Error('请先填写至少一个质量分析模板id');
        }
        targetLang = normalizeLanguageCode(targetLanguageOverride || it.target_lang || getCurrentTargetLanguage());
        if (!targetLang) {
          throw new Error('请先勾选至少一个翻译语种');
        }
        const translateTemplateIds = Array.isArray(translateTemplateIdsOverride) && translateTemplateIdsOverride.length
          ? translateTemplateIdsOverride.filter((value) => value)
          : getOrderedTranslateTemplateIdsForItem(it, targetLang).filter((translateTemplateId) => {
            const translateResult = getItemTranslateResult(it, translateTemplateId, targetLang);
            return !!getTranslateResultText(translateResult);
          });
        targetTranslateTemplateIds = translateTemplateIds.slice();
        if (!translateTemplateIds.length) {
          throw new Error('请先完成至少一个译文模板的翻译');
        }

        it._qualityChecking = true;
        it._quality_progress = '创建中';
        ensureItemQualityResults(it, targetLang);
        renderItemsList();
        setStatus(`正在进行质量检查 #${idx + 1} · ${getLanguageLabel(targetLang)} ...`, '');

        const mappedOriginLang = mapLanguageToZhDesc(it.origin_lang ?? '');
        const mappedTargetLang = mapLanguageToZhDesc(targetLang);
        let failedCount = 0;
        for (let translateIdx = 0; translateIdx < translateTemplateIds.length; translateIdx += 1) {
          const translateTemplateId = translateTemplateIds[translateIdx];
          const translateResult = getItemTranslateResult(it, translateTemplateId, targetLang);
          const translatedText = getTranslateResultText(translateResult);
          for (let qualityIdx = 0; qualityIdx < qualityTemplateIds.length; qualityIdx += 1) {
            const templateId = qualityTemplateIds[qualityIdx];
              const resultsForTranslate = ensureItemQualityResultsForTranslate(it, translateTemplateId, targetLang);
              resultsForTranslate[templateId] = {
                task_id: '',
                text: '',
                query_response: null,
                error_msg: '',
              };
              const progressText = `质检 ${getLanguageLabel(targetLang)} · 译文模板 ${translateIdx + 1}/${translateTemplateIds.length} · 质检模板 ${qualityIdx + 1}/${qualityTemplateIds.length}`;
              const translationValidationError = getTranslationValidationError(translatedText, it.origin_rows);
              if (translationValidationError) {
                failedCount++;
                resultsForTranslate[templateId] = {
                  task_id: '',
                  text: '',
                  query_response: null,
                  error_msg: `质检跳过：${translationValidationError}`,
                };
                syncPrimaryQualityFields(it, getCurrentTargetLanguage());
                renderItemsList();
                if (selected === idx) refreshSelectedQualityPreview();
                continue;
              }
              try {
                const res = await requestLlmChatAsync({
                  templateVariablesObj: {
                    PROMPT: buildQualityCheckPrompt({
                      originItems: originArr,
                      translatedText,
                      originLang: mappedOriginLang,
                      targetLang: mappedTargetLang,
                    }),
                    LANGUAGE: mappedTargetLang,
                    SUBTITLE_LEN: it.origin_rows || '',
                    ORIGIN_LANG: mappedOriginLang,
                  },
                  templateIdValue: templateId,
                  emptyTemplateMessage: '请先填写质量分析模板id',
                  signal,
                  onProgress: ({ stage, progress, taskId }) => {
                    if (stage === 'create') it._quality_progress = progress ? `${progressText} ${progress}` : `${progressText} 创建中`;
                    else if (stage === 'created' && taskId) {
                      resultsForTranslate[templateId].task_id = taskId;
                      it._quality_progress = `${progressText} 已创建`;
                    }
                    else if (typeof progress !== 'undefined' && progress !== null && progress !== '') it._quality_progress = `${progressText} ${progress}`;
                    else it._quality_progress = `${progressText} 进行中`;
                    syncPrimaryQualityFields(it, getCurrentTargetLanguage());
                    renderItemsList();
                    if (selected === idx) refreshSelectedQualityPreview();
                  },
                });

                resultsForTranslate[templateId] = {
                  task_id: res.taskId || resultsForTranslate[templateId].task_id || '',
                  text: res.text || '',
                  query_response: res.queryResponse || null,
                  error_msg: '',
                };
              } catch (err) {
                failedCount++;
                resultsForTranslate[templateId] = {
                  task_id: resultsForTranslate[templateId].task_id || '',
                  text: '',
                  query_response: err && err.queryResponse ? err.queryResponse : null,
                  error_msg: `质检失败：${err && err.message ? err.message : String(err)}`,
                };
                if (isAbortError(err)) throw err;
              }
              syncPrimaryQualityFields(it, getCurrentTargetLanguage());
              renderItemsList();
              if (selected === idx) refreshSelectedQualityPreview();
          }
        }

        syncPrimaryQualityFields(it, getCurrentTargetLanguage());
        if (selected === idx) {
          renderQualityTemplateSelector();
          renderQualityPreview(it);
        }
        if (failedCount > 0) {
          setStatus(`质量检查完成：#${idx + 1} · ${getLanguageLabel(targetLang)} 共 ${translateTemplateIds.length} 个译文模板，失败 ${failedCount} 个`, 'error');
          return false;
        }
        setStatus(`质量检查完成：已更新 #${idx + 1} · ${getLanguageLabel(targetLang)} 的 ${translateTemplateIds.length} 个译文模板质检结果（内存）`, 'success');
        return true;
      } catch (err) {
        if (isAbortError(err)) {
          setStatus(`已停止质检 #${idx + 1} · ${getLanguageLabel(targetLang || getCurrentTargetLanguage())}`, 'error');
          return false;
        }
        if (it && typeof it === 'object') {
          const fallbackTranslateTemplateIds = targetTranslateTemplateIds.length ? targetTranslateTemplateIds : [getPrimaryTranslateTemplateId()].filter(Boolean);
          fallbackTranslateTemplateIds.forEach((translateTemplateId) => {
            const resultsForTranslate = ensureItemQualityResultsForTranslate(it, translateTemplateId, targetLang);
            getQualityTemplateIds().forEach((templateId) => {
              resultsForTranslate[templateId] = {
                task_id: '',
                text: '',
                query_response: err && err.queryResponse ? err.queryResponse : null,
                error_msg: `质检失败：${err && err.message ? err.message : String(err)}`,
              };
            });
          });
          syncPrimaryQualityFields(it, getCurrentTargetLanguage());
        }
        if (selected === idx) {
          renderQualityPreview(it);
        }
        setStatus(`质量检查失败：${err && err.message ? err.message : String(err)}`, 'error');
        return false;
      } finally {
        const it2 = items[idx];
        if (it2 && typeof it2 === 'object') {
          it2._qualityChecking = false;
          it2._quality_progress = '';
        }
        renderItemsList();
      }
    }

    // 格式化时间为 HH:MM:SS
    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // 格式化时长（毫秒转为可读格式）
    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}时${minutes}分${seconds}秒`;
      } else if (minutes > 0) {
        return `${minutes}分${seconds}秒`;
      } else {
        return `${seconds}秒`;
      }
    }

    // 更新翻译时间显示
    function updateTranslateTime(startTime, endTime) {
      if (!startTime) {
        translateTimeEl.style.display = 'none';
        return;
      }
      timeStartEl.textContent = formatTime(startTime);
      if (endTime) {
        timeEndEl.textContent = formatTime(endTime);
        const duration = endTime.getTime() - startTime.getTime();
        timeDurationEl.textContent = formatDuration(duration);
      } else {
        timeEndEl.textContent = '进行中...';
        timeDurationEl.textContent = '-';
      }
      translateTimeEl.style.display = 'flex';
    }

    async function runLimitedQueue(entries, concurrency, worker, signal) {
      let cursor = 0;
      const workerCount = Math.max(1, Math.min(concurrency, entries.length));
      async function runWorker() {
        while (cursor < entries.length) {
          throwIfAborted(signal);
          const current = cursor;
          cursor += 1;
          await worker(entries[current], current);
        }
      }
      await Promise.all(Array.from({ length: workerCount }, () => runWorker()));
    }

    bulkRetranslateBtn.addEventListener('click', async () => {
      if (bulkRunning) return;
      const indices = Array.from(checkedSet).filter((i) => Number.isInteger(i) && i >= 0 && i < items.length).sort((a, b) => a - b);
      if (indices.length === 0) return;
      bulkRunning = true;
      batchAbortController = new AbortController();
      updateBulkControls();
      await requestBatchWakeLock();

      // 记录开始时间
      const batchStartTime = new Date();
      updateTranslateTime(batchStartTime, null);

      try {
        const languages = getSelectedTargetLanguages();
        const fileCount = indices.length;
        const totalJobs = languages.length * fileCount;
        setStatus(`开始全部翻译：共 ${fileCount} 条 × ${languages.length} 个语种，按“语种 -> 文件”顺序执行，每语种最多 3 个并发`, '');
        let done = 0;
        let failed = 0;
        for (let languageIdx = 0; languageIdx < languages.length; languageIdx += 1) {
          const language = languages[languageIdx];
          await runLimitedQueue(indices, 3, async (idx, fileIdx) => {
            if (batchAbortController?.signal?.aborted) throw new DOMException('已手动终止', 'AbortError');
            setStatus(`全部翻译中：语种 ${languageIdx + 1}/${languages.length} · ${getLanguageLabel(language)}，文件 ${fileIdx + 1}/${fileCount}（完成 ${done}/${totalJobs}，失败 ${failed}）`, '');
            try {
              const ok = await retranslateItem(idx, null, [language], batchAbortController?.signal);
              if (!ok) failed += 1;
            } catch (e) {
              if (!isAbortError(e)) {
                failed += 1;
                console.error('全部翻译异常:', e);
              }
              throw e;
            } finally {
              done += 1;
              setStatus(`全部翻译中：完成 ${done}/${totalJobs}，失败 ${failed}`, '');
            }
          }, batchAbortController?.signal);
        }

        if (failed > 0) {
          setStatus(`全部翻译完成：共 ${totalJobs} 组任务，失败 ${failed}（可重试失败项）`, 'error');
        } else {
          setStatus(`全部翻译完成：共 ${totalJobs} 组任务`, 'success');
        }
      } catch (err) {
        if (isAbortError(err)) {
          setStatus('全部翻译已停止', 'error');
        } else {
        setStatus(`全部翻译中断：${err && err.message ? err.message : String(err)}`, 'error');
        }
      } finally {
        bulkRunning = false;
        batchAbortController = null;
        updateBulkControls();
        // 记录结束时间
        const batchEndTime = new Date();
        updateTranslateTime(batchStartTime, batchEndTime);
        await releaseBatchWakeLock();
      }
    });

    retryFailedBtn.addEventListener('click', async () => {
      if (bulkRunning || qualityRunning) return;
      const languages = getSelectedTargetLanguages();
      const jobs = [];
      languages.forEach((language) => {
        Array.from(checkedSet)
          .filter((idx) => Number.isInteger(idx) && idx >= 0 && idx < items.length)
          .sort((a, b) => a - b)
          .forEach((idx) => {
            const translateTemplateIds = getFailedTranslateTemplateIds(items[idx], language);
            const qualityTranslateTemplateIds = getFailedQualityTranslateTemplateIds(items[idx], language);
            if (translateTemplateIds.length || qualityTranslateTemplateIds.length) {
              jobs.push({ idx, language, translateTemplateIds, qualityTranslateTemplateIds });
            }
          });
      });

      if (!jobs.length) {
        setStatus('没有需要重试的失败任务', 'success');
        updateBulkControls();
        return;
      }

      bulkRunning = true;
      qualityRunning = true;
      batchAbortController = new AbortController();
      updateBulkControls();
      await requestBatchWakeLock();
      try {
        const MAX_ROUNDS = 3;
        let done = 0;
        let failed = 0;
        setStatus(`开始失败重试：共 ${jobs.length} 组，最多 ${MAX_ROUNDS} 轮，按“语种 -> 文件”顺序执行`, '');

        for (const job of jobs) {
          throwIfAborted(batchAbortController?.signal);
          let jobOk = false;
          for (let round = 1; round <= MAX_ROUNDS; round += 1) {
            throwIfAborted(batchAbortController?.signal);
            const remainingTranslate = getFailedTranslateTemplateIds(items[job.idx], job.language);
            const remainingQuality = getFailedQualityTranslateTemplateIds(items[job.idx], job.language);
            if (!remainingTranslate.length && !remainingQuality.length) {
              jobOk = true;
              break;
            }

            try {
              setStatus(`失败重试中：第 ${round}/${MAX_ROUNDS} 轮，完成 ${done}/${jobs.length}，失败 ${failed}（#${job.idx + 1} ${getLanguageLabel(job.language)}）`, '');
              if (remainingTranslate.length) {
                await retranslateItem(job.idx, remainingTranslate, [job.language], batchAbortController?.signal);
              }
              const retryQualityTemplateIds = Array.from(new Set(getFailedQualityTranslateTemplateIds(items[job.idx], job.language)))
                .filter((templateId) => {
                  const translateResult = getItemTranslateResult(items[job.idx], templateId, job.language);
                  return !!getTranslateResultText(translateResult);
                });
              if (retryQualityTemplateIds.length) {
                await qualityCheckItem(job.idx, retryQualityTemplateIds, [job.language], batchAbortController?.signal);
              }
              const postTranslateFailed = getFailedTranslateTemplateIds(items[job.idx], job.language);
              const postQualityFailed = getFailedQualityTranslateTemplateIds(items[job.idx], job.language);
              if (!postTranslateFailed.length && !postQualityFailed.length) {
                jobOk = true;
                break;
              }
            } catch (err) {
              console.error('失败任务重试异常:', err);
            }

            if (round < MAX_ROUNDS) {
              await sleep(600 * round, batchAbortController?.signal);
            }
          }

          done += 1;
          if (!jobOk) failed += 1;
          setStatus(`失败重试中：完成 ${done}/${jobs.length}，失败 ${failed}`, '');
        }

        setStatus(`失败重试完成：共 ${jobs.length} 组${failed ? `，仍有 ${failed} 组未完全恢复` : ''}`, failed ? 'error' : 'success');
      } catch (err) {
        if (isAbortError(err)) {
          setStatus('失败重试已停止', 'error');
        } else {
          setStatus(`失败重试中断：${err && err.message ? err.message : String(err)}`, 'error');
        }
      } finally {
        bulkRunning = false;
        qualityRunning = false;
        batchAbortController = null;
        updateBulkControls();
        await releaseBatchWakeLock();
      }
    });

    // 下载文本文件
    function downloadTextFile(filename, content) {
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadBlobFile(filename, blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function toUtf8Bytes(text) {
      return new TextEncoder().encode(String(text));
    }

    function crc32(bytes) {
      const table = crc32.table || (crc32.table = (() => {
        const t = new Uint32Array(256);
        for (let i = 0; i < 256; i += 1) {
          let c = i;
          for (let k = 0; k < 8; k += 1) {
            c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          }
          t[i] = c >>> 0;
        }
        return t;
      })());
      let c = 0xffffffff;
      for (let i = 0; i < bytes.length; i += 1) {
        c = table[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
      }
      return (c ^ 0xffffffff) >>> 0;
    }

    function u16(v) {
      return [v & 0xff, (v >>> 8) & 0xff];
    }

    function u32(v) {
      return [v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff];
    }

    function concatUint8Arrays(chunks) {
      const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
      const out = new Uint8Array(total);
      let offset = 0;
      chunks.forEach((chunk) => {
        out.set(chunk, offset);
        offset += chunk.length;
      });
      return out;
    }

    function buildZipBlob(files) {
      const localParts = [];
      const centralParts = [];
      let localOffset = 0;

      files.forEach((file) => {
        const nameBytes = toUtf8Bytes(file.path.replace(/\\/g, '/'));
        const dataBytes = file.data instanceof Uint8Array ? file.data : toUtf8Bytes(file.data);
        const crc = crc32(dataBytes);
        const size = dataBytes.length;
        const entryOffset = localOffset;

        const localHeader = new Uint8Array([
          0x50, 0x4b, 0x03, 0x04,
          ...u16(20),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(crc),
          ...u32(size),
          ...u32(size),
          ...u16(nameBytes.length),
          ...u16(0),
        ]);
        localParts.push(localHeader, nameBytes, dataBytes);
        localOffset += localHeader.length + nameBytes.length + dataBytes.length;

        const centralHeader = new Uint8Array([
          0x50, 0x4b, 0x01, 0x02,
          ...u16(20),
          ...u16(20),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(crc),
          ...u32(size),
          ...u32(size),
          ...u16(nameBytes.length),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(0),
          ...u32(entryOffset),
        ]);
        centralParts.push(centralHeader, nameBytes);
      });

      const localData = concatUint8Arrays(localParts);
      const centralDir = concatUint8Arrays(centralParts);
      const endRecord = new Uint8Array([
        0x50, 0x4b, 0x05, 0x06,
        ...u16(0),
        ...u16(0),
        ...u16(files.length),
        ...u16(files.length),
        ...u32(centralDir.length),
        ...u32(localData.length),
        ...u16(0),
      ]);
      return new Blob([localData, centralDir, endRecord], { type: 'application/zip' });
    }

    function sanitizeZipName(name) {
      return String(name || 'export').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_');
    }

    function serializeItemJson(obj) {
      return JSON.stringify(obj, null, 2);
    }

    function buildExportZipFilesForTemplate(templateId) {
      const languages = getSelectedTargetLanguages();
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const files = [];
      const selectedItems = getCheckedItemsSorted();
      selectedItems.forEach((it) => {
        const originArr = deserializeContentArray(it.origin_content, 'origin_content');
        const itemTitle = `item_${String(it.origin_rows || originArr.length || '0')}`;
        languages.forEach((language) => {
          const translateResult = getItemTranslateResult(it, templateId, language);
          const translateText = getTranslateResultText(translateResult);
          const qualityResult = getItemQualityResult(it, qualityTemplateId, templateId, language);
          const qualityText = getQualityResultRawText(qualityResult);
          if (!translateText && !qualityText) return;
          const itemIndex = items.indexOf(it) + 1;
          const baseDir = `${sanitizeZipName(templateId)}/${sanitizeZipName(language)}/${sanitizeZipName(itemTitle)}_${itemIndex}`;
          files.push({ path: `${baseDir}/origin.json`, data: serializeItemJson(originArr) });
          if (translateText) files.push({ path: `${baseDir}/translate.json`, data: translateText });
          if (qualityText) files.push({ path: `${baseDir}/quality.txt`, data: qualityText });
          files.push({
            path: `${baseDir}/meta.json`,
            data: serializeItemJson({
              file: fileNameEl.textContent || '',
              item_index: itemIndex,
              language,
              template_id: templateId,
              quality_template_id: qualityTemplateId,
              has_translate: !!translateText,
              has_quality: !!qualityText,
            }),
          });
        });
      });
      return files;
    }

    function buildConclusionCsv(rows) {
      const header = ['template_index', 'template_id', 'language', 'language_code', 'avg_score', 'score_count', 'total_avg'];
      const lines = ['\ufeff' + header.join(',')];
      rows.forEach((row) => {
        lines.push([
          row.templateIndex,
          row.templateId,
          row.language,
          row.languageCode,
          row.avgScore,
          row.scoreCount,
          row.totalAvg,
        ].map((value) => `"${String(value ?? '').replace(/"/g, '""')}"`).join(','));
      });
      return lines.join('\n');
    }

    function buildProofreadGroups(selectedItems, mode, translateTemplateId) {
      const groups = new Map();
      let failed = 0;

      for (const it of selectedItems) {
        try {
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;
          const groupKey = mode === 'origin' ? targetLang : targetLang;
          const sectionTitle = mode === 'origin'
            ? `${targetLang}_${firstS}:`
            : `${targetLang}_${firstS}:`;

          let lines = [];
          if (mode === 'origin') {
            lines = originArr.map((item) => (item && item.t != null ? String(item.t) : ''));
          } else {
            const translateResult = getItemTranslateResult(it, translateTemplateId);
            const translateText = getTranslateResultText(translateResult);
            const translateArr = deserializeContentArray(translateText, 'data.text');
            lines = translateArr.map((item) => (item && item.t != null ? String(item.t) : ''));
          }

          const section = `${sectionTitle}\n${lines.join('\n')}`;
          if (!groups.has(groupKey)) groups.set(groupKey, []);
          groups.get(groupKey).push(section);
        } catch (err) {
          failed++;
          console.error('处理校对导出条目失败:', err);
        }
      }

      return { groups, failed };
    }

    // 批量导出已勾选且有翻译结果的条目（文本格式）
    if (exportBtn) exportBtn.addEventListener('click', async () => {
