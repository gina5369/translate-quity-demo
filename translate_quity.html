<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM 翻译结果查看</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: #1e88e5;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      min-height: 0;
    }
    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .header-title {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .header-top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .header-template-row {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(300px, 1fr);
      gap: 10px;
      align-items: stretch;
      min-width: 0;
    }
    .template-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .template-section-title {
      font-size: 12px;
      line-height: 1;
      color: rgba(255,255,255,0.86);
      font-weight: 700;
    }
    .translate-stats {
      display: flex;
      gap: 12px;
      font-size: 13px;
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 4px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: default;
    }
    .stat-success { color: #a5d6a7; }
    .stat-warn { color: #ffe082; }
    .stat-fail { color: #ef9a9a; }
    .translate-time {
      display: flex;
      gap: 12px;
      font-size: 12px;
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 4px;
    }
    .time-item { color: #e0e0e0; }
    .time-duration { color: #81d4fa; font-weight: bold; }
    .template-configs {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      align-items: stretch;
      gap: 10px;
      min-width: 0;
    }
    .template-config-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      color: #fff;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.2);
      min-width: 0;
    }
    .template-config-row label {
      white-space: nowrap;
      font-weight: 700;
    }
    .template-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .template-input-group input {
      flex: 1 1 auto;
      min-width: 120px;
    }
    .quality-template-avg {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.92);
      font-size: 10px;
      line-height: 1.35;
      min-width: 0;
    }
    .quality-template-avg strong {
      color: #fff59d;
      font-size: 13px;
    }
    .template-stability-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.95);
      width: fit-content;
      max-width: 100%;
    }
    .template-stability-stats .stat-item {
      white-space: nowrap;
    }
    .quality-template-avg-top,
    .quality-template-avg-sub {
      display: block;
      overflow: visible;
      white-space: normal;
      word-break: break-word;
    }
    .quality-template-avg-placeholder {
      visibility: hidden;
      pointer-events: none;
    }
    .quality-switch-select {
      min-width: 220px;
      padding: 6px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      color: #333;
      font-size: 12px;
    }
    .current-language-select {
      min-width: 120px;
      padding: 6px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      color: #333;
      font-size: 12px;
    }
    .template-extra-list {
      display: contents;
    }
    .template-extra-list .template-config-row {
      justify-content: flex-start;
    }
    .template-add-btn {
      min-width: 32px;
      padding: 6px 10px;
      font-weight: bold;
      line-height: 1;
    }
    .template-remove-btn {
      min-width: 32px;
      padding: 6px 10px;
      background: #b94a48;
      line-height: 1;
    }
    .template-remove-btn:hover { background: #8f3432; }
    .header-summary {
      flex: 1 1 100%;
      display: grid;
      grid-template-columns: minmax(360px, 2fr) minmax(260px, 1fr);
      gap: 10px;
      font-size: 12px;
      font-weight: 400;
      min-width: 0;
    }
    .summary-card {
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.2);
      line-height: 1.45;
      min-width: 0;
    }
    .summary-card strong {
      color: #fff59d;
    }
    .summary-card .summary-line {
      overflow: visible;
      white-space: normal;
      word-break: break-word;
    }
    .summary-card .summary-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      line-height: 1.4;
      font-size: 11px;
    }
    .summary-card .summary-inline span {
      white-space: nowrap;
    }
    .execution-summary-title { margin-bottom: 4px; }
    .execution-summary-scope { color: rgba(255,255,255,0.78); font-size: 10px; font-weight: 400; }
    .execution-summary-row { margin-top: 3px; }
    .execution-summary-row > strong { display: inline-block; min-width: 42px; }
    .execution-summary-fail,
    .execution-summary-note { margin: 2px 0 0 42px; font-size: 10px; line-height: 1.4; }
    .execution-summary-fail { color: #ffd2ce; }
    .execution-summary-note { color: rgba(255,255,255,0.78); }
    .execution-summary-details { margin: 5px 0 0 42px; font-size: 10px; }
    .execution-summary-details summary,
    .execution-pair-details summary { color: #d5eef4; cursor: pointer; }
    .execution-summary-language { margin-top: 4px; line-height: 1.5; }
    .execution-pair-details { margin-top: 3px; }
    .execution-pair-list { margin-top: 2px; color: rgba(255,255,255,0.88); word-break: break-word; }
    .container {
      flex: 1;
      display: flex;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }
    .left-panel {
      flex: 0 0 32%;
      max-width: 32%;
      min-width: 320px;
    }
    .right-panel {
      flex: 1 1 auto;
      min-width: 0;
    }
    .right-stack {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .right-stack .pre-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .right-stack .pre-wrap.pre-origin { flex: 1 1 0; min-height: 150px; }
    .right-stack .pre-wrap.pre-text { flex: 1 1 0; min-height: 150px; }
    .right-stack .pre-wrap.pre-response { flex: 3; }
    .right-stack .pre-wrap pre {
      height: 100%;
    }
    .translate-preview-grid {
      height: 100%;
      display: flex;
      gap: 10px;
      align-items: stretch;
      overflow: auto;
    }
    .translate-preview-panel {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fafafa;
      overflow: hidden;
    }
    .translate-preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
      font-size: 12px;
    }
    .translate-preview-title {
      min-width: 0;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .translate-preview-info {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .translate-preview-meta {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      min-width: 0;
    }
    .translate-preview-meta > span {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      max-width: none;
      word-break: break-all;
      text-align: right;
    }
    .task-id-copy-btn {
      flex: 0 0 auto;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #cfd8dc;
      background: #fff;
      color: #455a64;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
    }
    .translate-preview-panel pre {
      flex: 1;
      margin: 0;
      border: none;
      border-radius: 0;
      background: #0d1117;
      color: #e6edf3;
      box-shadow: none;
    }
    .translate-preview-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      border: 1px dashed #d0d0d0;
      border-radius: 6px;
      background: #fafafa;
      padding: 16px;
      text-align: center;
      white-space: pre-wrap;
    }
    .copy-pre-btn {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 10px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      background: rgba(30, 136, 229, 0.92);
      color: #fff;
      cursor: pointer;
      z-index: 2;
    }
    .copy-pre-btn:hover { background: rgba(21, 101, 192, 0.92); }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fafafa;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .kv {
      display: flex;
      gap: 8px;
      min-width: 0;
    }
    .kv .k { color: #666; flex: 0 0 auto; }
    .kv .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status {
      font-size: 13px;
      min-height: 18px;
      color: #666;
      margin-top: 6px;
    }
    .status.error { color: #c62828; }
    .status.success { color: #2e7d32; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .list-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fafafa;
      font-size: 13px;
    }
    .list-controls label {
      color: #666;
      white-space: nowrap;
    }
    .language-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .language-chip-list .small-btn {
      padding: 6px 10px;
      font-size: 12px;
    }
    .language-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      background: #fff;
      color: #334155;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .language-chip input {
      margin: 0;
    }
    .language-chip.active {
      border-color: #1e88e5;
      background: #e3f2fd;
      color: #0d47a1;
      font-weight: 600;
    }
    .language-chip.select-all {
      border-color: #90a4ae;
      background: #f8fafc;
      font-weight: 600;
    }
    .language-chip.muted {
      color: #64748b;
    }
    .h2-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      justify-content: space-between;
    }
    .actions-left, .actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #fff;
      white-space: nowrap;
      user-select: none;
    }
    .checkbox input { transform: translateY(1px); }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #1e88e5;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #1565c0; }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    input[type="file"] {
      padding: 6px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      max-width: 360px;
    }
    input[type="text"], input[type="password"] {
      padding: 6px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      min-width: 160px;
    }
    .small-btn {
      padding: 6px 10px;
      font-size: 12px;
      background: #455a64;
    }
    .small-btn:hover { background: #37474f; }
    .small-btn.ready-action {
      background: #2e7d32;
      box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.18);
    }
    .small-btn.ready-action:hover { background: #1b5e20; }
    .file-name-pill {
      max-width: 240px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    pre {
      flex: 1;
      margin: 0;
      overflow: auto;
      padding: 10px;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 4px;
      font-size: 13px;
      border: 1px solid #1f2933;
    }

    .list {
      flex: 1;
      overflow: auto;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .item {
      padding: 10px 10px;
      border-top: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .item:first-child { border-top: none; }
    .item:hover { background: #fcfcfc; }
    .item.active {
      background: #e3f2fd;
      border-left: 4px solid #1e88e5;
      padding-left: 6px;
    }
    .item .row1 {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      font-weight: 600;
      color: #222;
      justify-content: space-between;
      align-items: center;
    }
    .item .row1-left {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      min-width: 0;
    }
    .item .row1-left input[type="checkbox"] {
      transform: translateY(1px);
    }
    .item .row1-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }
    .item .row2 {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      padding-left: 24px;
      white-space: pre-line;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 999px;
      background: #f1f3f5;
      color: #555;
      font-variant-numeric: tabular-nums;
    }
    .badge.ok { background: #e8f5e9; color: #1b5e20; }
    .badge.bad { background: #ffebee; color: #b71c1c; }
    .badge.warn { background: #fff8e1; color: #e65100; }
    .badge.run { background: #e3f2fd; color: #0d47a1; }
    .badge.task-id {
      user-select: text;
      cursor: text;
      font-family: Consolas, Monaco, monospace;
      letter-spacing: 0.2px;
    }
    .exec-progress {
      font-size: 10px;
      line-height: 1.2;
      white-space: normal;
      max-width: 100%;
      padding: 4px 6px;
      border-radius: 6px;
      background: #f3f8ff;
      color: #1e3a5f;
    }
    .mini-copy-btn {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #cfd8dc;
      background: #fff;
      color: #455a64;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
    }
    .mini-copy-btn:hover { background: #eceff1; }
    .quality-task-block {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      width: 100%;
    }
    .quality-task-score {
      margin-left: 0;
    }
    .quality-task-issues {
      margin-left: 10px;
    }
    .quality-task-break {
      flex-basis: 100%;
      height: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      text-align: left;
      padding: 8px;
      z-index: 1;
    }
    tbody td {
      border-top: 1px solid #f0f0f0;
      padding: 8px;
      vertical-align: top;
      word-break: break-word;
    }
    tbody tr:hover td { background: #fcfcfc; }
    .col-s { width: 120px; color: #555; font-variant-numeric: tabular-nums; }
    @media (max-width: 1200px) {
      .header-template-row,
      .header-summary {
        grid-template-columns: minmax(0, 1fr);
      }
      .header-top-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top-row">
      <div class="header-title">LLM 翻译结果查看</div>
      <div class="header-top-actions">
      <span id="translate-stats" class="translate-stats" style="display: none;">
        <span class="stat-item stat-success" title="翻译成功（结构正常、无空字符）">✓ <span id="stat-success-pct">0%</span></span>
        <span class="stat-item stat-warn" title="翻译瑕疵（结构正常、有空字符）">⚠ <span id="stat-warn-pct">0%</span></span>
        <span class="stat-item stat-fail" title="翻译失败（结构不正常）">✗ <span id="stat-fail-pct">0%</span></span>
      </span>
      <span id="translate-time" class="translate-time" style="display: none;">
        <span class="time-item">开始: <span id="time-start">-</span></span>
        <span class="time-item">结束: <span id="time-end">-</span></span>
        <span class="time-item time-duration">耗时: <span id="time-duration">-</span></span>
      </span>
        <button id="clear-btn">清空</button>
      </div>
    </div>
    <div class="header-template-row">
      <div class="template-section translation-template-section">
        <div class="template-section-title">翻译模板</div>
        <div class="template-configs">
          <div class="template-config-row">
            <label for="template-id-input">字幕翻译模板id</label>
            <div class="template-input-group">
              <input id="template-id-input" type="text" placeholder="template_id" />
              <button id="add-translate-template-btn" class="small-btn template-add-btn" type="button">+</button>
              <button id="remove-translate-template-btn" class="small-btn template-remove-btn" type="button">-</button>
            </div>
            <span id="translate-template-avg-primary" class="quality-template-avg">
              <span class="quality-template-avg-top">总质检平均分: <strong>-</strong></span>
              <span class="quality-template-avg-sub">语言平均分: -</span>
            </span>
          </div>
          <div id="translate-template-extra-list" class="template-extra-list"></div>
        </div>
      </div>
      <div class="template-section quality-template-section">
        <div class="template-section-title">质检模板</div>
        <div class="template-config-row">
          <label for="quality-template-id-input">质量分析模板id</label>
          <div class="template-input-group">
            <input id="quality-template-id-input" type="text" placeholder="quality_template_id" />
            <button id="remove-quality-template-btn" class="small-btn template-remove-btn" type="button">-</button>
          </div>
          <span class="quality-template-avg quality-template-avg-placeholder" aria-hidden="true">
            <span class="quality-template-avg-top">总质检平均分: <strong>-</strong></span>
            <span class="quality-template-avg-sub">语言平均分: -</span>
          </span>
        </div>
      </div>
    </div>

  <script>

    const qualityTemplateIdInput = document.getElementById('quality-template-id-input');

    // 固定配置（按你的要求写死，不在页面展示）
    const FIXED_TECH_ENDPOINT = 'devaw.aoscdn.com/tech';

    const DEFAULT_TEMPLATE_ID = 'c54707e1-e1eb-4f66-8cf0-c6289ec47f47';
    const DEFAULT_QUALITY_TEMPLATE_ID = '1c5f7a0e-3e52-45a0-9d3f-120c2b7647b6';

    // 语言简写 -> 中文描述
    const LANGUAGE_MAP_ZH = {
      ar: '阿拉伯语',
      bg: '保加利亚语',
      cs: '捷克语',
      da: '丹麦语',
      de: '德语',

      en: '英语',
      es: '西班牙语',
      et: '爱沙尼亚语',
      fi: '芬兰语',
      fr: '法语',
      hi: '印地语',
      hu: '匈牙利语',
      id: '印尼语',
      it: '意大利语',
      ja: '日语',
      ko: '韩语',
      lt: '立陶宛语',
      lv: '拉脱维亚语',
      no: '挪威语',

      pl: '波兰语',
      pt: '葡萄牙语',
      ro: '罗马尼亚语',
      ru: '俄语',
      sk: '斯洛伐克语',
      sl: '斯洛文尼亚语',
      sv: '瑞典语',
      th: '泰语',
      tr: '土耳其语',
      uk: '乌克兰语',
      vi: '越南语',
      zh: '中文',
      tw: '繁体中文',
      'zh-hant': '繁体中文',

    const LANGUAGE_CHOICES = [
      { value: 'zh', label: '中文' },

      { value: 'ja', label: '日语' },
      { value: 'fr', label: '法语' },
      { value: 'es', label: '西班牙语' },
      { value: 'tw', label: '繁体中文' },
      { value: 'pt', label: '葡萄牙语' },
      { value: 'th', label: '泰语' },
      { value: 'ru', label: '俄语' },
      { value: 'id', label: '印尼语' },
      { value: 'vi', label: '越南语' },
      { value: 'hi', label: '印地语' },
    ];

    function mapLanguageToZhDesc(language) {
      const raw = String(language ?? '').trim();
      if (!raw) return '';
      const key = raw.toLowerCase();
      return LANGUAGE_MAP_ZH[key] || raw;
    }

    // 统一换行符为 \n（与 Python 侧保持一致）
    function normalizeNewlines(text) {
      return String(text ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    }

    const fileNameEl = document.getElementById('file-name');
    const itemsCountEl = document.getElementById('items-count');

    const itemsListEl = document.getElementById('items-list');

    const exportOriginJsonBtn = document.getElementById('export-origin-json-btn');
    const exportProofreadOriginBtn = document.getElementById('export-proofread-origin-btn');
    const exportProofreadBtn = document.getElementById('export-proofread-btn');
    const exportQualityResultBtn = document.getElementById('export-quality-result-btn');
    const exportAllZipBtn = document.getElementById('export-all-zip-btn');
    const exportConclusionBtn = document.getElementById('export-conclusion-btn');
    const removeTranslateTemplateBtn = document.getElementById('remove-translate-template-btn');
    const removeQualityTemplateBtn = document.getElementById('remove-quality-template-btn');
    const translateSummaryCardEl = document.getElementById('translate-summary-card');
    const qualitySummaryCardEl = document.getElementById('quality-summary-card');
    const qualityResultTemplateSelectEl = document.getElementById('quality-result-template-select');

    let items = [];
    let selected = -1;
    let lastOriginPretty = '';
    const checkedSet = new Set();
    let bulkRunning = false;
    let qualityRunning = false;
    let batchAbortController = null;
    let batchWakeLock = null;
    let activeBatchStage = '';
    let activeBatchLanguage = '';
    let workflowStartTime = null;
    let workflowActiveOperations = 0;
    let selectedQualityTemplateId = '';
    let selectedTargetLanguages = ['zh'];
    let currentTargetLanguage = 'zh';

    function getAdditionalTranslateTemplateInputs() {
      return Array.from(document.querySelectorAll('.translate-template-extra-input'));
    }

    function getTranslateTemplateIds() {
      const templateIds = [
        (templateIdInput.value || '').trim(),
        ...getAdditionalTranslateTemplateInputs().map((input) => (input.value || '').trim()),
      ].filter((value) => value);
      return Array.from(new Set(templateIds));
    }

    function getPrimaryTranslateTemplateId() {
      return getTranslateTemplateIds()[0] || '';
    }

    function getQualityTemplateIds() {
      const templateIds = [(qualityTemplateIdInput.value || '').trim()].filter((value) => value);
      return Array.from(new Set(templateIds));
    }

    function getPrimaryQualityTemplateId() {
      return getQualityTemplateIds()[0] || '';
    }

    function normalizeLanguageCode(language) {
      const raw = String(language ?? '').trim();
      if (!raw) return '';
      const key = raw.toLowerCase();
      if (key === 'zh-hant' || key === 'zh-tw' || key === 'zh-hk') return 'tw';
      return key;
    }

    function getQualityLanguageFamily(language) {
      const code = normalizeLanguageCode(language);
      if (['zh', 'tw', 'zh-cn', 'zh-sg'].includes(code)) return 'zh';
      return code;
    }

    function isLikelyChineseSubtitle(originItems) {
      const source = (Array.isArray(originItems) ? originItems : [])
        .map((item) => item && item.t != null ? String(item.t) : '')
        .join('');
      const hanCount = (source.match(/[\u3400-\u9fff]/g) || []).length;
      const letterCount = (source.match(/[A-Za-z]/g) || []).length;
      return hanCount >= 8 && hanCount >= letterCount;
    }

    function getQualityEvaluationContext({ originItems, originLang, targetLang }) {
      const originCode = getQualityLanguageFamily(originLang);
      const targetCode = getQualityLanguageFamily(targetLang);
      const sameLanguage = (originCode && targetCode && originCode === targetCode)
        || (!originCode && targetCode === 'zh' && isLikelyChineseSubtitle(originItems));
      if (sameLanguage) {
        return {
          mode: 'same_language_subtitle_proofreading',
          sourceType: '可能包含语音识别错误的中文字幕转写稿',
          originLabel: originCode ? mapLanguageToZhDesc(originLang) : `${getLanguageLabel(targetLang)}（根据原文内容推断）`,
          rules: '按同语种字幕校订评估：不要因为原文本身的ASR识别错误直接扣译文分；区分“已确认错误”和“仅凭文字无法核实的风险”。仅在译文引入无依据的具体金额、人名、机构名、型号，或造成明确语义变化时扣分。原文残缺、缺少音频、缺少结束时间只能标记为待核实，不应单独把分数压到较低。',
        };
      }
      return {
        mode: 'cross_language_translation',
        sourceType: '字幕原文',
        originLabel: originLang ? mapLanguageToZhDesc(originLang) : '未提供（请根据原文自动识别）',
        rules: '按跨语言翻译质量评估：严格比较原文与译文的准确性、完整性、流畅性、一致性和字幕适配性；无法由文本确认的内容应标记为待核实，不要把推测当作确定事实。',
      };
    }

    function getLanguageLabel(language) {
      const normalized = normalizeLanguageCode(language);
      const found = LANGUAGE_CHOICES.find((item) => item.value === normalized);
      return found ? found.label : (mapLanguageToZhDesc(normalized) || normalized || '-');
    }

    function getLanguageShortLabel(language) {
      return String(normalizeLanguageCode(language) || '-').toUpperCase();
    }

    function formatLanguageCodeList(languages) {
      return Array.from(new Set((Array.isArray(languages) ? languages : [])
        .map((language) => normalizeLanguageCode(language))
        .filter(Boolean)))
        .map((language) => getLanguageShortLabel(language))
        .join('/');
    }

    function getFailedTranslateLanguageCodes(it) {
      return getSelectedTargetLanguages().filter((language) => getFailedTranslateTemplateIds(it, language).length > 0);
    }

    function getFailedQualityLanguageCodes(it) {
      return getSelectedTargetLanguages().filter((language) => getFailedQualityTranslateTemplateIds(it, language).length > 0);
    }

    function getSelectedTargetLanguages() {
      return selectedTargetLanguages
        .map((language) => normalizeLanguageCode(language))
        .filter((language, idx, arr) => language && arr.indexOf(language) === idx);
    }

    function getCurrentTargetLanguage() {
      const languages = getSelectedTargetLanguages();
      const normalized = normalizeLanguageCode(currentTargetLanguage);
      if (normalized && languages.includes(normalized)) return normalized;
      return languages[0] || '';
    }

    function ensureLanguageSelectionState() {
      selectedTargetLanguages = getSelectedTargetLanguages();
      const current = normalizeLanguageCode(currentTargetLanguage);
      if (selectedTargetLanguages.length && !selectedTargetLanguages.includes(current)) {
        currentTargetLanguage = selectedTargetLanguages[0];
      } else if (!selectedTargetLanguages.length) {
        currentTargetLanguage = '';
      } else {
        currentTargetLanguage = current;
      }
    }

    function renderTargetLanguageSelector() {
      ensureLanguageSelectionState();
      const selectedSet = new Set(selectedTargetLanguages);
      const allSelected = LANGUAGE_CHOICES.length > 0 && LANGUAGE_CHOICES.every((language) => selectedSet.has(language.value));
      const partiallySelected = selectedSet.size > 0 && !allSelected;
      targetLanguageSelectEl.innerHTML = `
        <label class="language-chip select-all ${allSelected ? 'active' : 'muted'}">
          <input id="language-select-all-checkbox" type="checkbox" ${allSelected ? 'checked' : ''} />
          <span>全选</span>
        </label>
        ${LANGUAGE_CHOICES.map((language) => `
          <label class="language-chip ${selectedSet.has(language.value) ? 'active' : 'muted'}">
            <input class="target-language-checkbox" type="checkbox" value="${escapeHtml(language.value)}" ${selectedSet.has(language.value) ? 'checked' : ''} />
            <span>${escapeHtml(language.label)} (${escapeHtml(language.value)})</span>
          </label>
        `).join('')}
      `;
      const selectAllCheckbox = document.getElementById('language-select-all-checkbox');
      if (selectAllCheckbox) selectAllCheckbox.indeterminate = partiallySelected;
      renderCurrentLanguageSelector();
    }

    function renderCurrentLanguageSelector() {
      ensureLanguageSelectionState();
      const languages = getSelectedTargetLanguages();
      if (!languages.length) {
        currentLanguageSelectEl.innerHTML = '<option value="">未选择</option>';
        currentLanguageSelectEl.disabled = true;
        return;
      }
      currentLanguageSelectEl.disabled = false;
      currentLanguageSelectEl.innerHTML = languages.map((language) => `
        <option value="${escapeHtml(language)}" ${language === currentTargetLanguage ? 'selected' : ''}>
          ${escapeHtml(getLanguageLabel(language))}
        </option>
      `).join('');
    }

    function syncLanguageSelectionFromUI() {
      selectedTargetLanguages = Array.from(targetLanguageSelectEl.querySelectorAll('.target-language-checkbox'))
        .filter((input) => input.checked)
        .map((input) => normalizeLanguageCode(input.value));
      ensureLanguageSelectionState();
      renderTargetLanguageSelector();
      saveConfig();
      applySelectedTargetLanguageToItems();
      renderItemsList();
      if (selected >= 0 && selected < items.length) {
        selectItem(selected);
      } else {
        renderEmptyPreviewPanels(translatePreviewEl, '// 暂无接口响应的 data.text');
        renderEmptyPreviewPanels(qualityPreviewEl, '// 暂无翻译质量结果');
      }
      updateAllQualityTemplateAverageBadges();
    }

    function ensureSelectedQualityTemplateId() {
      const templateIds = getQualityTemplateIds();
      if (!templateIds.length) {
        selectedQualityTemplateId = '';
        return;
      }
      if (!selectedQualityTemplateId || !templateIds.includes(selectedQualityTemplateId)) {
        selectedQualityTemplateId = templateIds[0];
      }
    }

    function getQualityTemplateLabel(templateId, idx) {
      return `模板${idx + 1}: ${templateId}`;
    }

    function renderQualityTemplateSelector() {
      ensureSelectedQualityTemplateId();
      const templateIds = getQualityTemplateIds();
      qualityResultTemplateSelectEl.innerHTML = '';

      if (!templateIds.length) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = '暂无质量分析模板';
        qualityResultTemplateSelectEl.appendChild(option);
        qualityResultTemplateSelectEl.disabled = true;
        return;
      }

      templateIds.forEach((templateId, idx) => {
        const option = document.createElement('option');
        option.value = templateId;
        option.textContent = getQualityTemplateLabel(templateId, idx);
        if (templateId === selectedQualityTemplateId) option.selected = true;
        qualityResultTemplateSelectEl.appendChild(option);
      });
      qualityResultTemplateSelectEl.disabled = templateIds.length <= 1;
      updateAllQualityTemplateAverageBadges();
    }

    function getTranslateTemplateAverageInfo(translateTemplateId) {
      if (!translateTemplateId) {
      return { avgText: '-', langText: '语言质检平均分: -', stabilityHtml: '', title: '暂无字幕翻译模板' };
      }
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const stat = getTemplateQualityStats().find((entry) => entry.translateTemplateId === translateTemplateId);
      const stability = getTemplateStabilityStats(translateTemplateId);
      const perLanguage = stat ? stat.perLanguage : getSelectedTargetLanguages().map((language) => ({ language, avg: null, count: 0 }));
      const scoreCount = perLanguage.reduce((sum, item) => sum + (item.count || 0), 0);
      const avgText = stat && stat.totalAvg != null ? stat.totalAvg.toFixed(2) : '--';
      const languageLabels = perLanguage.length
        ? perLanguage.map((item) => getLanguageShortLabel(item.language)).join(' / ')
        : '-';
      const languageAvgs = perLanguage.length
        ? perLanguage.map((item) => item.avg == null ? '--' : item.avg.toFixed(2)).join(' / ')
        : '-';
      return {
        avgText,
        langText: `语言质检平均分: ${languageLabels} : ${languageAvgs}`,
        stabilityHtml: `
          <span class="template-stability-stats">
            <span class="stat-item stat-success">✓ <span>${stability.successPct.toFixed(2)}% (${stability.success}/${stability.total})</span></span>
            <span class="stat-item stat-warn">⚠ <span>${stability.warnPct.toFixed(2)}% (${stability.warn}/${stability.total})</span></span>
            <span class="stat-item stat-fail">✗ <span>${stability.failPct.toFixed(2)}% (${stability.fail}/${stability.total})</span></span>
          </span>
          <span class="quality-template-avg-sub">文件完成 ${stability.fileCompleted}/${stability.fileTotal}</span>
        `,
        title: `翻译模板: ${translateTemplateId}${qualityTemplateId ? `，质检模板: ${qualityTemplateId}` : ''}${scoreCount ? `，共 ${scoreCount} 条有分数` : '，暂无分数'}；稳定性按当前勾选语言统计`,
      };
    }

    function updateTranslateTemplateAverageBadge(el, translateTemplateId) {
      if (!el) return;
      const { avgText, langText, stabilityHtml, title } = getTranslateTemplateAverageInfo(translateTemplateId);
      el.innerHTML = `
        <span class="quality-template-avg-top">总质检平均分: <strong>${escapeHtml(avgText)}</strong></span>
        <span class="quality-template-avg-sub">${escapeHtml(langText)}</span>
        ${stabilityHtml}
      `;
      el.title = title;
    }

    function updateAllQualityTemplateAverageBadges() {
      updateTranslateTemplateAverageBadge(translateTemplateAvgPrimaryEl, (templateIdInput.value || '').trim());
      const extraRows = Array.from(translateTemplateExtraListEl.querySelectorAll('.template-config-row'));
      extraRows.forEach((row) => {
        const badgeEl = row.querySelector('.quality-template-avg');
        const inputEl = row.querySelector('.translate-template-extra-input');
        updateTranslateTemplateAverageBadge(badgeEl, inputEl ? (inputEl.value || '').trim() : '');
      });
      updateHeaderSummaries();
    }

    function getTemplateQualityStats() {
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const languages = getSelectedTargetLanguages();
      return getTranslateTemplateIds().map((translateTemplateId, idx) => {
        const perLanguage = languages.map((language) => {
          const scores = items
            .map((it) => {
              const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId, language);
              return extractQualityScore(getQualityResultRawText(qualityResult));
            })
            .filter((score) => score != null);
          const avg = scores.length ? scores.reduce((sum, score) => sum + score, 0) / scores.length : null;
          return { language, avg, count: scores.length, scores };
        });
        const allScores = perLanguage.flatMap((entry) => entry.scores || []);
        const totalAvg = allScores.length ? allScores.reduce((sum, score) => sum + score, 0) / allScores.length : null;
        return { idx, translateTemplateId, totalAvg, scoreCount: allScores.length, perLanguage };
      });
    }

    function buildConclusionRows() {
      const stats = getTemplateQualityStats().slice().sort((a, b) => {
        if (a.totalAvg == null && b.totalAvg == null) return a.idx - b.idx;
        if (a.totalAvg == null) return 1;
        if (b.totalAvg == null) return -1;
        return b.totalAvg - a.totalAvg;
      });
      const rows = [];
      stats.forEach((templateStat) => {
        templateStat.perLanguage.forEach((languageStat) => {
          rows.push({
            templateIndex: templateStat.idx + 1,
            templateId: templateStat.translateTemplateId,
            language: getLanguageLabel(languageStat.language),
            languageCode: languageStat.language,
            avgScore: languageStat.avg == null ? '' : languageStat.avg.toFixed(2),
            scoreCount: languageStat.count,
            totalAvg: templateStat.totalAvg == null ? '' : templateStat.totalAvg.toFixed(2),
          });
        });
      });
      return rows;
    }

    function formatScore(score) {
      return score == null || Number.isNaN(Number(score)) ? '-' : Number(score).toFixed(2);
    }

    const QUALITY_TIE_DIFF = 0.5;
    const QUALITY_CLEAR_DIFF = 1;
    const QUALITY_LOW_SCORE = 80;

    function formatSignedDiff(diff) {
      if (diff == null || Number.isNaN(Number(diff))) return '';
      return `${diff >= 0 ? '+' : ''}${formatScore(diff)}`;
    }

    function formatLimitedList(list, limit = 3) {
      if (!list.length) return '';
      const shown = list.slice(0, limit).join('、');
      return list.length > limit ? `${shown}等${list.length}项` : shown;
    }

    function buildTemplateRankingText(scored, limit = 4) {
      if (!Array.isArray(scored) || !scored.length) return '暂无可排序模板';
      const items = scored.slice(0, limit).map((entry) => `模板${entry.idx + 1} ${formatScore(entry.totalAvg)}`);
      return scored.length > limit ? `${items.join(' > ')} 等${scored.length - limit}项` : items.join(' > ');
    }

    function getLanguageComparisonRecords(stats) {
      const languages = getSelectedTargetLanguages();
      return languages.map((language) => {
        const entries = stats
          .map((templateStat) => {
            const languageStat = templateStat.perLanguage.find((entry) => entry.language === language);
            return languageStat && languageStat.avg != null
              ? { templateStat, avg: languageStat.avg, count: languageStat.count || 0 }
              : null;
          })
          .filter(Boolean)
          .sort((a, b) => b.avg - a.avg);
        return { language, entries };
      }).filter((record) => record.entries.length);
    }

    function describeOverallRecommendation(scored) {
      if (!scored.length) return '总结：暂无可统计分数';
      const best = scored[0];
      const second = scored[1];
      if (!second || second.totalAvg == null) {
        return `总结：推荐模板${best.idx + 1}，总均分 ${formatScore(best.totalAvg)}。`;
      }
      const gap = best.totalAvg - second.totalAvg;
      if (gap >= QUALITY_CLEAR_DIFF) {
        return `总结：推荐模板${best.idx + 1}，总均分 ${formatScore(best.totalAvg)}，领先模板${second.idx + 1} ${formatScore(gap)} 分，综合优势较明确。`;
      }
      if (gap >= QUALITY_TIE_DIFF) {
        return `总结：模板${best.idx + 1}综合略优，总均分 ${formatScore(best.totalAvg)}，但只领先模板${second.idx + 1} ${formatScore(gap)} 分，建议按重点语言再确认。`;
      }
      return `总结：模板${best.idx + 1}当前最高，总均分 ${formatScore(best.totalAvg)}，但与模板${second.idx + 1}仅差 ${formatScore(gap)} 分，整体可视为基本持平。`;
    }

    function buildTemplateAnalysisLines(stats) {
      const scored = stats
        .filter((entry) => entry.translateTemplateId && entry.totalAvg != null)
        .sort((a, b) => b.totalAvg - a.totalAvg);
      if (!scored.length) return ['暂无可统计的模型优缺点'];
      const comparisonRecords = getLanguageComparisonRecords(scored);
      return scored.map((templateStat) => {
        const clearAdvantages = [];
        const slightAdvantages = [];
        const nearTies = [];
        const relativeWeaknesses = [];
        const lowScoreRisks = [];
        const missingLanguages = (templateStat.perLanguage || [])
          .filter((entry) => entry.avg == null)
          .map((entry) => getLanguageLabel(entry.language));

        comparisonRecords.forEach((record) => {
          const current = record.entries.find((entry) => entry.templateStat.translateTemplateId === templateStat.translateTemplateId);
          if (!current) return;
          const best = record.entries[0];
          const second = record.entries.find((entry) => entry.templateStat.translateTemplateId !== templateStat.translateTemplateId);
          const label = `${getLanguageLabel(record.language)} ${formatScore(current.avg)}`;
          if (current.avg < QUALITY_LOW_SCORE) lowScoreRisks.push(label);
          if (best.templateStat.translateTemplateId === templateStat.translateTemplateId) {
            const gap = second ? current.avg - second.avg : null;
            const labelWithGap = second ? `${label}(${formatSignedDiff(gap)})` : label;
            if (!second || gap >= QUALITY_CLEAR_DIFF) clearAdvantages.push(labelWithGap);
            else if (gap >= QUALITY_TIE_DIFF) slightAdvantages.push(labelWithGap);
            else nearTies.push(labelWithGap);
          } else {
            const gap = best.avg - current.avg;
            if (gap >= QUALITY_CLEAR_DIFF) {
              relativeWeaknesses.push(`${label}(-${formatScore(gap)})`);
            } else {
              nearTies.push(label);
            }
          }
        });

        const strengthParts = [
          clearAdvantages.length ? `明显优势 ${formatLimitedList(clearAdvantages)}` : '',
          slightAdvantages.length ? `轻微领先 ${formatLimitedList(slightAdvantages)}` : '',
          !clearAdvantages.length && !slightAdvantages.length && nearTies.length ? `基本持平 ${formatLimitedList(nearTies)}` : '',
        ].filter(Boolean);
        const riskParts = [
          relativeWeaknesses.length ? `相对落后 ${formatLimitedList(relativeWeaknesses)}` : '',
          lowScoreRisks.length ? `低分风险 ${formatLimitedList(lowScoreRisks, 2)}` : '',
          missingLanguages.length ? `缺分语言 ${formatLimitedList(missingLanguages, 3)}` : '',
        ].filter(Boolean);
        return `模板${templateStat.idx + 1}: 总均分 ${formatScore(templateStat.totalAvg)}，有分数 ${templateStat.scoreCount || 0} 条；${strengthParts.join('；') || '无突出优势'}；${riskParts.join('；') || '暂无明显短板'}`;
      });
    }

    function buildLanguageComparisonSummary(scored) {
      if (!scored.length) return '暂无可统计分数';
      const sorted = [...scored].sort((a, b) => b.totalAvg - a.totalAvg);
      const topTwo = sorted.slice(0, 2);
      if (topTwo.length < 2) {
        const only = topTwo[0];
        const missing = (only.perLanguage || []).filter((entry) => entry.avg == null).map((entry) => getLanguageLabel(entry.language));
        return `模板${only.idx + 1}当前最高，总均分 ${formatScore(only.totalAvg)}${missing.length ? `，缺分语言：${formatLimitedList(missing, 4)}` : ''}。`;
      }
      const best = topTwo[0];
      const second = topTwo[1];
      const betterBest = [];
      const betterSecond = [];
      const sharedLow = [];
      const tied = [];
      const missingLanguages = [];

      getLanguageComparisonRecords(topTwo).forEach((record) => {
        const first = record.entries.find((entry) => entry.templateStat.translateTemplateId === best.translateTemplateId);
        const other = record.entries.find((entry) => entry.templateStat.translateTemplateId === second.translateTemplateId);
        if (!first || !other) {
          missingLanguages.push(getLanguageLabel(record.language));
          return;
        }
        const gap = first.avg - other.avg;
        const bestLabel = `${getLanguageLabel(record.language)} ${formatScore(first.avg)}`;
        const secondLabel = `${getLanguageLabel(record.language)} ${formatScore(other.avg)}`;
        if (first.avg < QUALITY_LOW_SCORE && other.avg < QUALITY_LOW_SCORE) {
          sharedLow.push(getLanguageLabel(record.language));
        }
        if (gap >= QUALITY_CLEAR_DIFF) {
          betterBest.push(bestLabel);
        } else if (gap >= QUALITY_TIE_DIFF) {
          betterBest.push(bestLabel);
        } else if (gap <= -QUALITY_CLEAR_DIFF) {
          betterSecond.push(secondLabel);
        } else if (gap <= -QUALITY_TIE_DIFF) {
          betterSecond.push(secondLabel);
        } else {
          tied.push(getLanguageLabel(record.language));
        }
      });

      const bestLead = betterBest.length ? `模板${best.idx + 1}在${formatLimitedList(betterBest, 4)}上更稳` : `模板${best.idx + 1}暂无明显领先语言`;
      const secondLead = betterSecond.length ? `模板${second.idx + 1}在${formatLimitedList(betterSecond, 4)}上更稳` : `模板${second.idx + 1}暂无明显领先语言`;
      const tieText = tied.length ? `；基本持平：${formatLimitedList(tied, 4)}` : '';
      const lowText = sharedLow.length ? `；共同低分风险：${formatLimitedList(sharedLow, 3)}` : '';
      const missingText = missingLanguages.length ? `；缺分语言：${formatLimitedList(missingLanguages, 3)}` : '';
      return `${bestLead}；${secondLead}${tieText}${lowText}${missingText}`;
    }

    function getTemplateStabilityStats(translateTemplateId) {
      const languages = getSelectedTargetLanguages();
      const total = items.length * languages.length;
      const stats = { total, fileTotal: items.length, success: 0, warn: 0, fail: 0, pending: 0, fileCompleted: 0, filePending: 0 };
      items.forEach((it) => {
        let fileCompletedLanguages = 0;
        languages.forEach((language) => {
          const translateResult = getItemTranslateResult(it, translateTemplateId, language);
          if (!translateResult) {
            stats.pending += 1;
            return;
          }
          const text = getTranslateResultText(translateResult);
          if (!text) {
            if (translateResult.error_msg || translateResult.parse_error) stats.fail += 1;
            else stats.pending += 1;
            return;
          }
          const statusInfo = getTranslateResultStatusInfo(it, translateResult);
          if (statusInfo.cls === 'ok') stats.success += 1;
          else if (statusInfo.cls === 'warn') stats.warn += 1;
          else stats.fail += 1;
          fileCompletedLanguages += 1;
        });
        if (!languages.length) return;
        if (fileCompletedLanguages === languages.length) stats.fileCompleted += 1;
        else stats.filePending += 1;
      });
      const denominator = stats.total || 1;
      stats.successPct = (stats.success / denominator) * 100;
      stats.warnPct = (stats.warn / denominator) * 100;
      stats.failPct = (stats.fail / denominator) * 100;
      stats.completed = stats.success + stats.warn + stats.fail;
      return stats;
    }

    function buildConclusionTableHtml() {
      const stats = getTemplateQualityStats();
      const languages = getSelectedTargetLanguages();
      const half = Math.ceil(languages.length / 2);
      const leftLanguages = languages.slice(0, half);
      const rightLanguages = languages.slice(half);
      const scored = stats.filter((entry) => entry.totalAvg != null).sort((a, b) => b.totalAvg - a.totalAvg);
      const bestText = describeOverallRecommendation(scored);
      const languageSummary = buildLanguageComparisonSummary(scored);
      const analysisLines = buildTemplateAnalysisLines(stats);
      const rankingText = buildTemplateRankingText(scored);

      const rows = [...stats].sort((a, b) => {
        if (a.totalAvg == null && b.totalAvg == null) return a.idx - b.idx;
        if (a.totalAvg == null) return 1;
        if (b.totalAvg == null) return -1;
        return b.totalAvg - a.totalAvg;
      }).map((templateStat) => {
        const languageMap = new Map(templateStat.perLanguage.map((entry) => [entry.language, entry.avg]));
        const stability = getTemplateStabilityStats(templateStat.translateTemplateId);
        const cells = [...leftLanguages, ...rightLanguages].map((language) => {
          const avg = languageMap.get(language);
          return `<td>${avg == null ? '-' : avg.toFixed(2)}</td>`;
        }).join('');
        return `
          <tr>
            <td>${escapeHtml(`模板${templateStat.idx + 1}`)}<br>${escapeHtml(templateStat.translateTemplateId)}</td>
            <td>
              文件完成 ${stability.fileCompleted}/${stability.fileTotal}<br>
              正常 ${stability.successPct.toFixed(2)}% (${stability.success}/${stability.total})<br>
              空行 ${stability.warnPct.toFixed(2)}% (${stability.warn}/${stability.total})<br>
              结构异常 ${stability.failPct.toFixed(2)}% (${stability.fail}/${stability.total})
            </td>
            <td>${templateStat.totalAvg == null ? '-' : templateStat.totalAvg.toFixed(2)}</td>
            ${cells}
          </tr>
        `;
      }).join('');
      const groupHeaderCells = [
        leftLanguages.length ? `<th colspan="${leftLanguages.length}">${escapeHtml(leftLanguages.map((language) => getLanguageShortLabel(language)).join(' / '))}</th>` : '',
        rightLanguages.length ? `<th colspan="${rightLanguages.length}">${escapeHtml(rightLanguages.map((language) => getLanguageShortLabel(language)).join(' / '))}</th>` : '',
      ].join('');
      const languageHeaderCells = [...leftLanguages, ...rightLanguages]
        .map((language) => `<th>${escapeHtml(getLanguageLabel(language))}</th>`)
        .join('');

      return `
        <html>
        <head>
          <meta charset="utf-8" />
          <style>
            body { font-family: Arial, sans-serif; }
            table { border-collapse: collapse; width: 100%; font-size: 12px; }
            th, td { border: 1px solid #333; padding: 6px 8px; text-align: center; vertical-align: middle; }
            th { background: #f2f6fb; font-weight: 700; }
            .title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
            .note { margin-top: 8px; font-size: 12px; line-height: 1.6; }
          </style>
        </head>
        <body>
          <div class="title">模型稳定性和翻译质量对比数据</div>
          <table>
            <thead>
              <tr>
                <th rowspan="2">模型</th>
                <th rowspan="2">稳定性结果（${items.length}个文件）</th>
                <th rowspan="2">总平均分</th>
                ${groupHeaderCells}
              </tr>
              <tr>
                ${languageHeaderCells}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="note">
            <div>${escapeHtml(bestText)}</div>
            <div>模板排序：${escapeHtml(rankingText)}</div>
            <div>语言分析：${escapeHtml(languageSummary)}</div>
            ${analysisLines.map((line) => `<div>${escapeHtml(line)}</div>`).join('')}
          </div>
        </body>
        </html>
      `;
    }

    function updateHeaderSummaries() {
      if (!translateSummaryCardEl || !qualitySummaryCardEl) return;
      const executionResultsHtml = getExecutionResultSummaryHtml();
      const stats = getTemplateQualityStats().filter((entry) => entry.translateTemplateId);
      if (!stats.length) {
        translateSummaryCardEl.innerHTML = `
          <div class="summary-line">总结：暂无模板</div>
          <div class="summary-line">语言分析：暂无</div>
        `;
        qualitySummaryCardEl.innerHTML = executionResultsHtml;
        return;
      }
      const scored = stats.filter((entry) => entry.totalAvg != null).sort((a, b) => b.totalAvg - a.totalAvg);
      if (!scored.length) {
        translateSummaryCardEl.innerHTML = `
          <div class="summary-line">总结：暂无可统计分数</div>
          <div class="summary-line">语言分析：暂无</div>
        `;
        qualitySummaryCardEl.innerHTML = executionResultsHtml;
        return;
      }
      const best = scored[0];
      const second = scored[1];
      const languageSummary = buildLanguageComparisonSummary(scored);
      translateSummaryCardEl.innerHTML = `
        <div class="summary-line">${escapeHtml(describeOverallRecommendation(scored))}</div>
        <div class="summary-line">模板排序：${escapeHtml(buildTemplateRankingText(scored))}</div>
        <div class="summary-line">当前最优：模板${best.idx + 1}（${escapeHtml(best.translateTemplateId)}）</div>
        <div class="summary-line">语言分析：${escapeHtml(languageSummary)}</div>
        <div class="summary-line">建议：若追求整体平均表现，优先模板${best.idx + 1}${second ? `；若重点语言由模板${second.idx + 1}更稳，建议复核后再选。` : '。'}</div>
      `;
      qualitySummaryCardEl.innerHTML = executionResultsHtml;
    }

    function ensureItemTranslateResults(it, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object') return {};
      if (!it.translate_results_by_lang || typeof it.translate_results_by_lang !== 'object') {
        it.translate_results_by_lang = {};
      }
      const resolvedLanguage = normalizeLanguageCode(language) || 'zh';
      if (!it.translate_results_by_lang[resolvedLanguage] || typeof it.translate_results_by_lang[resolvedLanguage] !== 'object') {
        it.translate_results_by_lang[resolvedLanguage] = {};
      }
      if (!it._translate_results_by_lang_migrated && !Object.keys(it.translate_results_by_lang[resolvedLanguage]).length) {
        const legacyTemplateId = String(it.translate_template_id || getPrimaryTranslateTemplateId() || '').trim();
        const hasLegacyResult = !!(it.translate_task_id || it.translate_query_response || it.translate_error_msg || it.translate_parse_error);
        const legacyLanguage = normalizeLanguageCode(it.target_lang || resolvedLanguage) || resolvedLanguage;
        const legacyResultMap = it.translate_results && typeof it.translate_results === 'object'
          ? it.translate_results
          : null;
        const legacyResultMapIsTemplateMap = legacyResultMap && Object.values(legacyResultMap).some((value) => value && typeof value === 'object' && (
          Object.prototype.hasOwnProperty.call(value, 'task_id') ||
          Object.prototype.hasOwnProperty.call(value, 'text') ||
          Object.prototype.hasOwnProperty.call(value, 'query_response') ||
          Object.prototype.hasOwnProperty.call(value, 'error_msg')
        ));
        if (legacyResultMapIsTemplateMap) {
          it.translate_results_by_lang[legacyLanguage] = { ...legacyResultMap };
        } else if (legacyTemplateId && hasLegacyResult) {
          if (!it.translate_results_by_lang[legacyLanguage] || typeof it.translate_results_by_lang[legacyLanguage] !== 'object') {
            it.translate_results_by_lang[legacyLanguage] = {};
          }
          it.translate_results_by_lang[legacyLanguage][legacyTemplateId] = {
            task_id: it.translate_task_id || '',
            text: it.output_content || (it.translate_query_response && it.translate_query_response.data ? it.translate_query_response.data.text || '' : ''),
            query_response: it.translate_query_response || null,
            error_msg: it.translate_error_msg || '',
            parse_error: it.translate_parse_error || '',
            rows: it.translate_rows || '-',
          };
        }
        it._translate_results_by_lang_migrated = true;
      }
      it.translate_results = it.translate_results_by_lang[resolvedLanguage];
      return it.translate_results_by_lang[resolvedLanguage];
    }

    function getItemTranslateResult(it, templateId, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object' || !templateId) return null;
      const results = ensureItemTranslateResults(it, language);
      return results[templateId] || null;
    }

    function getTranslateResultText(translateResult) {
      if (!translateResult || typeof translateResult !== 'object') return '';
      if (translateResult.text) return translateResult.text;
      if (translateResult.query_response && translateResult.query_response.data) {
        return translateResult.query_response.data.text || '';
      }
      return '';
    }

    function computeTranslateRowsFromResult(translateResult) {
      const text = getTranslateResultText(translateResult);
      if (!text) return '-';
      try {
        const arr = deserializeContentArray(text, 'data.text');
        return String(Array.isArray(arr) ? arr.length : '-');
      } catch (_) {
        return '-';
      }
    }

    function hasEmptyTranslationForResult(translateResult) {
      const text = getTranslateResultText(translateResult);
      if (!text) return false;
      try {
        const arr = deserializeContentArray(text, 'data.text');
        if (!Array.isArray(arr)) return false;
        return arr.some((item) => item && (item.t === '' || item.t === null || item.t === undefined));
      } catch (_) {
        return false;
      }
    }

    function getTranslateResultStatusInfo(it, translateResult) {
      if (translateResult && (translateResult.error_msg || translateResult.parse_error)) {
        return { text: '翻译异常', cls: 'bad' };
      }
      const originRows = toInt(it && typeof it === 'object' ? it.origin_rows : null);
      const translatedRows = toInt(translateResult && translateResult.rows ? translateResult.rows : computeTranslateRowsFromResult(translateResult));
      if (originRows != null && translatedRows != null && originRows === translatedRows) {
        if (hasEmptyTranslationForResult(translateResult)) {
          return { text: '存在空行', cls: 'warn' };
        }
        return { text: '翻译成功', cls: 'ok' };
      }
      return { text: '翻译异常', cls: 'bad' };
    }

    function syncPrimaryTranslateFields(it, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object') return;
      const primaryTemplateId = getPrimaryTranslateTemplateId();
      const primaryResult = getItemTranslateResult(it, primaryTemplateId, language);
      const resolvedLanguage = normalizeLanguageCode(language) || getCurrentTargetLanguage() || 'zh';
      it.target_lang = resolvedLanguage || '';
      it.translate_results = ensureItemTranslateResults(it, resolvedLanguage);
      it.translate_template_id = primaryTemplateId || '';
      it.translate_task_id = primaryResult ? (primaryResult.task_id || '') : '';
      it.output_content = primaryResult ? getTranslateResultText(primaryResult) : '';
      it.translate_query_response = primaryResult ? (primaryResult.query_response || null) : null;
      it.translate_error_msg = primaryResult ? (primaryResult.error_msg || '') : '';
      it.translate_parse_error = primaryResult ? (primaryResult.parse_error || '') : '';
      it.translate_rows = primaryResult ? (primaryResult.rows || computeTranslateRowsFromResult(primaryResult)) : '-';
    }

    function ensureItemQualityResults(it, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object') return {};
      if (!it.quality_check_results_by_lang || typeof it.quality_check_results_by_lang !== 'object') {
        it.quality_check_results_by_lang = {};
      }
      const resolvedLanguage = normalizeLanguageCode(language) || 'zh';
      if (!it.quality_check_results_by_lang[resolvedLanguage] || typeof it.quality_check_results_by_lang[resolvedLanguage] !== 'object') {
        it.quality_check_results_by_lang[resolvedLanguage] = {};
      }
      const legacyQualityResults = it.quality_check_results && typeof it.quality_check_results === 'object'
        ? it.quality_check_results
        : null;
      const legacyLanguage = normalizeLanguageCode(it.target_lang || resolvedLanguage) || resolvedLanguage;
      if (!it._quality_results_by_lang_migrated && legacyQualityResults && Object.keys(legacyQualityResults).length && !Object.keys(it.quality_check_results_by_lang[resolvedLanguage]).length) {
        it.quality_check_results_by_lang[legacyLanguage] = legacyQualityResults;
        it._quality_results_by_lang_migrated = true;
      }
      const values = Object.values(it.quality_check_results_by_lang[resolvedLanguage]);
      const isLegacyFlatShape = values.some((value) => value && typeof value === 'object' && (
        Object.prototype.hasOwnProperty.call(value, 'task_id') ||
        Object.prototype.hasOwnProperty.call(value, 'text') ||
        Object.prototype.hasOwnProperty.call(value, 'query_response') ||
        Object.prototype.hasOwnProperty.call(value, 'error_msg')
      ));
      if (!it._quality_results_by_lang_migrated && isLegacyFlatShape) {
        const primaryTranslateTemplateId = String(it.translate_template_id || getPrimaryTranslateTemplateId() || '').trim() || '__default__';
        if (!it.quality_check_results_by_lang[legacyLanguage] || typeof it.quality_check_results_by_lang[legacyLanguage] !== 'object') {
          it.quality_check_results_by_lang[legacyLanguage] = {};
        }
        it.quality_check_results_by_lang[legacyLanguage] = {
          [primaryTranslateTemplateId]: it.quality_check_results_by_lang[resolvedLanguage],
        };
        it._quality_results_by_lang_migrated = true;
      }
      it.quality_check_results = it.quality_check_results_by_lang[resolvedLanguage];
      return it.quality_check_results_by_lang[resolvedLanguage];
    }

    function ensureItemQualityResultsForTranslate(it, translateTemplateId, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object' || !translateTemplateId) return {};
      const results = ensureItemQualityResults(it, language);
      if (!results[translateTemplateId] || typeof results[translateTemplateId] !== 'object') {
        results[translateTemplateId] = {};
      }
      return results[translateTemplateId];
    }

    function getItemQualityResult(it, templateId, translateTemplateId, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object' || !templateId) return null;
      const resolvedTranslateTemplateId = String(translateTemplateId || getPrimaryTranslateTemplateId() || '').trim();
      if (!resolvedTranslateTemplateId) return null;
      const resultsForTranslate = ensureItemQualityResultsForTranslate(it, resolvedTranslateTemplateId, language);
      return resultsForTranslate[templateId] || null;
    }

    function syncPrimaryQualityFields(it, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object') return;
      const primaryTemplateId = getPrimaryQualityTemplateId();
      const primaryTranslateTemplateId = getPrimaryTranslateTemplateId();
      const primaryResult = getItemQualityResult(it, primaryTemplateId, primaryTranslateTemplateId, language);
      it.quality_check_task_id = primaryResult ? (primaryResult.task_id || '') : '';
      it.quality_check_query_response = primaryResult ? (primaryResult.query_response || null) : null;
