    async function copyToClipboard(text) {
      if (!text) return false;
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        // fallback：使用临时 textarea
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', 'readonly');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }
    }

    function sleep(ms, signal) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          if (signal) signal.removeEventListener('abort', onAbort);
          resolve();
        }, ms);
        function onAbort() {
          clearTimeout(timer);
          signal.removeEventListener('abort', onAbort);
          reject(new DOMException('已手动终止', 'AbortError'));
        }
        if (signal) {
          if (signal.aborted) {
            clearTimeout(timer);
            reject(new DOMException('已手动终止', 'AbortError'));
            return;
          }
          signal.addEventListener('abort', onAbort, { once: true });
        }
      });
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 30000, signal = null) {
      const controller = new AbortController();
      let timedOut = false;
      const timer = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, timeoutMs);
      let externalAbortHandler = null;
      if (signal) {
        externalAbortHandler = () => controller.abort(signal.reason || new DOMException('已手动终止', 'AbortError'));
        if (signal.aborted) {
          clearTimeout(timer);
          throw new DOMException('已手动终止', 'AbortError');
        }
        signal.addEventListener('abort', externalAbortHandler, { once: true });
      }
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } catch (err) {
        if (timedOut) {
          const timeoutError = new Error(`请求超时（${Math.round(timeoutMs / 1000)}秒）`);
          timeoutError.name = 'RequestTimeoutError';
          throw timeoutError;
        }
        throw err;
      } finally {
        clearTimeout(timer);
        if (signal && externalAbortHandler) signal.removeEventListener('abort', externalAbortHandler);
      }
    }

    // 清理 markdown 代码块标记（如 ```json ... ```）
    function cleanMarkdownCodeBlock(text) {
      if (typeof text !== 'string') return text;
      let cleaned = text.trim();
      // 匹配开头的 ```json 或 ``` 标记（可能带有语言标识）
      const startPattern = /^```(?:json|JSON)?\s*/;
      // 匹配结尾的 ``` 标记
      const endPattern = /\s*```$/;
      if (startPattern.test(cleaned) && endPattern.test(cleaned)) {
        cleaned = cleaned.replace(startPattern, '').replace(endPattern, '').trim();
      }
      return cleaned;
    }

    // JS 版：创建任务 + 轮询查询（简化版）
    function throwIfAborted(signal) {
      if (signal && signal.aborted) {
        throw new DOMException('已手动终止', 'AbortError');
      }
    }

    function isAbortError(err) {
      return !!(err && (err.name === 'AbortError' || /已手动终止|abort/i.test(String(err.message || err))));
    }

    function isTransientRequestError(err) {
      const message = String(err && err.message ? err.message : err || '');
      return !!(err && err.name === 'RequestTimeoutError')
        || /请求超时|fetch|network|HTTP 429|HTTP 5\d\d|长时间无变化/i.test(message);
    }

    function getRetryDelayMs(attempt, response = null) {
      if (response && response.headers) {
        const retryAfter = response.headers.get('Retry-After');
        if (retryAfter) {
          const seconds = Number(retryAfter);
          if (Number.isFinite(seconds)) return Math.min(60000, Math.max(1000, seconds * 1000));
          const dateMs = Date.parse(retryAfter);
          if (Number.isFinite(dateMs)) return Math.min(60000, Math.max(1000, dateMs - Date.now()));
        }
      }
      const base = Math.min(20000, 2000 * (2 ** Math.max(0, attempt)));
      return Math.round(base * (0.8 + Math.random() * 0.4));
    }

    let taskCreateGate = Promise.resolve();
    let nextTaskCreateAt = 0;
    async function waitForTaskCreateSlot(signal) {
      let releaseGate;
      const previousGate = taskCreateGate;
      taskCreateGate = new Promise((resolve) => { releaseGate = resolve; });
      await previousGate;
      try {
        throwIfAborted(signal);
        const waitMs = Math.max(0, nextTaskCreateAt - Date.now());
        if (waitMs > 0) await sleep(waitMs, signal);
        nextTaskCreateAt = Date.now() + 500 + Math.floor(Math.random() * 250);
      } finally {
        releaseGate();
      }
    }

    async function requestLlmChatAsync({ textPrompt, subtitleLen, language, originLang, onProgress, templateIdValue, emptyTemplateMessage, templateVariablesObj, estimatedInputTokens = 0, signal }) {
      const { reqUrl, templateId, apiKey } = getLlmConfig(templateIdValue, emptyTemplateMessage);
      throwIfAborted(signal);

      const templateVariables = JSON.stringify(
        templateVariablesObj || { PROMPT: textPrompt, LANGUAGE: language || '', SUBTITLE_LEN: subtitleLen || '', ORIGIN_LANG: originLang || '' },
        null,
        0
      );

      const createBody = {
        response_type: 0,
        template_id: templateId,
        template_variables: templateVariables,
        po: 'reccloud',
      };

      const createMaxRetries = 4;
      let createJson = null;
      for (let createAttempt = 0; createAttempt < createMaxRetries; createAttempt += 1) {
        throwIfAborted(signal);
        if (onProgress) onProgress({ stage: 'create', progress: createAttempt === 0 ? 0 : `创建重试 ${createAttempt}/${createMaxRetries - 1}` });
        try {
          await waitForTaskCreateSlot(signal);
          const resp = await fetchWithTimeout(reqUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
            },
            body: JSON.stringify(createBody),
          }, 45000, signal);
          if (!resp.ok) {
            const retryable = resp.status === 429 || (resp.status >= 500 && resp.status < 600);
            if (retryable && createAttempt < createMaxRetries - 1) {
              await sleep(getRetryDelayMs(createAttempt, resp), signal);
              continue;
            }
            throw new Error(`创建任务失败：HTTP ${resp.status}`);
          }
          createJson = await resp.json();
          break;
        } catch (err) {
          const message = String(err && err.message ? err.message : err || '');
          const retryable = isTransientRequestError(err) || /timeout/i.test(message);
          if (retryable && createAttempt < createMaxRetries - 1) {
            if (isAbortError(err)) throw err;
            await sleep(getRetryDelayMs(createAttempt), signal);
            continue;
          }
          throw err;
        }
      }
      if (!createJson) throw new Error('创建任务失败：多次重试后仍未获得有效响应');

      const taskId =
        (createJson && createJson.data && (createJson.data.task_id || createJson.data.taskId)) ||
        createJson.task_id ||
        createJson.taskId;
      if (!taskId) throw new Error('创建任务失败：响应中缺少 task_id');
      if (onProgress) onProgress({ stage: 'created', taskId });

      // 长任务采用更宽松的截止时间；轮询间隔随等待时间逐步放大，降低查询限流概率。
      const startedAt = Date.now();
      const isLongTask = Number(estimatedInputTokens) > 5000;
      const hardTimeoutMs = isLongTask ? 15 * 60 * 1000 : 12 * 60 * 1000;
      const stagnantTimeoutMs = isLongTask ? 8 * 60 * 1000 : 5 * 60 * 1000;
      const maxRetries = 3;
      let lastState = null;
      let lastProgressKey = '';
      let lastProgressAt = Date.now();
      let pollAttempt = 0;
      let consecutiveQueryFailures = 0;

      while (Date.now() - startedAt < hardTimeoutMs) {
        throwIfAborted(signal);
        const elapsedMs = Date.now() - startedAt;
        const baseIntervalMs = elapsedMs < 30000 ? 3000 : (elapsedMs < 120000 ? 5000 : 10000);
        await sleep(Math.round(baseIntervalMs * (0.85 + Math.random() * 0.3)), signal);
        pollAttempt += 1;
        
        // 查询任务状态（带重试机制）
        let q = null;
        let qJson = null;
        let retryCount = 0;
        let querySuccess = false;
        let lastQueryError = null;
        
        while (retryCount <= maxRetries && !querySuccess) {
          try {
            q = await fetchWithTimeout(`${reqUrl}/${taskId}`, {
              method: 'GET',
              headers: { 'x-api-key': apiKey },
            }, 30000, signal);
            
            // 检查是否为临时错误（5xx），需要重试
            if (!q.ok && (q.status === 429 || (q.status >= 500 && q.status < 600))) {
              lastQueryError = new Error(`查询任务失败：HTTP ${q.status}`);
              if (retryCount < maxRetries) {
                retryCount++;
                if (onProgress) onProgress({ stage: 'poll', progress: `查询失败(HTTP ${q.status})，重试 ${retryCount}/${maxRetries}...` });
                await sleep(getRetryDelayMs(retryCount - 1, q), signal);
                continue;
              }
              break;
            }
            
            // 非临时错误或重试次数已用完，直接抛出错误
            if (!q.ok) {
              throw new Error(`查询任务失败：HTTP ${q.status}${retryCount > 0 ? `（已重试 ${retryCount} 次）` : ''}`);
            }
            
            qJson = await q.json();
            querySuccess = true;
          } catch (err) {
            // 网络错误或其他异常，如果是临时错误且还有重试次数，则重试
            const message = String(err && err.message ? err.message : err || '');
            if (isAbortError(err)) throw err;
            if (isTransientRequestError(err) || /timeout/i.test(message)) {
              lastQueryError = err;
              if (retryCount < maxRetries) {
                retryCount++;
                if (onProgress) onProgress({ stage: 'poll', progress: `查询异常，重试 ${retryCount}/${maxRetries}...` });
                await sleep(getRetryDelayMs(retryCount - 1), signal);
                continue;
              }
              break;
            }
            // 重试次数用完或非临时错误，抛出异常
            throw err;
          }
        }

        if (!querySuccess || !qJson) {
          consecutiveQueryFailures += 1;
          if (consecutiveQueryFailures >= 6) throw lastQueryError || new Error('查询任务连续失败');
          if (onProgress) onProgress({
            stage: 'poll',
            progress: `task_id 已保留，稍后继续查询（连续失败 ${consecutiveQueryFailures}/6）`,
          });
          continue;
        }
        consecutiveQueryFailures = 0;
        
        const d = qJson && qJson.data ? qJson.data : qJson;
        const state = d && typeof d.state !== 'undefined' ? d.state : d && d.data ? d.data.state : undefined;
        const progress = d && typeof d.progress !== 'undefined' ? d.progress : d && d.data ? d.data.progress : undefined;
        const text = d && typeof d.text !== 'undefined' ? d.text : d && d.data ? d.data.text : undefined;

        const progressText = typeof progress === 'undefined' || progress === null || progress === ''
          ? `轮询 ${pollAttempt}`
          : `轮询 ${pollAttempt} · 进度 ${progress}`;
        const progressKey = `${state ?? ''}|${progress ?? ''}|${text ? 'hasText' : 'noText'}`;
        if (progressKey !== lastProgressKey || state !== lastState) lastProgressAt = Date.now();
        lastProgressKey = progressKey;
        lastState = state;
        if (Date.now() - lastProgressAt >= stagnantTimeoutMs) {
          throw new Error(`任务长时间无变化：${progressText}`);
        }

        if (onProgress) onProgress({ stage: 'poll', progress: progressText, attempt: pollAttempt });

        if (state === 1) {
          if (!text) {
            const detail = [d.error_msg, d.error, d.message, qJson.message]
              .find((value) => typeof value === 'string' && value.trim());
            const error = new Error(`任务已完成但未返回 text${detail ? `：${detail.slice(0, 300)}` : ''}`);
            error.queryResponse = qJson;
            throw error;
          }
          // 清理可能存在的 markdown 代码块标记
          const cleanedText = cleanMarkdownCodeBlock(text);
          // 同时更新 queryResponse 中的 text 字段
          if (qJson && qJson.data && qJson.data.text) {
            qJson.data.text = cleanedText;
          }
          return { taskId, text: cleanedText, queryResponse: qJson };
        }
        if (typeof state === 'number' && state < 0) {
          const detail = [d.error_msg, d.error, d.message, qJson.message]
            .find((value) => typeof value === 'string' && value.trim());
          const error = new Error(`任务执行失败（state ${state}）${detail ? `：${detail.slice(0, 300)}` : ''}`);
          error.queryResponse = qJson;
          throw error;
        }
      }

      throw new Error(`查询超时：超过${Math.round(hardTimeoutMs / 60000)}分钟`);
    }

    // 反序列化内容（兼容双重转义）
    function deserializeContentArray(content, fieldName) {
      if (content == null) throw new Error(`缺少 ${fieldName}`);
      if (Array.isArray(content)) return content;

      if (typeof content !== 'string') {
        throw new Error(`${fieldName} 类型不支持：${typeof content}`);
      }

      const text = content.trim();
      if (!text) return [];

      // 常规：本身就是 JSON 文本（例如：[{"s":1,"t":"x"}]）
      try {
        return JSON.parse(text);
      } catch (_) {
        // 兼容：双重转义（例如：[{\"s\":1,\"t\":\"x\"}]）
        const oneLevel = text.replace(/\\\\/g, '\\').replace(/\\"/g, '"');
        return JSON.parse(oneLevel);
      }
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? (' ' + type) : '');
    }

    function clearView() {
      fileNameEl.textContent = '-';
      itemsCountEl.textContent = '-';
      selectedIndexEl.textContent = '-';

      itemsListEl.innerHTML = '<li class="item"><div class="row1">请先选择文件</div><div class="row2">-</div></li>';
      pickedFileNameEl.textContent = '未选择';
      detailSelectedEl.textContent = '未选择';
      jsonPreviewEl.textContent = '// 请选择左侧条目';
      renderEmptyPreviewPanels(translatePreviewEl, '// 暂无接口响应的 data.text');
      renderEmptyPreviewPanels(qualityPreviewEl, '// 暂无翻译质量结果');
      setStatus('', '');

      items = [];
      selected = -1;
      lastOriginPretty = '';
      checkedSet.clear();
      bulkRunning = false;
      qualityRunning = false;
      workflowStartTime = null;
      workflowActiveOperations = 0;
      updateBulkControls();
      translateStatsEl.style.display = 'none';
      translateTimeEl.style.display = 'none';
      updateAllQualityTemplateAverageBadges();
    }

    function hasTranslateText(it) {
      if (!it || typeof it !== 'object') return false;
      const activeLanguage = getCurrentTargetLanguage();
      if (!activeLanguage) return false;
      const results = ensureItemTranslateResults(it, activeLanguage);
      return Object.values(results).some((translateResult) => !!getTranslateResultText(translateResult));
    }

    function isItemTranslateReady(it) {
      return !!(it && typeof it === 'object' && !it._retranslating && getSelectedTargetLanguages().some((language) => hasTranslateTextForLanguage(it, language)));
    }

    function hasTranslateTextForLanguage(it, language) {
      if (!it || typeof it !== 'object') return false;
      const resolvedLanguage = normalizeLanguageCode(language);
      if (!resolvedLanguage) return false;
      const results = ensureItemTranslateResults(it, resolvedLanguage);
      return Object.values(results).some((translateResult) => isUsableTranslateResult(it, translateResult));
    }

    function isItemTranslateReadyForLanguage(it, language) {
      return !!(it && typeof it === 'object' && !it._retranslating && hasTranslateTextForLanguage(it, language));
    }

    function isItemReadyForAnySelectedLanguage(it) {
      return !!(it && typeof it === 'object' && !it._retranslating
        && getSelectedTargetLanguages().some((language) => isItemTranslateReadyForLanguage(it, language)));
    }

    function getTranslationValidationError(translatedText, expectedRows) {
      const rawText = String(translatedText || '').trim();
      if (!rawText) return '对应译文为空，无法进行质检';
      try {
        const arr = deserializeContentArray(rawText, 'translated_content');
        if (!Array.isArray(arr) || arr.length === 0) return '对应译文不是有效的字幕数组或数组为空';
        const nonEmptyCount = arr.filter((item) => item && item.t != null && String(item.t).trim() !== '').length;
        if (nonEmptyCount === 0) return '对应译文的所有字幕文本均为空，无法进行质检';
        const expected = toInt(expectedRows);
        if (expected != null && arr.length !== expected) {
          return `译文条目数不一致：原文 ${expected} 条，译文 ${arr.length} 条`;
        }
      } catch (err) {
        return `对应译文结构无法解析：${err && err.message ? err.message : String(err)}`;
      }
      return '';
    }

    function isUsableTranslateResult(it, translateResult) {
      if (!translateResult || translateResult.error_msg || translateResult.parse_error) return false;
      const text = getTranslateResultText(translateResult);
      return !!text && !getTranslationValidationError(text, it && it.origin_rows);
    }

    function isTranslateResultFailed(it, translateResult) {
      if (!translateResult || typeof translateResult !== 'object') return false;
      if (translateResult.error_msg || translateResult.parse_error) return true;
      const state = translateResult.query_response && translateResult.query_response.data
        ? translateResult.query_response.data.state
        : null;
      if (state != null && typeof state === 'number' && state < 0) return true;
      const text = getTranslateResultText(translateResult);
      return !!text && getTranslateResultStatusInfo(it, translateResult).cls === 'bad';
    }

    function countTranslateTasksInSelection() {
      const languages = getSelectedTargetLanguages();
      const translateTemplateCount = getTranslateTemplateIds().length;
      if (!languages.length || !translateTemplateCount) return 0;
      return Array.from(checkedSet).reduce((sum, idx) => {
        if (idx < 0 || idx >= items.length) return sum;
        return sum + languages.length * translateTemplateCount;
      }, 0);
    }

    function countReadyQualityTasksInSelection() {
      const languages = getSelectedTargetLanguages();
      const translateTemplateCount = getTranslateTemplateIds().length;
      const qualityTemplateCount = getQualityTemplateIds().length;
      if (!languages.length || !translateTemplateCount || !qualityTemplateCount) return 0;
      return Array.from(checkedSet).reduce((sum, idx) => {
        if (idx < 0 || idx >= items.length) return sum;
        return sum + languages.reduce((languageSum, language) => {
          const readyTranslateCount = getTranslateTemplateIds().filter((templateId) => {
            const translateResult = getItemTranslateResult(items[idx], templateId, language);
            return isUsableTranslateResult(items[idx], translateResult);
          }).length;
          return languageSum + (readyTranslateCount * qualityTemplateCount);
        }, 0);
      }, 0);
    }

    async function requestBatchWakeLock() {
      if (!('wakeLock' in navigator) || batchWakeLock) return false;
      try {
        batchWakeLock = await navigator.wakeLock.request('screen');
        batchWakeLock.addEventListener('release', () => {
          batchWakeLock = null;
        });
        return true;
      } catch (_) {
        batchWakeLock = null;
        return false;
      }
    }

    async function releaseBatchWakeLock() {
      if (!batchWakeLock) return;
      try {
        await batchWakeLock.release();
      } catch (_) {
        // ignore
      } finally {
        batchWakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && (bulkRunning || qualityRunning)) {
        requestBatchWakeLock();
      }
    });

    function getItemExecutionProgressText(it) {
      const languages = getSelectedTargetLanguages();
      if (!languages.length) return '';
      const translation = getItemPhaseResultSummary(it, languages, 'translation');
      const quality = getItemPhaseResultSummary(it, languages, 'quality');
      return `执行结果：翻译 ${translation}；质检 ${quality}`;
    }

    function hasActiveLanguageRun(it, runMapName, language) {
      const resolvedLanguage = normalizeLanguageCode(language);
      const runMap = it && it[runMapName] && typeof it[runMapName] === 'object' ? it[runMapName] : {};
      const prefix = `${resolvedLanguage}::`;
      return Object.entries(runMap).some(([runKey, isActive]) => isActive && runKey.startsWith(prefix));
    }

    function isBatchPhaseActiveForLanguage(phase, language) {
      if (normalizeLanguageCode(activeBatchLanguage) !== normalizeLanguageCode(language)) return false;
      if (phase === 'translation') return activeBatchStage === 'translation' && bulkRunning;
      return activeBatchStage === 'quality' && qualityRunning;
    }

    function getTranslationFileOutcome(it, language) {
      const templateIds = getTranslateTemplateIds();
      if (!it || !templateIds.length) {
        return { success: false, failed: false, active: false, started: false, settled: false, notStarted: true };
      }
      const results = ensureItemTranslateResults(it, language);
      let successCount = 0;
      let failedCount = 0;
      let started = false;
      templateIds.forEach((templateId) => {
        const result = results[templateId] || null;
        if (isTranslateResultFailed(it, result)) failedCount += 1;
        else if (isUsableTranslateResult(it, result)) successCount += 1;
        if (result && (result.task_id || getTranslateResultText(result) || result.query_response || result.error_msg || result.parse_error)) {
          started = true;
        }
      });
      const active = hasActiveLanguageRun(it, '_activeTranslateRuns', language);
      started = started || active;
      return {
        success: successCount === templateIds.length && failedCount === 0 && !active,
        failed: failedCount > 0,
        active,
        started,
        settled: successCount + failedCount === templateIds.length,
        notStarted: !started,
      };
    }

    function getQualityFileOutcome(it, language) {
      const translateTemplateIds = getTranslateTemplateIds();
      const qualityTemplateIds = getQualityTemplateIds();
      if (!it || !qualityTemplateIds.length) {
        return { success: false, failed: false, active: false, started: false, settled: false, notStarted: true };
      }
      const usableTranslateTemplateIds = translateTemplateIds.filter((translateTemplateId) => (
        isUsableTranslateResult(it, getItemTranslateResult(it, translateTemplateId, language))
      ));
      const expectedCount = usableTranslateTemplateIds.length * qualityTemplateIds.length;
      const active = hasActiveLanguageRun(it, '_activeQualityRuns', language);
      if (!expectedCount) {
        return { success: false, failed: false, active, started: active, settled: false, notStarted: !active };
      }

      let successCount = 0;
      let failedCount = 0;
      let started = active;
      usableTranslateTemplateIds.forEach((translateTemplateId) => {
        qualityTemplateIds.forEach((qualityTemplateId) => {
          const result = getItemQualityResult(it, qualityTemplateId, translateTemplateId, language);
          const text = getQualityResultRawText(result);
          const state = result && result.query_response && result.query_response.data
            ? Number(result.query_response.data.state)
            : null;
          const failed = !!(result && result.error_msg) || (state != null && Number.isFinite(state) && state < 0);
          if (failed) failedCount += 1;
          else if (text) successCount += 1;
          if (result && (result.task_id || text || result.query_response || result.error_msg)) started = true;
        });
      });
      return {
        success: successCount === expectedCount && failedCount === 0 && !active,
        failed: failedCount > 0,
        active,
        started,
        settled: successCount + failedCount === expectedCount,
        notStarted: !started,
      };
    }

    function getItemPhaseResultSummary(it, languages, phase) {
      const outcomeForLanguage = phase === 'translation' ? getTranslationFileOutcome : getQualityFileOutcome;
      const outcomes = languages.map((language) => ({ language, ...outcomeForLanguage(it, language) }));
      if (!outcomes.length) return '未开始';
      const successful = outcomes.filter((outcome) => outcome.success).map((outcome) => outcome.language);
      const failed = outcomes.filter((outcome) => outcome.failed).map((outcome) => outcome.language);
      const active = outcomes.filter((outcome) => outcome.active).map((outcome) => outcome.language);
      const partial = outcomes.filter((outcome) => outcome.started && !outcome.success && !outcome.failed && !outcome.active).map((outcome) => outcome.language);
      const notStarted = outcomes.filter((outcome) => outcome.notStarted).map((outcome) => outcome.language);
      if (successful.length === outcomes.length) return '全部完成';
      if (notStarted.length === outcomes.length) return '未开始';
      const parts = [];
      if (failed.length) parts.push(`失败 ${failed.map(getLanguageShortLabel).join('、')}`);
      if (active.length) parts.push(`进行中 ${active.map(getLanguageShortLabel).join('、')}`);
      if (partial.length) parts.push(`未完成 ${partial.map(getLanguageShortLabel).join('、')}`);
      if (successful.length) parts.push(`完成 ${successful.map(getLanguageShortLabel).join('、')}`);
      if (notStarted.length) parts.push(`未开始 ${notStarted.map(getLanguageShortLabel).join('、')}`);
      return parts.join('；') || '未开始';
    }

    function getCheckedExecutionIndices() {
      return Array.from(checkedSet)
        .filter((idx) => Number.isInteger(idx) && idx >= 0 && idx < items.length)
        .sort((a, b) => a - b);
    }

    function getExecutionLanguageStats(language, phase, indices) {
      const eligibleIndices = phase === 'quality'
        ? indices.filter((idx) => isItemTranslateReadyForLanguage(items[idx], language))
        : indices;
      const outcomeForItem = phase === 'translation' ? getTranslationFileOutcome : getQualityFileOutcome;
      const entries = eligibleIndices.map((idx) => {
        const outcome = outcomeForItem(items[idx], language);
        const state = outcome.active ? 'active'
          : outcome.failed ? 'failed'
            : outcome.success ? 'success'
              : outcome.started ? 'incomplete' : 'pending';
        return { idx, language, state, ...outcome };
      });
      const prerequisiteWaiting = [];
      const prerequisiteFailed = [];
      if (phase === 'quality') {
        indices.forEach((idx) => {
          if (isItemTranslateReadyForLanguage(items[idx], language)) return;
          const translation = getTranslationFileOutcome(items[idx], language);
          const entry = { idx, language };
          if (translation.failed && !translation.active) prerequisiteFailed.push(entry);
          else prerequisiteWaiting.push(entry);
        });
      }
      return {
        language,
        entries,
        expected: entries.length,
        successCount: entries.filter((entry) => entry.state === 'success').length,
        failedEntries: entries.filter((entry) => entry.state === 'failed'),
        activeCount: entries.filter((entry) => entry.state === 'active').length,
        incompleteCount: entries.filter((entry) => entry.state === 'incomplete').length,
        pendingCount: entries.filter((entry) => entry.state === 'pending').length,
        started: entries.some((entry) => entry.started),
        batchActive: isBatchPhaseActiveForLanguage(phase, language),
        prerequisiteWaiting,
        prerequisiteFailed,
      };
    }

    function getExecutionPhaseStats(phase, indices, languages) {
      const languageStats = languages.map((language) => getExecutionLanguageStats(language, phase, indices));
      const entries = languageStats.flatMap((stats) => stats.entries);
      return {
        languageStats,
        entries,
        expected: entries.length,
        successCount: languageStats.reduce((sum, stats) => sum + stats.successCount, 0),
        failedEntries: languageStats.flatMap((stats) => stats.failedEntries),
        activeCount: languageStats.reduce((sum, stats) => sum + stats.activeCount, 0),
        incompleteCount: languageStats.reduce((sum, stats) => sum + stats.incompleteCount, 0),
        pendingCount: languageStats.reduce((sum, stats) => sum + stats.pendingCount, 0),
        started: languageStats.some((stats) => stats.started),
        batchActive: languageStats.some((stats) => stats.batchActive),
        prerequisiteWaiting: languageStats.flatMap((stats) => stats.prerequisiteWaiting),
        prerequisiteFailed: languageStats.flatMap((stats) => stats.prerequisiteFailed),
      };
    }

    function formatExecutionPairGroups(entries, includeCounts = false) {
      const groups = new Map();
      entries.forEach(({ idx, language }) => {
        const code = normalizeLanguageCode(language) || '-';
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(idx + 1);
      });
      return Array.from(groups.entries()).map(([language, fileNumbers]) => (
        includeCounts
          ? `${language}（${fileNumbers.length} 个）`
          : `${language}：${fileNumbers.map((number) => `#${number}`).join('、')}`
      )).join('；');
    }

    function renderExecutionPairList(entries, label, className) {
      if (!entries.length) return '';
      if (entries.length <= 8) {
        return `<div class="${className}">${escapeHtml(label)}：${escapeHtml(formatExecutionPairGroups(entries))}</div>`;
      }
      const groupedSummary = label === '等待译文'
        ? `${label}：${entries.length} 项`
        : `${label}：${formatExecutionPairGroups(entries, true)}`;
      return `
        <div class="${className}">
          ${escapeHtml(groupedSummary)}
          <details class="execution-pair-details">
            <summary>查看文件编号（${entries.length}）</summary>
            <div class="execution-pair-list">${escapeHtml(formatExecutionPairGroups(entries))}</div>
          </details>
        </div>
      `;
    }

    function getLanguageExecutionResultText(language, phase, indices) {
      const label = normalizeLanguageCode(language);
      if (phase === 'translation' && !getTranslateTemplateIds().length) return `${label}：未配置翻译模板`;
      if (phase === 'quality' && !getQualityTemplateIds().length) return `${label}：未配置质检模板`;
      const stats = getExecutionLanguageStats(language, phase, indices);
      if (phase === 'quality' && !stats.expected) {
        return `${label}：未开始 · 可质检 0 项 · 待译文 ${stats.prerequisiteWaiting.length} 项 · 无有效译文 ${stats.prerequisiteFailed.length} 项`;
      }
      if (!stats.expected) return `${label}：未开始`;

      const allSuccessful = stats.successCount === stats.expected
        && !stats.failedEntries.length && !stats.activeCount && !stats.incompleteCount && !stats.pendingCount;
      if (allSuccessful && !stats.batchActive && !stats.prerequisiteWaiting.length && !stats.prerequisiteFailed.length) {
        return `${label}：全部完成（${stats.expected}/${stats.expected}）`;
      }
      if (!stats.started && !stats.batchActive) return `${label}：未开始`;

      const status = stats.activeCount || stats.batchActive ? '进行中'
        : stats.failedEntries.length ? '有失败' : '部分完成';
      const resultCountLabel = stats.activeCount || stats.batchActive ? '已有结果' : '完成';
      const parts = [`${resultCountLabel} ${stats.successCount}/${stats.expected}`];
      if (stats.failedEntries.length) parts.push(`失败文件 ${stats.failedEntries.map((entry) => `#${entry.idx + 1}`).join('、')}`);
      if (stats.activeCount) parts.push(`处理中 ${stats.activeCount}`);
      if (stats.incompleteCount) parts.push(`未完成 ${stats.incompleteCount}`);
      if (stats.pendingCount) parts.push(`未开始 ${stats.pendingCount}`);
      if (stats.prerequisiteWaiting.length) parts.push(`待译文 ${stats.prerequisiteWaiting.length}`);
      if (stats.prerequisiteFailed.length) parts.push(`无有效译文 ${stats.prerequisiteFailed.length}`);
      return `${label}：${status}（${parts.join('；')}）`;
    }

    function getExecutionPhaseSummaryText(phase, stats, selectedPairCount) {
      if (phase === 'translation' && !getTranslateTemplateIds().length) return '未配置翻译模板';
      if (phase === 'quality' && !getQualityTemplateIds().length) return '未配置质检模板';
      if (phase === 'quality' && !stats.expected) return '未开始 · 可质检 0 项';
      if (!stats.expected) return '未开始';

      const allSuccessful = stats.successCount === stats.expected
        && !stats.failedEntries.length && !stats.activeCount && !stats.incompleteCount && !stats.pendingCount;
      const hasPrerequisites = stats.prerequisiteWaiting.length || stats.prerequisiteFailed.length;
      if (allSuccessful && !stats.batchActive && !hasPrerequisites) {
        return `全部完成（共 ${phase === 'translation' ? selectedPairCount : stats.expected} 项）`;
      }
      if (!stats.started && !stats.batchActive) {
        return phase === 'quality' ? `未开始 · 可质检 ${stats.expected} 项` : '未开始';
      }

      const status = stats.activeCount || stats.batchActive ? '进行中'
        : stats.failedEntries.length ? '部分失败' : '部分完成';
      const denominatorLabel = phase === 'quality' ? '可质检项' : '项';
      const resultCountLabel = stats.activeCount || stats.batchActive ? '已有结果' : '完成';
      const parts = [`${resultCountLabel} ${stats.successCount}/${stats.expected} ${denominatorLabel}`];
      if (stats.failedEntries.length) parts.push(`失败 ${stats.failedEntries.length}`);
      if (stats.activeCount) parts.push(`处理中 ${stats.activeCount}`);
      if (stats.incompleteCount) parts.push(`未完成 ${stats.incompleteCount}`);
      if (stats.pendingCount) parts.push(`${stats.batchActive ? '待处理' : '未开始'} ${stats.pendingCount}`);
      if (stats.prerequisiteWaiting.length) parts.push(`等待译文 ${stats.prerequisiteWaiting.length}`);
      if (stats.prerequisiteFailed.length) parts.push(`无有效译文 ${stats.prerequisiteFailed.length}`);
      if (phase === 'quality' && stats.expected < selectedPairCount) {
        parts.push(`总勾选范围 ${selectedPairCount} 项`);
      }
      return `${status} · ${parts.join(' · ')}`;
    }

    function getExecutionResultSummaryHtml() {
      const languages = getSelectedTargetLanguages();
      const indices = getCheckedExecutionIndices();
      const selectedPairCount = indices.length * languages.length;
      const scopeText = indices.length && languages.length
        ? `当前勾选：${indices.length} 个文件 × ${languages.length} 种语言 = ${selectedPairCount} 个文件-语种组合`
        : `当前勾选：${indices.length} 个文件 · ${languages.length} 种语言`;

      if (!items.length) {
        return `<div class="summary-line execution-summary-title"><strong>执行结果</strong> <span class="execution-summary-scope">尚未加载文件</span></div><div class="execution-summary-row"><strong>翻译</strong>未开始</div><div class="execution-summary-row"><strong>质检</strong>未开始</div>`;
      }
      if (!indices.length || !languages.length) {
        const reason = !indices.length ? '请勾选文件' : '请勾选目标语言';
        return `<div class="summary-line execution-summary-title"><strong>执行结果</strong> <span class="execution-summary-scope">${escapeHtml(scopeText)}</span></div><div class="execution-summary-row"><strong>翻译</strong>未开始 · ${reason}</div><div class="execution-summary-row"><strong>质检</strong>未开始 · ${reason}</div>`;
      }

      const translationStats = getExecutionPhaseStats('translation', indices, languages);
      const qualityStats = getExecutionPhaseStats('quality', indices, languages);
      const pairCount = indices.length * languages.length;
      const translationFailures = renderExecutionPairList(translationStats.failedEntries, '失败文件', 'execution-summary-fail');
      const qualityFailures = renderExecutionPairList(qualityStats.failedEntries, '失败文件', 'execution-summary-fail');
      const qualityWaiting = qualityStats.expected > 0 || qualityStats.started
        ? renderExecutionPairList(qualityStats.prerequisiteWaiting, '等待译文', 'execution-summary-note')
        : '';
      const qualityBlocked = renderExecutionPairList(qualityStats.prerequisiteFailed, '无有效译文，未纳入质检', 'execution-summary-note');
      const languageDetails = languages.map((language) => `
        <div class="execution-summary-language">
          <strong>${escapeHtml(normalizeLanguageCode(language))}</strong>
          <span>${escapeHtml(getLanguageExecutionResultText(language, 'translation', indices))}</span>
          <span>${escapeHtml(getLanguageExecutionResultText(language, 'quality', indices))}</span>
        </div>
      `).join('');

      return `
        <div class="summary-line execution-summary-title"><strong>执行结果</strong> <span class="execution-summary-scope">${escapeHtml(scopeText)}</span></div>
        <div class="execution-summary-row"><strong>翻译</strong>${escapeHtml(getExecutionPhaseSummaryText('translation', translationStats, pairCount))}</div>
        ${translationFailures}
        <div class="execution-summary-row"><strong>质检</strong>${escapeHtml(getExecutionPhaseSummaryText('quality', qualityStats, pairCount))}</div>
        ${qualityFailures}${qualityWaiting}${qualityBlocked}
        <details class="execution-summary-details">
          <summary>查看所选语言明细（${languages.length}）</summary>
          ${languageDetails}
        </details>
      `;
    }

    function getFailedTranslateTemplateIds(it, language) {
      if (!it || typeof it !== 'object') return [];
      const resolvedLanguage = normalizeLanguageCode(language);
      if (!resolvedLanguage) return [];
      return getOrderedTranslateTemplateIdsForItem(it, resolvedLanguage).filter((templateId) => {
        const translateResult = getItemTranslateResult(it, templateId, resolvedLanguage);
        return isTranslateResultFailed(it, translateResult);
      });
    }

    function getFailedQualityTranslateTemplateIds(it, language) {
      if (!it || typeof it !== 'object') return [];
      const resolvedLanguage = normalizeLanguageCode(language);
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      if (!resolvedLanguage || !qualityTemplateId) return [];
      return getOrderedTranslateTemplateIdsForItem(it, resolvedLanguage).filter((translateTemplateId) => {
        const translateResult = getItemTranslateResult(it, translateTemplateId, resolvedLanguage);
        if (!isUsableTranslateResult(it, translateResult)) return false;
        const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId, resolvedLanguage);
        return !!(qualityResult && qualityResult.error_msg);
      });
    }

    function countFailedTasksInSelection() {
      const languages = getSelectedTargetLanguages();
      return Array.from(checkedSet).reduce((sum, idx) => {
        if (!Number.isInteger(idx) || idx < 0 || idx >= items.length) return sum;
        const it = items[idx];
        return sum + languages.reduce((languageSum, language) => (
          languageSum
          + getFailedTranslateTemplateIds(it, language).length
          + getFailedQualityTranslateTemplateIds(it, language).length
        ), 0);
      }, 0);
    }

    function tryParseQualityResult(text) {
      if (!text) return null;
      try {
        return JSON.parse(cleanMarkdownCodeBlock(String(text)));
      } catch (_) {
        return null;
      }
    }

    function getQualityResultRawText(qualityResult) {
      if (!qualityResult || typeof qualityResult !== 'object') return '';
      return qualityResult.text || (
        qualityResult.query_response && qualityResult.query_response.data
          ? qualityResult.query_response.data.text || ''
          : ''
      ) || '';
    }

    function extractQualityScore(scoreText) {
      if (!scoreText) return null;
      const raw = cleanMarkdownCodeBlock(String(scoreText));
      const parsed = tryParseQualityResult(raw);
      const candidates = [];
      const nestedScores = [];
      function collectNestedScores(value, depth = 0) {
        if (!value || typeof value !== 'object' || depth > 6) return;
        if (Array.isArray(value)) {
          value.forEach((item) => collectNestedScores(item, depth + 1));
          return;
        }
        Object.entries(value).forEach(([key, nestedValue]) => {
          if (String(key).toLowerCase() === 'score') {
            const n = Number(nestedValue);
            if (Number.isFinite(n)) nestedScores.push(n);
          } else if (nestedValue && typeof nestedValue === 'object') {
            collectNestedScores(nestedValue, depth + 1);
          }
        });
      }
      if (parsed && typeof parsed === 'object') {
        candidates.push(parsed.score, parsed.total_score, parsed.quality_score, parsed.avg_score, parsed.final_score);
        if (parsed.result && typeof parsed.result === 'object') {
          candidates.push(parsed.result.score, parsed.result.total_score, parsed.result.quality_score);
        }
        collectNestedScores(parsed);
      }
      for (const value of candidates) {
        const n = Number(value);
        if (Number.isFinite(n)) return n;
      }
      if (nestedScores.length) {
        return Math.round((nestedScores.reduce((sum, score) => sum + score, 0) / nestedScores.length) * 100) / 100;
      }
      const matched = raw.match(/["']?(?:score|评分|质检分|质量分|总分|得分)["']?\s*[:：=]?\s*(\d+(?:\.\d+)?)/i);
      if (matched) {
        const n = Number(matched[1]);
        if (Number.isFinite(n)) return n;
      }
      return null;
    }

    function getQualityScores(it, language = getCurrentTargetLanguage()) {
      if (!it || typeof it !== 'object') return [];
      const templateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const translateTemplateIds = getOrderedTranslateTemplateIdsForItem(it, language);
      return translateTemplateIds
        .map((translateTemplateId) => getItemQualityResult(it, templateId, translateTemplateId, language))
        .map((qualityResult) => {
          const scoreText = getQualityResultRawText(qualityResult);
          const score = extractQualityScore(scoreText);
          return score;
        })
        .filter((score) => score != null);
    }

    // 获取列表项质检信息文本，格式：质检task_id:{task_id}, 质检分:{score}
    function getItemQualityInfoText(it) {
      if (!it || typeof it !== 'object') return '-';
      const activeLanguage = getCurrentTargetLanguage();
      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const translateTemplateIds = getOrderedTranslateTemplateIdsForItem(it, activeLanguage);
      const parts = translateTemplateIds
        .map((translateTemplateId) => {
          const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId, activeLanguage);
          if (!qualityResult) return null;
          const taskId = qualityResult.task_id || '-';
          const scoreText = getQualityResultRawText(qualityResult);
          const score = extractQualityScore(scoreText);
          return `质检task_id:${taskId} 质检分:${score == null ? '未返回' : String(score)}`;
        })
        .filter(Boolean);
      return parts.length ? parts.join('\n') : '-';
    }

    function getQualityCheckStatus(it) {
      if (!it || typeof it !== 'object') return { text: '待质检', cls: 'warn' };
      const activeLanguage = getCurrentTargetLanguage();
      const failedLanguages = getFailedQualityLanguageCodes(it);
      const failureSummary = failedLanguages.length ? `失败语种:${formatLanguageCodeList(failedLanguages)}` : '';
      const scores = getQualityScores(it, activeLanguage);
      if (scores.length > 0) {
        const avgScore = Math.round(scores.reduce((sum, score) => sum + score, 0) / scores.length);
        return { text: `评价质检分:${avgScore}分`, cls: it._qualityChecking ? 'run' : 'ok', extra: failureSummary };
      }

      const templateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const qualityResults = getOrderedTranslateTemplateIdsForItem(it, activeLanguage)
        .map((translateTemplateId) => getItemQualityResult(it, templateId, translateTemplateId, activeLanguage))
        .filter(Boolean);
      const hasError = qualityResults.some((qualityResult) => qualityResult && qualityResult.error_msg);
      if (it._qualityChecking) return { text: '质检中', cls: 'run' };
      if (hasError) return { text: '质检失败', cls: 'bad', extra: failureSummary };
      const hasAnyText = qualityResults.some((qualityResult) => {
        const text = qualityResult && qualityResult.text ? qualityResult.text : (
          qualityResult && qualityResult.query_response && qualityResult.query_response.data
            ? qualityResult.query_response.data.text || ''
            : ''
        );
        return !!text;
      });
      if (!hasAnyText) return { text: '待质检', cls: 'warn', extra: failureSummary };
      return { text: '评价质检已完成', cls: 'ok', extra: failureSummary };
    }

    function buildQualityCheckPrompt(originItems, evaluationContext = null) {
      const context = evaluationContext || {
        mode: 'cross_language_translation',
        sourceType: '字幕原文',
        rules: '按跨语言翻译质量评估。',
      };
      const scoringReference = context.mode === 'same_language_subtitle_proofreading'
        ? [
            '90-100：校订准确自然，基本可直接使用，仅有标点、格式等轻微问题。',
            '80-89：整体可靠可用，存在少量局部问题或待核实内容，不影响主要信息。',
            '70-79：存在多处有实质影响的问题或无依据改写，需要重点复核后使用。',
            '60-69：存在关键金额、人名、机构名、型号或核心语义的明确错误，或残留较多识别错误。',
            '0-59：大量内容错误、缺失、错位或基本不可用。',
            '缺少音频、结束时间或原文含ASR噪声只能作为评估限制说明，不能单独扣分。',
          ].join('\n')
        : '按照质量分析模板既定的翻译评分标准执行。';
      return normalizeNewlines([
        '【评估上下文，不属于字幕原文】',
        `评估模式：${context.mode}`,
        `源文本类型：${context.sourceType}`,
        `评估规则：${context.rules}`,
        '评分参考：',
        scoringReference,
        '',
        '【字幕原文 JSON】',
        JSON.stringify(originItems, null, 2),
      ].join('\n'));
    }

    function buildQualityTaskIdMarkup(it) {
      if (!it || typeof it !== 'object') return '';
      const activeLanguage = getCurrentTargetLanguage();
      const selectedTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      const orderedTranslateTemplateIds = getOrderedTranslateTemplateIdsForItem(it, activeLanguage);

      return orderedTranslateTemplateIds
        .map((translateTemplateId) => {
          const qualityResult = getItemQualityResult(it, selectedTemplateId, translateTemplateId, activeLanguage);
          const taskId = qualityResult ? qualityResult.task_id || '' : '';
          if (!taskId) return '';
          const scoreText = getQualityResultRawText(qualityResult);
          const parsedScore = tryParseQualityResult(scoreText);
          const score = extractQualityScore(scoreText);
          const issuesCount = parsedScore && Array.isArray(parsedScore.issues) ? parsedScore.issues.length : null;
          const canRetrigger = isItemReadyForAnySelectedLanguage(it)
            && !isQualityRunActive(it, activeLanguage, translateTemplateId, selectedTemplateId);
          const scoreMarkup = score == null
            ? ''
            : `<span class="badge quality-task-score">质检分: ${escapeHtml(String(score))}</span>`;
          const issuesMarkup = issuesCount == null
            ? ''
            : `<span class="badge quality-task-issues">异常翻译数量: ${escapeHtml(String(issuesCount))}</span>`;
          const rerunBtnMarkup = `
            <button
              class="mini-copy-btn"
              type="button"
              data-action="quality-check-template"
              data-translate-template-id="${escapeHtml(String(translateTemplateId))}"
              ${canRetrigger ? '' : 'disabled'}
            >重新质检</button>
          `;
          return `
            <span class="quality-task-block">
              <span class="badge task-id" data-action="task-text" data-task-id="${escapeHtml(String(taskId))}">
                质检task_id(${escapeHtml(String(translateTemplateId || '-'))}): ${escapeHtml(String(taskId))}
              </span>
              <button class="mini-copy-btn" type="button" data-action="copy-task" data-task-id="${escapeHtml(String(taskId))}">复制</button>
              ${scoreMarkup ? `<span class="quality-task-break"></span>${scoreMarkup}${issuesMarkup}` : ''}
              ${rerunBtnMarkup}
            </span>
          `;
        })
        .filter(Boolean)
        .join('');
    }

    function updateBulkControls() {
      const total = items.length;
      const checked = checkedSet.size;
      const hasItems = total > 0;
      const languages = getSelectedTargetLanguages();
      const languageCount = languages.length;
      const translateTaskCount = countTranslateTasksInSelection();
      const readyChecked = countReadyQualityTasksInSelection();
      const failedTaskCount = countFailedTasksInSelection();
      const canBulkTranslate = hasItems && checked > 0 && languageCount > 0 && !bulkRunning && !qualityRunning;
      const canQualityCheck = hasItems && readyChecked > 0 && !bulkRunning && !qualityRunning;
      const canRetryFailed = hasItems && failedTaskCount > 0 && !bulkRunning && !qualityRunning;

      bulkRetranslateBtn.disabled = !canBulkTranslate;
      bulkRetranslateBtn.textContent = `全部翻译（${translateTaskCount}）`;
      bulkQualityCheckBtn.disabled = !canQualityCheck;
      bulkQualityCheckBtn.classList.toggle('ready-action', canQualityCheck);
      bulkQualityCheckBtn.textContent = `全部质检（就绪 ${readyChecked}）`;
      bulkQualityCheckBtn.title = '数字表示当前勾选文件和语言中已具备有效译文的质检任务数；翻译结果生成后会增加。按钮变为可用后点击才会开始质检。';
      retryFailedBtn.disabled = !canRetryFailed;
      retryFailedBtn.textContent = `失败全部重试（${failedTaskCount}）`;
      if (stopBatchBtn) stopBatchBtn.disabled = !(bulkRunning || qualityRunning);
      retryFailedBtn.title = failedTaskCount > 0 ? '只重试勾选条目、勾选语种中的失败任务' : '';

      if (!hasItems) {
        selectAllEl.checked = false;
        selectAllEl.indeterminate = false;
        selectAllEl.disabled = true;
        retryFailedBtn.disabled = true;
        if (stopBatchBtn) stopBatchBtn.disabled = true;
        return;
      }
      selectAllEl.disabled = false;
      selectAllEl.indeterminate = checked > 0 && checked < total;
      selectAllEl.checked = total > 0 && checked === total;
    }

    function toInt(v) {
      const n = Number(String(v ?? '').trim());
      return Number.isFinite(n) ? n : null;
    }

    function getTranslateStatus(it) {
      if (!it || typeof it !== 'object') return { text: '未翻译', cls: 'warn' };
      if (it._retranslating) return { text: '翻译中', cls: 'run' };
      const failedLanguages = getFailedTranslateLanguageCodes(it);
      const failureSummary = failedLanguages.length ? `失败语种:${formatLanguageCodeList(failedLanguages)}` : '';

      const hasTask = !!it.translate_task_id;
      const hasResp = !!it.translate_query_response;
      if (!hasTask && !hasResp) return { text: '未翻译', cls: 'warn' };

      const state = hasResp && it.translate_query_response.data ? it.translate_query_response.data.state : null;
      if (it.translate_error_msg) return { text: it.translate_error_msg, cls: 'bad', extra: failureSummary };
      if (state != null && typeof state === 'number' && state < 0) {
        const detail = it.translate_query_response && it.translate_query_response.data
          ? (it.translate_query_response.data.state_detail || it.translate_query_response.data.error || '')
          : '';
        return { text: `任务失败${detail ? `：${detail}` : ''}`, cls: 'bad', extra: failureSummary };
      }
      if (state !== 1) return { text: '进行中/等待', cls: 'run' };

      if (it.translate_parse_error) return { text: '翻译结构异常', cls: 'bad', extra: [failureSummary, '结果结构异常'].filter(Boolean).join('；') };

      const origin = toInt(it.origin_rows);
      const translated = toInt(it.translate_rows);
      if (origin == null || translated == null) return { text: '已完成', cls: 'ok', extra: failureSummary };
      if (origin !== translated) return { text: '翻译结构异常', cls: 'bad', extra: [failureSummary, '行数不一致'].filter(Boolean).join('；') };
      return { text: '翻译结构正常', cls: 'ok', extra: failureSummary };
    }

    // 检查翻译结果中是否存在空的 t 值
    function hasEmptyTranslation(it) {
      if (!it || typeof it !== 'object') return false;
      if (!it.translate_query_response || !it.translate_query_response.data) return false;
      const text = it.translate_query_response.data.text;
      if (!text) return false;
      try {
        const arr = deserializeContentArray(text, 'data.text');
        if (!Array.isArray(arr)) return false;
        return arr.some(item => item && (item.t === '' || item.t === null || item.t === undefined));
      } catch (_) {
        return false;
      }
    }

    // 更新翻译统计（成功/瑕疵/失败占比）
    function updateTranslateStats() {
      translateStatsEl.style.display = 'none';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildSubtitleArrayItem(entry, idx) {
      const originArr = deserializeContentArray(entry, `items[${idx}]`);
      const preview = originArr
        .slice(0, 4)
        .map((item) => item && item.t != null ? String(item.t).trim() : '')
        .filter((text) => text)
        .join('\n');

      return {
        origin_content: typeof entry === 'string' ? entry : JSON.stringify(originArr),
        origin_lang: '',
        target_lang: '',
        origin_rows: String(originArr.length),
        output_rows: '-',
        translate_rows: '-',
        _origin_preview: preview || '// 无字幕文本',
      };
    }

    function normalizeToItems(data) {
      // 兼容两种结构：
      // 1. 旧结构：对象数组 / 单对象
      // 2. 新结构：数组中的每一项是字幕 JSON 字符串（或字幕数组）
      if (Array.isArray(data)) {
        return data.map((entry, idx) => {
          if (typeof entry === 'string' || Array.isArray(entry)) {
            return buildSubtitleArrayItem(entry, idx);
          }
          if (entry && typeof entry === 'object') return entry;
          throw new Error(`第 ${idx + 1} 项类型不支持`);
        });
      }
      if (data && typeof data === 'object') return [data];
      throw new Error('文件顶层必须是对象或数组');
    }

    function renderItemsList() {
      if (!Array.isArray(items) || items.length === 0) {
        itemsListEl.innerHTML = '<li class="item"><div class="row1">没有条目</div><div class="row2">-</div></li>';
        updateBulkControls();
        return;
      }
      itemsListEl.innerHTML = items.map((it, idx) => {
        const activeLanguage = getCurrentTargetLanguage();
        if (it && typeof it === 'object' && activeLanguage) {
          syncPrimaryTranslateFields(it, activeLanguage);
          syncPrimaryQualityFields(it, activeLanguage);
        }
        const originRows = it && typeof it === 'object' ? (it.origin_rows ?? '-') : '-';
        const running = !!(it && typeof it === 'object' && it._retranslating);
        const qualityRunningForItem = !!(it && typeof it === 'object' && it._qualityChecking);
        const prog = it && typeof it === 'object' ? (it._progress ?? '') : '';
        const qualityProg = it && typeof it === 'object' ? (it._quality_progress ?? '') : '';
        const executionProgress = it && typeof it === 'object' ? getItemExecutionProgressText(it) : '';
        const st = getTranslateStatus(it);
        const qualitySt = getQualityCheckStatus(it);
        const hasEmpty = hasEmptyTranslation(it);
        const active = idx === selected ? ' active' : '';
        const checked = checkedSet.has(idx) ? 'checked' : '';
        const qualityInfoText = getItemQualityInfoText(it);
        return `
          <li class="item${active}" data-idx="${idx}">
            <div class="row1">
              <div class="row1-left">
                <input type="checkbox" data-action="check" data-idx="${idx}" ${checked} />
                <span class="badge">#${idx + 1}</span>
                <span class="badge">字幕原文行数: ${escapeHtml(String(originRows))}</span>
                <span class="badge ${escapeHtml(st.cls)}">${escapeHtml(st.text)}</span>
                ${st.extra ? `<span class="badge bad">${escapeHtml(st.extra)}</span>` : ''}
                <span class="badge ${escapeHtml(qualitySt.cls)}">${escapeHtml(qualitySt.text)}</span>
                ${qualitySt.extra ? `<span class="badge bad">${escapeHtml(qualitySt.extra)}</span>` : ''}
                ${hasEmpty ? '<span class="badge warn">存在翻译结果为空的项</span>' : ''}
                ${executionProgress ? `<span class="badge exec-progress">${escapeHtml(executionProgress)}</span>` : ''}
                ${prog ? `<span class="badge">${escapeHtml(String(prog))}</span>` : ''}
                ${qualityProg ? `<span class="badge">${escapeHtml(String(qualityProg))}</span>` : ''}
              </div>
              <div class="row1-right">
                <button class="small-btn" data-action="retranslate" data-idx="${idx}" ${running ? 'disabled' : ''}>重新翻译</button>
                <button class="small-btn" data-action="quality-check" data-idx="${idx}" ${(!isItemReadyForAnySelectedLanguage(it) || qualityRunningForItem) ? 'disabled' : ''}>重新质检</button>
              </div>
            </div>
            <div class="row2">${escapeHtml(qualityInfoText)}</div>
          </li>
        `;
      }).join('');
      updateBulkControls();
      updateTranslateStats();
      updateAllQualityTemplateAverageBadges();
    }

    function selectItem(idx) {
      if (!Number.isInteger(idx) || idx < 0 || idx >= items.length) return;
      selected = idx;
      selectedIndexEl.textContent = `#${idx + 1}`;
      detailSelectedEl.textContent = `#${idx + 1}`;
      renderItemsList();

      const obj = items[idx];

      const originArr = deserializeContentArray(obj && typeof obj === 'object' ? obj.origin_content : null, 'origin_content');
      lastOriginPretty = JSON.stringify(originArr, null, 2);
      jsonPreviewEl.textContent = lastOriginPretty;

      // 展示翻译结果 data.text 与翻译质量结果
      syncPrimaryTranslateFields(obj, getCurrentTargetLanguage());
      syncPrimaryQualityFields(obj, getCurrentTargetLanguage());
      renderTranslatePreview(obj);
      renderQualityPreview(obj);

      setStatus('已加载条目详情', 'success');
    }

    function computeTranslateRowsForItem(it) {
      if (!it || typeof it !== 'object') return '-';
      // 仅使用接口响应中的 data.text（成功反序列化后）的数组长度
      if (it.translate_query_response && it.translate_query_response.data && it.translate_query_response.data.text) {
        try {
          const arr = deserializeContentArray(it.translate_query_response.data.text, 'data.text');
          return String(Array.isArray(arr) ? arr.length : '-');
        } catch (_) {
          return '-';
        }
      }
      return '-';
    }

    async function handleFile(file) {
      clearView();
      if (!file) return;

      pickedFileNameEl.textContent = file.name || '未选择';
      fileNameEl.textContent = file.name || '-';
      setStatus('正在解析文件...', '');

      const text = await file.text();
      const root = JSON.parse(text);
      items = normalizeToItems(root);
      // 初始不计算 translate_rows：必须等接口响应 data.text 成功反序列化后才有值
      for (const it of items) {
        if (it && typeof it === 'object') {
          if (!it.origin_rows || it.origin_rows === '-') {
            try {
              const originArr = deserializeContentArray(it.origin_content, 'origin_content');
              it.origin_rows = String(Array.isArray(originArr) ? originArr.length : '-');
              if (!it._origin_preview) {
                it._origin_preview = originArr
                  .slice(0, 4)
                  .map((item) => item && item.t != null ? String(item.t).trim() : '')
                  .filter((text) => text)
                  .join('\n');
              }
            } catch (_) {
              // ignore preview fallback errors
            }
          }
          syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
        }
      }
      applySelectedTargetLanguageToItems();
      itemsCountEl.textContent = String(items.length);
      selectedIndexEl.textContent = '-';
      // 默认全选第一项（用于详情展示），但不默认勾选
      updateBulkControls();

      selected = 0;
      renderItemsList();
      selectItem(0);
      setStatus('文件解析成功', 'success');
    }
