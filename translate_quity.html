      // 筛选：已勾选 + 有翻译结果
      const successItems = [];
      let noTranslateCount = 0;
      for (const idx of checkedSet) {
        if (idx < 0 || idx >= items.length) continue;
        const it = items[idx];
        if (!it || typeof it !== 'object') continue;
        // 检查是否有翻译结果
        const hasTranslate = it.translate_query_response && 
          it.translate_query_response.data && 
          it.translate_query_response.data.text;
        if (!hasTranslate) {
          noTranslateCount++;
          continue;
        }
        successItems.push(it);
      }

      if (successItems.length === 0) {
        setStatus(`勾选的 ${checkedSet.size} 个条目中没有已翻译的内容（未翻译: ${noTranslateCount} 个）`, 'error');
        return;
      }

      const skipped = checkedSet.size - successItems.length;
      const skipInfo = skipped > 0 ? `（跳过 ${skipped} 个未翻译的）` : '';
      setStatus(`正在导出 ${successItems.length} 个已翻译的条目${skipInfo}...`, '');

      // 整理所有翻译结果到一个文件
      const sections = [];
      let failed = 0;

      for (let i = 0; i < successItems.length; i++) {
        const it = successItems[i];
        try {
          // 获取原文数组（用于获取第一个 s 值）
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');
          // 获取译文数组
          const translateText = it.translate_query_response && it.translate_query_response.data
            ? it.translate_query_response.data.text
            : null;
          const translateArr = deserializeContentArray(translateText, 'data.text');

          // 获取标题参数
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          // 生成标题
          const sectionTitle = `${originLang}_${targetLang}_${firstS}:`;
          // 提取 t 值并逐行拼接
          const translateLines = translateArr.map(item => (item && item.t != null ? String(item.t) : '')).join('\n');

          // 组合为一个段落
          sections.push(`${sectionTitle}\n${translateLines}`);
        } catch (err) {
          failed++;
          console.error(`处理条目失败:`, err);
        }
      }

      if (sections.length === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      // 合并所有段落，用两个空行分隔
      const fileContent = sections.join('\n\n\n');

      // 获取文件名（去掉扩展名）
      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_翻译文档.txt`;

      // 下载文件
      downloadTextFile(outputFileName, fileContent);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${sections.length} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${sections.length} 个条目）`, 'success');
      }
    });

    // 下载 JSON 文件
    function downloadJsonFile(filename, data) {
      const content = JSON.stringify(data, null, 2);
      const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    if (exportMergedJsonBtn) exportMergedJsonBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      if (checkedSet.size === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      const successItems = [];
      let noTranslateCount = 0;
      let parseErrorCount = 0;
      for (const idx of checkedSet) {
        if (idx < 0 || idx >= items.length) continue;
        const it = items[idx];
        if (!it || typeof it !== 'object') continue;
        const hasTranslate = it.translate_query_response &&
          it.translate_query_response.data &&
          it.translate_query_response.data.text;
        if (!hasTranslate) {
          noTranslateCount++;
          continue;
        }
        if (it.translate_parse_error) {
          parseErrorCount++;
          continue;
        }
        successItems.push(it);
      }

      if (successItems.length === 0) {
        const details = [];
        if (noTranslateCount > 0) details.push(`未翻译: ${noTranslateCount} 个`);
        if (parseErrorCount > 0) details.push(`结构异常: ${parseErrorCount} 个`);
        const detailStr = details.length > 0 ? `（${details.join('，')}）` : '';
        setStatus(`勾选的 ${checkedSet.size} 个条目中没有可导出的${detailStr}`, 'error');
        return;
      }

      setStatus(`正在导出 ${successItems.length} 个合并字幕条目...`, '');

      const resultObj = {};
      let failed = 0;

      for (const it of successItems) {
        try {
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');
          const translateText = it.translate_query_response && it.translate_query_response.data
            ? it.translate_query_response.data.text
            : null;
          const translateArr = deserializeContentArray(translateText, 'data.text');

          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          const baseKey = `${originLang}_${targetLang}_${firstS}`;
          let key = baseKey;
          let suffix = 1;
          while (Object.prototype.hasOwnProperty.call(resultObj, key)) {
            key = `${baseKey}_${suffix}`;
            suffix++;
          }

          const mergedRows = originArr.map((originItem, index) => {
            const translateItem = translateArr[index] || {};
            return {
              s: originItem && originItem.s != null
                ? originItem.s
                : (translateItem && translateItem.s != null ? translateItem.s : null),
              o: originItem && originItem.t != null ? String(originItem.t) : '',
              t: translateItem && translateItem.t != null ? String(translateItem.t) : '',
            };
          });

          resultObj[key] = mergedRows;
        } catch (err) {
          failed++;
          console.error('处理合并字幕导出条目失败:', err);
        }
      }

      const exportedCount = Object.keys(resultObj).length;
      if (exportedCount === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_合并字幕.json`;
      downloadJsonFile(outputFileName, resultObj);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${exportedCount} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${exportedCount} 个条目）`, 'success');
      }
    });

    // 批量导出已勾选且有翻译结果且结构正常的条目（JSON 格式）
    if (exportJsonBtn) exportJsonBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      if (checkedSet.size === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      // 筛选：已勾选 + 有翻译结果 + 结构可解析
      const successItems = [];
      let noTranslateCount = 0;
      let parseErrorCount = 0;
      for (const idx of checkedSet) {
        if (idx < 0 || idx >= items.length) continue;
        const it = items[idx];
        if (!it || typeof it !== 'object') continue;
        // 检查是否有翻译结果
        const hasTranslate = it.translate_query_response && 
          it.translate_query_response.data && 
          it.translate_query_response.data.text;
        if (!hasTranslate) {
          noTranslateCount++;
          continue;
        }
        // 检查是否可以被解析为 JSON（排除结构异常的）
        if (it.translate_parse_error) {
          parseErrorCount++;
          continue;
        }
        successItems.push(it);
      }

      if (successItems.length === 0) {
        const details = [];
        if (noTranslateCount > 0) details.push(`未翻译: ${noTranslateCount} 个`);
        if (parseErrorCount > 0) details.push(`结构异常: ${parseErrorCount} 个`);
        const detailStr = details.length > 0 ? `（${details.join('，')}）` : '';
        setStatus(`勾选的 ${checkedSet.size} 个条目中没有可导出的${detailStr}`, 'error');
        return;
      }

      const skipped = checkedSet.size - successItems.length;
      const skipInfo = skipped > 0 ? `（跳过 ${skipped} 个不符合条件的）` : '';
      setStatus(`正在导出 ${successItems.length} 个已翻译的条目${skipInfo}...`, '');

      // 整理所有翻译结果到一个 JSON 对象
      const resultObj = {};
      let failed = 0;

      for (let i = 0; i < successItems.length; i++) {
        const it = successItems[i];
        try {
          // 获取原文数组（用于获取第一个 s 值）
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');
          // 获取译文数组
          const translateText = it.translate_query_response && it.translate_query_response.data
            ? it.translate_query_response.data.text
            : null;
          const translateArr = deserializeContentArray(translateText, 'data.text');

          // 获取 key 参数
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          // 生成 key（检测重复并添加后缀）
          const baseKey = `${originLang}_${targetLang}_${firstS}`;
          let key = baseKey;
          let suffix = 1;
          while (resultObj.hasOwnProperty(key)) {
            key = `${baseKey}_${suffix}`;
            suffix++;
          }

          // 添加到结果对象
          resultObj[key] = translateArr;
        } catch (err) {
          failed++;
          console.error(`处理条目失败:`, err);
        }
      }

      const exportedCount = Object.keys(resultObj).length;
      if (exportedCount === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      // 获取文件名（去掉扩展名）
      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_翻译文档.json`;

      // 下载文件
      downloadJsonFile(outputFileName, resultObj);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${exportedCount} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${exportedCount} 个条目）`, 'success');
      }
    });

    // 批量导出已勾选的条目（原始 JSON 格式，不检查翻译状态）
    if (exportOriginJsonBtn) exportOriginJsonBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      if (checkedSet.size === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      // 筛选：仅已勾选的条目
      const selectedItems = [];
      for (const idx of checkedSet) {
        if (idx < 0 || idx >= items.length) continue;
        const it = items[idx];
        if (!it || typeof it !== 'object') continue;
        selectedItems.push(it);
      }

      if (selectedItems.length === 0) {
        setStatus('没有有效的勾选条目', 'error');
        return;
      }

      setStatus(`正在导出 ${selectedItems.length} 个勾选的条目...`, '');

      // 整理所有原始内容到一个 JSON 对象
      const resultObj = {};
      let failed = 0;

      for (let i = 0; i < selectedItems.length; i++) {
        const it = selectedItems[i];
        try {
          // 获取原文数组
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');

          // 获取 key 参数
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          // 生成 key（检测重复并添加后缀）
          const baseKey = `${originLang}_${targetLang}_${firstS}`;
          let key = baseKey;
          let suffix = 1;
          while (resultObj.hasOwnProperty(key)) {
            key = `${baseKey}_${suffix}`;
            suffix++;
          }

          // 添加到结果对象
          resultObj[key] = originArr;
        } catch (err) {
          failed++;
          console.error(`处理条目失败:`, err);
        }
      }

      const exportedCount = Object.keys(resultObj).length;
      if (exportedCount === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      // 获取文件名（去掉扩展名）
      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_原始.json`;

      // 下载文件
      downloadJsonFile(outputFileName, resultObj);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${exportedCount} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${exportedCount} 个条目）`, 'success');
      }
    });

    // 批量导出已勾选的条目（原始文本格式，不检查翻译状态）
    if (exportOriginBtn) exportOriginBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      if (checkedSet.size === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      // 筛选：仅已勾选的条目
      const selectedItems = [];
      for (const idx of checkedSet) {
        if (idx < 0 || idx >= items.length) continue;
        const it = items[idx];
        if (!it || typeof it !== 'object') continue;
        selectedItems.push(it);
      }

      if (selectedItems.length === 0) {
        setStatus('没有有效的勾选条目', 'error');
        return;
      }

      setStatus(`正在导出 ${selectedItems.length} 个勾选的条目...`, '');

      // 整理所有原始文本到一个文件
      const sections = [];
      let failed = 0;

      for (let i = 0; i < selectedItems.length; i++) {
        const it = selectedItems[i];
        try {
          // 获取原文数组
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');

          // 获取标题参数
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          // 生成标题
          const sectionTitle = `${originLang}_${targetLang}_${firstS}:`;
          // 提取 t 值并逐行拼接
          const originLines = originArr.map(item => (item && item.t != null ? String(item.t) : '')).join('\n');

          // 组合为一个段落
          sections.push(`${sectionTitle}\n${originLines}`);
        } catch (err) {
          failed++;
          console.error(`处理条目失败:`, err);
        }
      }

      if (sections.length === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      // 合并所有段落，用两个空行分隔
      const fileContent = sections.join('\n\n\n');

      // 获取文件名（去掉扩展名）
      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_原始文档.txt`;

      // 下载文件
      downloadTextFile(outputFileName, fileContent);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${sections.length} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${sections.length} 个条目）`, 'success');
      }
    });

    exportProofreadOriginBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      const selectedItems = getCheckedItemsSorted();
      if (selectedItems.length === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      const { groups, failed } = buildProofreadGroups(selectedItems, 'origin');
      if (groups.size === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      groups.forEach((sections, groupKey) => {
        const outputFileName = `${sourceFileName}_校对原文_${groupKey}.txt`;
        downloadTextFile(outputFileName, sections.join('\n\n\n'));
      });

      if (failed > 0) {
        setStatus(`导出校对原文完成：共 ${groups.size} 个文件，${failed} 个条目失败`, 'error');
      } else {
        setStatus(`导出校对原文成功：共 ${groups.size} 个文件`, 'success');
      }
    });

    exportProofreadBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      const selectedItems = getCheckedItemsSorted().filter((it) => hasTranslateText(it));
      if (selectedItems.length === 0) {
        setStatus('请先勾选至少一个已翻译的条目', 'error');
        return;
      }

      const templateIds = Array.from(new Set(
        selectedItems.flatMap((it) => getOrderedTranslateTemplateIdsForItem(it))
      ));
      if (templateIds.length === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      let totalFiles = 0;
      let failed = 0;
      templateIds.forEach((templateId) => {
        const matchedItems = selectedItems.filter((it) => {
          const translateResult = getItemTranslateResult(it, templateId);
          return !!getTranslateResultText(translateResult);
        });
        if (!matchedItems.length) return;

        const result = buildProofreadGroups(matchedItems, 'translate', templateId);
        failed += result.failed;
        result.groups.forEach((sections, groupKey) => {
          const outputFileName = `${templateId}_${groupKey}.txt`;
          downloadTextFile(outputFileName, sections.join('\n\n\n'));
          totalFiles++;
        });
      });

      if (totalFiles === 0) {
        setStatus('导出失败：没有可导出的模板译文结果', 'error');
        return;
      }

      if (failed > 0) {
        setStatus(`导出校对译文完成：共 ${totalFiles} 个文件，${failed} 个条目失败`, 'error');
      } else {
        setStatus(`导出校对译文成功：共 ${totalFiles} 个文件`, 'success');
      }
    });

    exportQualityResultBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      const selectedItems = getCheckedItemsSorted();
      if (selectedItems.length === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      if (!qualityTemplateId) {
        setStatus('请先填写质量分析模板id', 'error');
        return;
      }

      const templateIds = Array.from(new Set(
        selectedItems.flatMap((it) => getOrderedTranslateTemplateIdsForItem(it))
      ));
      if (templateIds.length === 0) {
        setStatus('导出失败：没有可导出的翻译模板', 'error');
        return;
      }

      let totalFiles = 0;
      let failed = 0;

      templateIds.forEach((translateTemplateId) => {
        const sections = [];

        selectedItems.forEach((it, index) => {
          try {
            const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId);
            if (!qualityResult) return;
            const text = qualityResult.error_msg || qualityResult.text || (
              qualityResult.query_response && qualityResult.query_response.data
                ? qualityResult.query_response.data.text || ''
                : ''
            );
            if (!text) return;

            const parsed = tryParseQualityResult(text);
            const content = parsed ? JSON.stringify(parsed, null, 2) : String(text);
            sections.push(`文件${index + 1}:\n${content}`);
          } catch (err) {
            failed++;
            console.error('处理质检结果导出条目失败:', err);
          }
        });

        if (!sections.length) return;
        const outputFileName = `质检结果_${translateTemplateId}.txt`;
        downloadTextFile(outputFileName, sections.join('\n\n\n'));
        totalFiles++;
      });

      if (totalFiles === 0) {
        setStatus('导出失败：没有可导出的质检结果', 'error');
        return;
      }

      if (failed > 0) {
        setStatus(`导出质检结果完成：共 ${totalFiles} 个文件，${failed} 个条目失败`, 'error');
      } else {
        setStatus(`导出质检结果成功：共 ${totalFiles} 个文件`, 'success');
      }
    });
  </script>
</body>
