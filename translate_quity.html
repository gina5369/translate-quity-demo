    function getTranslateRunKey(language, templateId) {
      return `${normalizeLanguageCode(language)}::${String(templateId || '')}`;
    }

    function ensureTranslateRunState(it) {
      if (!it._activeTranslateRuns || typeof it._activeTranslateRuns !== 'object') it._activeTranslateRuns = {};
      if (!it._translateProgressByRun || typeof it._translateProgressByRun !== 'object') it._translateProgressByRun = {};
    }

    function setTranslateRunProgress(it, runKey, progressText) {
      ensureTranslateRunState(it);
      if (progressText) it._translateProgressByRun[runKey] = progressText;
      else delete it._translateProgressByRun[runKey];
      it._progress = Object.values(it._translateProgressByRun).join(' · ');
    }

    function finishTranslateRuns(it, runKeys) {
      ensureTranslateRunState(it);
      runKeys.forEach((runKey) => {
        delete it._activeTranslateRuns[runKey];
        delete it._translateProgressByRun[runKey];
      });
      it._retranslating = Object.keys(it._activeTranslateRuns).length > 0;
      it._progress = Object.values(it._translateProgressByRun).join(' · ');
    }

    function getQualityRunKey(language, translateTemplateId, qualityTemplateId) {
      return `${normalizeLanguageCode(language)}::${String(translateTemplateId || '')}::${String(qualityTemplateId || '')}`;
    }

    function ensureQualityRunState(it) {
      if (!it._activeQualityRuns || typeof it._activeQualityRuns !== 'object') it._activeQualityRuns = {};
      if (!it._qualityProgressByRun || typeof it._qualityProgressByRun !== 'object') it._qualityProgressByRun = {};
    }

    function isQualityRunActive(it, language, translateTemplateId, qualityTemplateId) {
      if (!it || typeof it !== 'object') return false;
      ensureQualityRunState(it);
      return !!it._activeQualityRuns[getQualityRunKey(language, translateTemplateId, qualityTemplateId)];
    }

    function setQualityRunProgress(it, runKey, progressText) {
      ensureQualityRunState(it);
      if (progressText) it._qualityProgressByRun[runKey] = progressText;
      else delete it._qualityProgressByRun[runKey];
      it._quality_progress = Object.values(it._qualityProgressByRun).join(' · ');
    }

    function finishQualityRuns(it, runKeys) {
      ensureQualityRunState(it);
      runKeys.forEach((runKey) => {
        delete it._activeQualityRuns[runKey];
        delete it._qualityProgressByRun[runKey];
      });
      it._qualityChecking = Object.keys(it._activeQualityRuns).length > 0;
      it._quality_progress = Object.values(it._qualityProgressByRun).join(' · ');
    }

    async function retranslateItemSingleLanguage(idx, translateTemplateIdsOverride, targetLanguageOverride, signal = null) {
      const it = items[idx];
      if (!it || typeof it !== 'object') return false;
      let targetLang = '';
      let runKeys = [];
      try {
        throwIfAborted(signal);
        saveConfig();
        const originContent = it.origin_content;
        const subtitleLen = it.origin_rows;
        targetLang = normalizeLanguageCode(targetLanguageOverride || it.target_lang || getCurrentTargetLanguage());
        const originLang = it.origin_lang ?? '';
        const translateTemplateIds = Array.isArray(translateTemplateIdsOverride) && translateTemplateIdsOverride.length
          ? translateTemplateIdsOverride.filter((value) => value)
          : getTranslateTemplateIds();
        if (!translateTemplateIds.length) {
          throw new Error('请先填写至少一个字幕翻译模板id');
        }
        if (!targetLang) {
          throw new Error('请先勾选至少一个翻译语种');
        }
        ensureTranslateRunState(it);
        runKeys = translateTemplateIds.map((templateId) => getTranslateRunKey(targetLang, templateId));
        if (runKeys.some((runKey) => it._activeTranslateRuns[runKey])) return false;
        runKeys.forEach((runKey) => { it._activeTranslateRuns[runKey] = true; });
        it._retranslating = true;
        const isPartialRetry = Array.isArray(translateTemplateIdsOverride) && translateTemplateIdsOverride.length > 0;
        // 与 Python 版本保持一致：先反序列化为数组，再以缩进=2 的 JSON 文本发送（避免 \" 这类转义形态）
        let textPrompt = '';
        let arr;
        try {
          arr = deserializeContentArray(originContent, 'origin_content');
          textPrompt = normalizeNewlines(JSON.stringify(arr, null, 2));
        } catch (e) {
          it.translate_error_msg = `origin_content 反序列化失败：${e && e.message ? e.message : String(e)}`;
          renderItemsList();
          return false;
        }

        const translateResults = ensureItemTranslateResults(it, targetLang);
        if (!isPartialRetry) {
          it.translate_task_id = '';
          it.translate_template_id = translateTemplateIds[0] || '';
          if (!it.translate_results_by_lang || typeof it.translate_results_by_lang !== 'object') it.translate_results_by_lang = {};
          it.translate_results_by_lang[targetLang] = {};
          it.translate_error_msg = '';
          it.translate_parse_error = '';
          it.quality_check_task_id = '';
          it.quality_check_query_response = null;
          it.quality_check_text = '';
          it.quality_check_error_msg = '';
          if (!it.quality_check_results_by_lang || typeof it.quality_check_results_by_lang !== 'object') it.quality_check_results_by_lang = {};
          it.quality_check_results_by_lang[targetLang] = {};
        } else {
          translateTemplateIds.forEach((translateTemplateId) => {
            translateResults[translateTemplateId] = {
              task_id: '',
              text: '',
              query_response: null,
              error_msg: '',
              parse_error: '',
              rows: '-',
            };
            const qualityResults = ensureItemQualityResults(it, targetLang);
            delete qualityResults[translateTemplateId];
          });
          syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
          syncPrimaryQualityFields(it, getCurrentTargetLanguage());
        }
        renderItemsList();
        setStatus(`正在重新翻译 #${idx + 1} · ${getLanguageLabel(targetLang)}，共 ${translateTemplateIds.length} 个模板...`, '');

        const mappedOriginLang = mapLanguageToZhDesc(originLang);
        const mappedTargetLang = mapLanguageToZhDesc(targetLang);
        let failedCount = 0;
        for (let i = 0; i < translateTemplateIds.length; i += 1) {
          const translateTemplateId = translateTemplateIds[i];
          const results = ensureItemTranslateResults(it, targetLang);
          results[translateTemplateId] = {
            task_id: '',
            text: '',
            query_response: null,
            error_msg: '',
            parse_error: '',
            rows: '-',
          };
          const templateIndexText = `${getLanguageLabel(targetLang)} · 模板 ${i + 1}/${translateTemplateIds.length}`;
          const runKey = getTranslateRunKey(targetLang, translateTemplateId);
          try {
            const res = await requestLlmChatAsync({
              textPrompt,
              subtitleLen,
              originLang: mappedOriginLang,
              language: mappedTargetLang,
              templateIdValue: translateTemplateId,
              emptyTemplateMessage: '请先填写字幕翻译模板id',
              estimatedInputTokens: estimateItemInputTokens(it),
              signal,
              onProgress: ({ stage, progress, taskId }) => {
                if (stage === 'create') setTranslateRunProgress(it, runKey, progress ? `翻译 ${templateIndexText} ${progress}` : `翻译 ${templateIndexText} 创建中`);
                else if (stage === 'created' && taskId) {
                  results[translateTemplateId].task_id = taskId;
                  setTranslateRunProgress(it, runKey, `翻译 ${templateIndexText} 已创建`);
                }
                else if (typeof progress !== 'undefined' && progress !== null && progress !== '') setTranslateRunProgress(it, runKey, `翻译 ${templateIndexText} ${progress}`);
                else setTranslateRunProgress(it, runKey, `翻译 ${templateIndexText} 进行中`);
                syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
                renderItemsList();
                if (selected === idx) renderTranslatePreview(it);
              },
            });

            results[translateTemplateId] = {
              task_id: res.taskId || results[translateTemplateId].task_id || '',
              text: res.text || '',
              query_response: res.queryResponse || null,
              error_msg: '',
              parse_error: '',
              rows: '-',
            };
            results[translateTemplateId].rows = computeTranslateRowsFromResult(results[translateTemplateId]);
            const validationError = getTranslationValidationError(res.text, subtitleLen);
            if (validationError) {
              failedCount += 1;
              results[translateTemplateId].error_msg = `译文结果无效：${validationError}`;
              results[translateTemplateId].parse_error = validationError;
            }
          } catch (err) {
            failedCount += 1;
            const errorResult = {
              task_id: results[translateTemplateId].task_id || '',
              text: '',
              query_response: err && err.queryResponse ? err.queryResponse : null,
              error_msg: `任务失败：${err && err.message ? err.message : String(err)}`,
              parse_error: '',
              rows: '-',
            };
            if (errorResult.query_response && errorResult.query_response.data && errorResult.query_response.data.text) {
              errorResult.rows = computeTranslateRowsFromResult(errorResult);
            }
            results[translateTemplateId] = errorResult;
            if (isAbortError(err)) throw err;
          }
          syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
          renderItemsList();
          if (selected === idx) {
            renderTranslatePreview(it);
            renderQualityTemplateSelector();
            renderQualityPreview(it);
          }
        }

        syncPrimaryTranslateFields(it, getCurrentTargetLanguage());
        if (selected === idx) {
          renderTranslatePreview(it);
          renderQualityTemplateSelector();
          renderQualityPreview(it);
        }

        if (failedCount > 0) {
          setStatus(`重新翻译完成：#${idx + 1} · ${getLanguageLabel(targetLang)} 共 ${translateTemplateIds.length} 个模板，失败 ${failedCount} 个`, 'error');
          return false;
        }
        setStatus(`重新翻译完成：已更新 #${idx + 1} · ${getLanguageLabel(targetLang)} 的 ${translateTemplateIds.length} 个模板译文（内存）`, 'success');
        return true;
      } catch (err) {
        if (isAbortError(err)) {
          setStatus(`已停止翻译 #${idx + 1} · ${getLanguageLabel(targetLang || getCurrentTargetLanguage())}`, 'error');
          return false;
        }
        // 任务失败/请求失败：记录到条目上，列表可见
        if (it && typeof it === 'object') {
          it.translate_error_msg = `任务失败：${err && err.message ? err.message : String(err)}`;
          // 若错误对象携带接口响应，也保留下来方便排查
          if (err && err.queryResponse) it.translate_query_response = err.queryResponse;
        }
        setStatus(`重新翻译失败：${err && err.message ? err.message : String(err)}`, 'error');
        return false;
      } finally {
        const it2 = items[idx];
        if (it2 && typeof it2 === 'object') {
          finishTranslateRuns(it2, runKeys);
        }
        renderItemsList();
      }
    }

    async function retranslateItem(idx, translateTemplateIdsOverride, targetLanguagesOverride, signal = null) {
      const languages = Array.isArray(targetLanguagesOverride) && targetLanguagesOverride.length
        ? targetLanguagesOverride.map((language) => normalizeLanguageCode(language)).filter(Boolean)
        : getSelectedTargetLanguages();
      if (!languages.length) {
        setStatus('请先勾选至少一个翻译语种', 'error');
        return false;
      }
      let ok = true;
      for (const language of languages) {
        throwIfAborted(signal);
        const itemOk = await retranslateItemSingleLanguage(idx, translateTemplateIdsOverride, language, signal);
        ok = ok && itemOk;
      }
      return ok;
    }

    async function qualityCheckItemSingleLanguage(idx, translateTemplateIdsOverride, targetLanguageOverride, signal = null) {
      const it = items[idx];
      if (!it || typeof it !== 'object') return false;
      let targetTranslateTemplateIds = [];
      let targetLang = '';
      let runKeys = [];
      try {
        throwIfAborted(signal);
        saveConfig();
        const originArr = deserializeContentArray(it.origin_content, 'origin_content');
        const qualityTemplateIds = getQualityTemplateIds();
        if (!qualityTemplateIds.length) {
          throw new Error('请先填写至少一个质量分析模板id');
        }
        targetLang = normalizeLanguageCode(targetLanguageOverride || it.target_lang || getCurrentTargetLanguage());
        if (!targetLang) {
          throw new Error('请先勾选至少一个翻译语种');
        }
        const translateTemplateIds = Array.isArray(translateTemplateIdsOverride) && translateTemplateIdsOverride.length
          ? translateTemplateIdsOverride.filter((value) => value)
          : getOrderedTranslateTemplateIdsForItem(it, targetLang).filter((translateTemplateId) => {
            const translateResult = getItemTranslateResult(it, translateTemplateId, targetLang);
            return isUsableTranslateResult(it, translateResult);
          });
        targetTranslateTemplateIds = translateTemplateIds.slice();
        if (!translateTemplateIds.length) {
          throw new Error('请先完成至少一个译文模板的翻译');
        }

        ensureQualityRunState(it);
        const requestedRunKeys = translateTemplateIds.flatMap((translateTemplateId) => (
          qualityTemplateIds.map((qualityTemplateId) => getQualityRunKey(targetLang, translateTemplateId, qualityTemplateId))
        ));
        if (requestedRunKeys.some((runKey) => it._activeQualityRuns[runKey])) return false;
        runKeys = requestedRunKeys;
        runKeys.forEach((runKey) => {
          it._activeQualityRuns[runKey] = true;
          setQualityRunProgress(it, runKey, '创建中');
        });
        it._qualityChecking = true;
        ensureItemQualityResults(it, targetLang);
        renderItemsList();
        setStatus(`正在进行质量检查 #${idx + 1} · ${getLanguageLabel(targetLang)} ...`, '');

        const mappedOriginLang = mapLanguageToZhDesc(it.origin_lang ?? '');
        const mappedTargetLang = mapLanguageToZhDesc(targetLang);
        const qualityEvaluationContext = getQualityEvaluationContext({
          originItems: originArr,
          originLang: it.origin_lang ?? '',
          targetLang,
        });
        let failedCount = 0;
        for (let translateIdx = 0; translateIdx < translateTemplateIds.length; translateIdx += 1) {
          const translateTemplateId = translateTemplateIds[translateIdx];
          const translateResult = getItemTranslateResult(it, translateTemplateId, targetLang);
          const translatedText = getTranslateResultText(translateResult);
          for (let qualityIdx = 0; qualityIdx < qualityTemplateIds.length; qualityIdx += 1) {
            const templateId = qualityTemplateIds[qualityIdx];
              const runKey = getQualityRunKey(targetLang, translateTemplateId, templateId);
              const resultsForTranslate = ensureItemQualityResultsForTranslate(it, translateTemplateId, targetLang);
              resultsForTranslate[templateId] = {
                task_id: '',
                text: '',
                query_response: null,
                error_msg: '',
              };
              const progressText = `质检 ${getLanguageLabel(targetLang)} · 译文模板 ${translateIdx + 1}/${translateTemplateIds.length} · 质检模板 ${qualityIdx + 1}/${qualityTemplateIds.length}`;
              const translationValidationError = getTranslationValidationError(translatedText, it.origin_rows);
              if (translationValidationError) {
                failedCount++;
                resultsForTranslate[templateId] = {
                  task_id: '',
                  text: '',
                  query_response: null,
                  error_msg: `质检跳过：${translationValidationError}`,
                };
                syncPrimaryQualityFields(it, getCurrentTargetLanguage());
                renderItemsList();
                if (selected === idx) refreshSelectedQualityPreview();
                continue;
              }
              try {
                const res = await requestLlmChatAsync({
                  templateVariablesObj: {
                    PROMPT: buildQualityCheckPrompt(originArr, qualityEvaluationContext),
                    TRANSLATED_CONTENT: String(translatedText || '').trim(),
                    LANGUAGE: mappedTargetLang,
                    TARGET_LANG: mappedTargetLang,
                    SUBTITLE_LEN: it.origin_rows || '',
                    ORIGIN_LANG: qualityEvaluationContext.originLabel,
                    EVALUATION_MODE: qualityEvaluationContext.mode,
                    SOURCE_TEXT_TYPE: qualityEvaluationContext.sourceType,
                    AUDIO_AVAILABLE: '否',
                    EVALUATION_RULES: qualityEvaluationContext.rules,
                  },
                  templateIdValue: templateId,
                  emptyTemplateMessage: '请先填写质量分析模板id',
                  estimatedInputTokens: estimateTextTokens(JSON.stringify(originArr)) + estimateTextTokens(translatedText),
                  signal,
                  onProgress: ({ stage, progress, taskId }) => {
                    if (stage === 'create') setQualityRunProgress(it, runKey, progress ? `${progressText} ${progress}` : `${progressText} 创建中`);
                    else if (stage === 'created' && taskId) {
                      resultsForTranslate[templateId].task_id = taskId;
                      setQualityRunProgress(it, runKey, `${progressText} 已创建`);
                    }
                    else if (typeof progress !== 'undefined' && progress !== null && progress !== '') setQualityRunProgress(it, runKey, `${progressText} ${progress}`);
                    else setQualityRunProgress(it, runKey, `${progressText} 进行中`);
                    syncPrimaryQualityFields(it, getCurrentTargetLanguage());
                    renderItemsList();
                    if (selected === idx) refreshSelectedQualityPreview();
                  },
                });

                resultsForTranslate[templateId] = {
                  task_id: res.taskId || resultsForTranslate[templateId].task_id || '',
                  text: res.text || '',
                  query_response: res.queryResponse || null,
                  error_msg: '',
                };
              } catch (err) {
                failedCount++;
                resultsForTranslate[templateId] = {
                  task_id: resultsForTranslate[templateId].task_id || '',
                  text: '',
                  query_response: err && err.queryResponse ? err.queryResponse : null,
                  error_msg: `质检失败：${err && err.message ? err.message : String(err)}`,
                };
                if (isAbortError(err)) throw err;
              }
              syncPrimaryQualityFields(it, getCurrentTargetLanguage());
              renderItemsList();
              if (selected === idx) refreshSelectedQualityPreview();
          }
        }

        syncPrimaryQualityFields(it, getCurrentTargetLanguage());
        if (selected === idx) {
          renderQualityTemplateSelector();
          renderQualityPreview(it);
        }
        if (failedCount > 0) {
          setStatus(`质量检查完成：#${idx + 1} · ${getLanguageLabel(targetLang)} 共 ${translateTemplateIds.length} 个译文模板，失败 ${failedCount} 个`, 'error');
          return false;
        }
        setStatus(`质量检查完成：已更新 #${idx + 1} · ${getLanguageLabel(targetLang)} 的 ${translateTemplateIds.length} 个译文模板质检结果（内存）`, 'success');
        return true;
      } catch (err) {
        if (isAbortError(err)) {
          setStatus(`已停止质检 #${idx + 1} · ${getLanguageLabel(targetLang || getCurrentTargetLanguage())}`, 'error');
          return false;
        }
        if (it && typeof it === 'object') {
          const fallbackTranslateTemplateIds = targetTranslateTemplateIds.length ? targetTranslateTemplateIds : [getPrimaryTranslateTemplateId()].filter(Boolean);
          fallbackTranslateTemplateIds.forEach((translateTemplateId) => {
            const resultsForTranslate = ensureItemQualityResultsForTranslate(it, translateTemplateId, targetLang);
            getQualityTemplateIds().forEach((templateId) => {
              resultsForTranslate[templateId] = {
                task_id: '',
                text: '',
                query_response: err && err.queryResponse ? err.queryResponse : null,
                error_msg: `质检失败：${err && err.message ? err.message : String(err)}`,
              };
            });
          });
          syncPrimaryQualityFields(it, getCurrentTargetLanguage());
        }
        if (selected === idx) {
          renderQualityPreview(it);
        }
        setStatus(`质量检查失败：${err && err.message ? err.message : String(err)}`, 'error');
        return false;
      } finally {
        const it2 = items[idx];
        if (it2 && typeof it2 === 'object') {
          finishQualityRuns(it2, runKeys);
        }
        renderItemsList();
      }
    }

    async function qualityCheckItem(idx, translateTemplateIdsOverride, targetLanguagesOverride, signal = null) {
      const languages = Array.isArray(targetLanguagesOverride) && targetLanguagesOverride.length
        ? targetLanguagesOverride.map((language) => normalizeLanguageCode(language)).filter(Boolean)

    // 格式化时间为 HH:MM:SS
    function formatTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // 格式化时长（毫秒转为可读格式）
    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}时${minutes}分${seconds}秒`;
      } else if (minutes > 0) {
        return `${minutes}分${seconds}秒`;
      } else {
        return `${seconds}秒`;
      }
    }

    // 更新翻译时间显示
    function updateTranslateTime(startTime, endTime) {
      if (!startTime) {
        translateTimeEl.style.display = 'none';
        return;
      }
      timeStartEl.textContent = formatTime(startTime);
      if (endTime) {
        timeEndEl.textContent = formatTime(endTime);
        const duration = endTime.getTime() - startTime.getTime();
        timeDurationEl.textContent = formatDuration(duration);
      } else {
        timeEndEl.textContent = '进行中...';
        timeDurationEl.textContent = '-';
      }
      translateTimeEl.style.display = 'flex';
    }

    function beginWorkflowOperation({ reset = false } = {}) {
      if (!workflowStartTime || (reset && workflowActiveOperations === 0)) {
        workflowStartTime = new Date();
      }
      workflowActiveOperations += 1;
      updateTranslateTime(workflowStartTime, null);
    }

    function finishWorkflowOperation() {
      workflowActiveOperations = Math.max(0, workflowActiveOperations - 1);
      if (workflowStartTime && workflowActiveOperations === 0) {
        updateTranslateTime(workflowStartTime, new Date());
      }
    }

    async function runTrackedUserOperation(operation, options = {}) {
      beginWorkflowOperation(options);
      try {
        return await operation();
      } catch (err) {
        if (!isAbortError(err)) {
          setStatus(`操作失败：${err && err.message ? err.message : String(err)}`, 'error');
        }
        return false;
      } finally {
        finishWorkflowOperation();
      }
    }

    function isDefinitelyNonRetryableFailure(message) {
      return /HTTP (?:400|401|403|404|422)\b|请先填写|请先勾选|origin_content 反序列化失败|质检跳过：/i.test(String(message || ''));
    }

    async function runLimitedQueue(entries, concurrency, worker, signal) {
      let cursor = 0;
      const workerCount = Math.max(1, Math.min(concurrency, entries.length));
      async function runWorker() {
        while (cursor < entries.length) {
          throwIfAborted(signal);
          const current = cursor;
          cursor += 1;
          await worker(entries[current], current);
        }
      }
      await Promise.all(Array.from({ length: workerCount }, () => runWorker()));
    }

    function estimateTextTokens(text) {
      const value = String(text || '');
      if (!value) return 0;
      const cjkCount = (value.match(/[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
      const otherCount = Math.max(0, value.length - cjkCount);
      return Math.max(1, Math.ceil((cjkCount + otherCount / 4) * 1.12));
    }

    function estimateItemInputTokens(it) {
      if (!it || typeof it !== 'object') return 1;
      const explicitCandidates = [it.token_count, it.tokens, it.token, it.prompt_tokens];
      for (const value of explicitCandidates) {
        const numberValue = Number(value);
        if (Number.isFinite(numberValue) && numberValue > 0) return Math.ceil(numberValue);
      }
      return estimateTextTokens(typeof it.origin_content === 'string' ? it.origin_content : JSON.stringify(it.origin_content || []));
    }

    function estimateQualityInputTokens(it, language) {
      const originTokens = estimateItemInputTokens(it);
      const translatedTokens = getTranslateTemplateIds().reduce((maxTokens, templateId) => {
        const result = getItemTranslateResult(it, templateId, language);
        return Math.max(maxTokens, estimateTextTokens(getTranslateResultText(result)));
      }, 0);
      return originTokens + translatedTokens;
    }

    function getTokenTaskWeight(tokenCount) {
      const tokens = Number(tokenCount) || 0;
      if (tokens > 5000) return 3;
      if (tokens > 2500) return 2;
      return 1;
    }

    function isTransientStoredFailure(message) {
      return /HTTP 429|HTTP 5\d\d|请求超时|查询超时|查询任务连续失败|长时间无变化|fetch|network/i.test(String(message || ''));
    }

    async function runAdaptiveWeightedQueue(entries, options, worker, signal) {
      const pending = entries.map((entry) => ({ ...entry, _attempt: 0, _notBefore: 0, _retryHistory: [] }));
      const active = [];
      let activeWeight = 0;
      const largestWeight = Math.max(1, ...entries.map((entry) => Math.max(1, Number(entry.weight) || 1)));
      let capacity = Math.max(largestWeight, Number(options.initialCapacity) || 1);
      const minCapacity = Math.max(largestWeight, Number(options.minCapacity) || 1);
      const maxCapacity = Math.max(capacity, Number(options.maxCapacity) || capacity);
      const successThreshold = Math.max(1, Number(options.successThreshold) || 12);
      const maxRetries = Math.max(0, Number(options.maxRetries) || 0);
      const retryDelays = [5000, 10000, 20000];
      let successStreak = 0;
      let cooldownUntil = 0;
      let sequence = 0;
      function reportTransientFailure() {
        successStreak = 0;
        capacity = Math.max(minCapacity, Math.floor(capacity / 2));
        cooldownUntil = Math.max(cooldownUntil, Date.now() + 15000);
      }

      while (pending.length || active.length) {
        throwIfAborted(signal);
        let launched = false;
        if (Date.now() >= cooldownUntil) {
          while (pending.length) {
            const availableWeight = capacity - activeWeight;
            const nextIndex = pending.findIndex((entry) =>
              Math.max(1, Number(entry.weight) || 1) <= availableWeight && entry._notBefore <= Date.now());
            if (nextIndex < 0) break;
            const entry = pending.splice(nextIndex, 1)[0];
            const weight = Math.max(1, Number(entry.weight) || 1);
            const id = ++sequence;
            activeWeight += weight;
            const promise = Promise.resolve()
              .then(() => worker(entry))
              .then((result) => ({ id, weight, entry, result: result || { ok: false } }))
              .catch((error) => ({ id, weight, entry, result: { ok: false, transient: isTransientRequestError(error), error } }));
            active.push({ id, weight, promise });
            launched = true;
          }
        }

        if (!active.length) {
          if (!pending.length) break;
          const nextReadyAt = Math.min(...pending.map((entry) => Math.max(cooldownUntil, entry._notBefore)));
          await sleep(Math.max(50, nextReadyAt - Date.now()), signal);
          continue;
        }

        const nextReadyAt = pending.length
          ? Math.min(...pending.map((entry) => Math.max(cooldownUntil, entry._notBefore)))
          : Infinity;
        const canLaunchWhenReady = pending.some((entry) => Math.max(1, Number(entry.weight) || 1) <= capacity - activeWeight);
        const nextSettlement = Promise.race(active.map((entry) => entry.promise));
        const settled = canLaunchWhenReady && nextReadyAt > Date.now()
          ? await Promise.race([nextSettlement, sleep(nextReadyAt - Date.now(), signal).then(() => null)])
          : await nextSettlement;
        if (!settled) continue;
        const activeIndex = active.findIndex((entry) => entry.id === settled.id);
        if (activeIndex >= 0) active.splice(activeIndex, 1);
        activeWeight = Math.max(0, activeWeight - settled.weight);

        if (!settled.result.ok) {
          const errorMessage = settled.result.errorMessage
            || (settled.result.error && settled.result.error.message) || '任务未成功';
          settled.entry._retryHistory.push(errorMessage);
          if (settled.result.transient) reportTransientFailure();
          if (settled.entry._attempt < maxRetries && !isDefinitelyNonRetryableFailure(errorMessage)) {
            const delayMs = retryDelays[Math.min(settled.entry._attempt, retryDelays.length - 1)];
            settled.entry._attempt += 1;
            settled.entry._notBefore = Date.now() + delayMs;
            pending.push(settled.entry);
            if (typeof options.onRetry === 'function') {
              options.onRetry({ entry: settled.entry, retryNumber: settled.entry._attempt, maxRetries, delayMs, errorMessage });
            }
            continue;
          }
        }
        settled.result.attempts = settled.entry._attempt + 1;
        settled.result.retryHistory = settled.entry._retryHistory;
        if (settled.result.ok) {
          successStreak += 1;
          if (successStreak >= successThreshold && capacity < maxCapacity) {
            capacity += 1;
            successStreak = 0;
          }
        } else {
          successStreak = 0;
        }

        if (typeof options.onSettled === 'function') {
          options.onSettled({
            entry: settled.entry,
            result: settled.result,
            capacity,
            activeCount: active.length,
            activeWeight,
            pendingCount: pending.length,
            launched,
          });
        }
      }
    }

    bulkRetranslateBtn.addEventListener('click', async () => {
      if (bulkRunning) return;
      const indices = Array.from(checkedSet).filter((i) => Number.isInteger(i) && i >= 0 && i < items.length).sort((a, b) => a - b);
      if (indices.length === 0) return;

      batchAbortController = new AbortController();

      beginWorkflowOperation({ reset: true });

      try {
        const languages = getSelectedTargetLanguages();
        const fileCount = indices.length;
        const translateTemplateIds = getTranslateTemplateIds();
        const totalJobs = languages.length * fileCount * translateTemplateIds.length;
        setStatus(`开始全部翻译：共 ${totalJobs} 个“文件+模板”任务；逐语种执行，Token容量 6，稳定时最高 8`, '');
        let done = 0;
        let failed = 0;
        for (let languageIdx = 0; languageIdx < languages.length; languageIdx += 1) {
          const language = languages[languageIdx];
          activeBatchLanguage = language;
          updateHeaderSummaries();
          const jobs = indices.flatMap((idx) => {
            const estimatedTokens = estimateItemInputTokens(items[idx]);
            const weight = getTokenTaskWeight(estimatedTokens);
            return translateTemplateIds.map((templateId, templateIdx) => ({
              idx,
              templateId,
              templateIdx,
              estimatedTokens,
              weight,
            }));
          }).sort((a, b) => b.weight - a.weight || b.estimatedTokens - a.estimatedTokens || a.idx - b.idx || a.templateIdx - b.templateIdx);

          await runAdaptiveWeightedQueue(jobs, {
            initialCapacity: 6,
            minCapacity: 3,
            maxCapacity: 8,
            successThreshold: 12,
            maxRetries: 3,
            onRetry: ({ entry, retryNumber, maxRetries, delayMs, errorMessage }) => {
              setStatus(
                `翻译自动重试：#${entry.idx + 1} · ${getLanguageLabel(language)} · 模板 ${entry.templateId}，${delayMs / 1000} 秒后进行第 ${retryNumber}/${maxRetries} 次重试；原因：${errorMessage.slice(0, 100)}`,
                ''
              );
            },
            onSettled: ({ entry, result, capacity, activeCount, pendingCount }) => {
              const storedResult = getItemTranslateResult(items[entry.idx], entry.templateId, language);
              if (storedResult) {
                storedResult.retry_attempts = result.attempts;
                storedResult.retry_history = result.retryHistory;

              if (!result.ok) failed += 1;

                `全部翻译中：语种 ${languageIdx + 1}/${languages.length} · ${getLanguageLabel(language)}，完成 ${done}/${totalJobs}，失败 ${failed}，Token容量 ${capacity}，运行任务 ${activeCount}，排队 ${pendingCount}`,
                ''
              );
              if (!result.ok && result.error) console.error('全部翻译异常:', entry, result.error);
            },
          }, async (job) => {
            throwIfAborted(batchAbortController?.signal);
            const ok = await retranslateItem(job.idx, [job.templateId], [language], batchAbortController?.signal);
            const storedResult = getItemTranslateResult(items[job.idx], job.templateId, language);
            const errorMessage = storedResult && storedResult.error_msg ? storedResult.error_msg : '';
            return {
              ok,
              transient: !ok && isTransientStoredFailure(errorMessage),
              errorMessage,
            };
          }, batchAbortController?.signal);
        }

        if (failed > 0) {
          setStatus(`全部翻译完成：共 ${totalJobs} 组任务，失败 ${failed}（可重试失败项）`, 'error');
        } else {
          setStatus(`全部翻译完成：共 ${totalJobs} 组任务`, 'success');
        }
      } catch (err) {
        if (isAbortError(err)) {
          setStatus('全部翻译已停止', 'error');
        } else {
        setStatus(`全部翻译中断：${err && err.message ? err.message : String(err)}`, 'error');
        }
      } finally {
        bulkRunning = false;
        batchAbortController = null;
        activeBatchStage = '';
        activeBatchLanguage = '';
        updateBulkControls();
        updateHeaderSummaries();
        finishWorkflowOperation();
        await releaseBatchWakeLock();
      }
    });

    bulkQualityCheckBtn.addEventListener('click', async () => {
      if (qualityRunning) return;
      const allSelectedIndices = Array.from(checkedSet).filter((i) => Number.isInteger(i) && i >= 0 && i < items.length).sort((a, b) => a - b);
      const languages = getSelectedTargetLanguages();
      const languageJobs = languages.map((language) => ({
        language,
        indices: allSelectedIndices.filter((idx) => isItemTranslateReadyForLanguage(items[idx], language)),
      }));
      const totalJobs = languageJobs.reduce((sum, job) => sum + job.indices.length, 0);
      if (totalJobs === 0) return;
      const skipped = allSelectedIndices.length * languages.length - totalJobs;

      qualityRunning = true;
      activeBatchStage = 'quality';
      activeBatchLanguage = '';
      batchAbortController = new AbortController();
      updateBulkControls();
      await requestBatchWakeLock();
      beginWorkflowOperation();
      try {
        const skipInfo = skipped > 0 ? `，跳过 ${skipped} 条未完成翻译的条目` : '';
        const taskCount = countReadyQualityTasksInSelection();
        setStatus(`开始全部质检：共 ${taskCount} 个任务；逐语种执行，Token容量 4，稳定时最高 6${skipInfo}`, '');
        let done = 0;
        let failed = 0;
        for (let languageIdx = 0; languageIdx < languageJobs.length; languageIdx += 1) {
          const job = languageJobs[languageIdx];
          const language = job.language;
          const fileCount = job.indices.length;
          if (!fileCount) continue;
          activeBatchLanguage = language;
          updateHeaderSummaries();
          const weightedJobs = job.indices.map((idx) => {
            const estimatedTokens = estimateQualityInputTokens(items[idx], language);
            return { idx, estimatedTokens, weight: getTokenTaskWeight(estimatedTokens) };
          }).sort((a, b) => b.weight - a.weight || b.estimatedTokens - a.estimatedTokens || a.idx - b.idx);

          await runAdaptiveWeightedQueue(weightedJobs, {
            initialCapacity: 4,
            minCapacity: 2,
            maxCapacity: 6,
            successThreshold: 10,
            maxRetries: 3,
            onRetry: ({ entry, retryNumber, maxRetries, delayMs, errorMessage }) => {
              setStatus(
                `质检自动重试：#${entry.idx + 1} · ${getLanguageLabel(language)}，${delayMs / 1000} 秒后进行第 ${retryNumber}/${maxRetries} 次重试；原因：${errorMessage.slice(0, 100)}`,
                ''
              );
            },
            onSettled: ({ result, capacity, activeCount, pendingCount }) => {
              done += 1;
              if (!result.ok) failed += 1;
              setStatus(
                `全部质检中：语种 ${languageIdx + 1}/${languageJobs.length} · ${getLanguageLabel(language)}，文件组 ${done}/${totalJobs}，失败 ${failed}，Token容量 ${capacity}，运行任务 ${activeCount}，排队 ${pendingCount}`,
                ''
              );
            },
          }, async (qualityJob) => {
            throwIfAborted(batchAbortController?.signal);
            const retryTranslateTemplateIds = qualityJob._attempt === 0
              ? null
              : getFailedQualityTranslateTemplateIds(items[qualityJob.idx], language);
            const ok = qualityJob._attempt > 0 && !retryTranslateTemplateIds.length
              ? true
              : await qualityCheckItem(
                qualityJob.idx,
                retryTranslateTemplateIds,
                [language],
                batchAbortController?.signal
              );
            const failedTemplateIds = getFailedQualityTranslateTemplateIds(items[qualityJob.idx], language);
            const errorMessages = failedTemplateIds.flatMap((translateTemplateId) => getQualityTemplateIds().map((qualityTemplateId) => {
              const result = getItemQualityResult(items[qualityJob.idx], qualityTemplateId, translateTemplateId, language);
              return result && result.error_msg ? result.error_msg : '';
            })).filter(Boolean);
            return {
              ok,
              transient: !ok && errorMessages.some((message) => isTransientStoredFailure(message)),
              errorMessage: errorMessages.join('；'),
            };
          }, batchAbortController?.signal);
        }

        if (failed > 0) {
          setStatus(`全部质检完成：共 ${totalJobs} 组任务，失败 ${failed}`, 'error');
        } else {
          setStatus(`全部质检完成：共 ${totalJobs} 组任务`, 'success');
        }
      } catch (err) {
        if (isAbortError(err)) {
          setStatus('全部质检已停止', 'error');
        } else {
        setStatus(`全部质检中断：${err && err.message ? err.message : String(err)}`, 'error');
        }
      } finally {
        qualityRunning = false;
        batchAbortController = null;
        activeBatchStage = '';
        activeBatchLanguage = '';
        updateBulkControls();
        updateHeaderSummaries();
        finishWorkflowOperation();
        await releaseBatchWakeLock();
      }
    });

    retryFailedBtn.addEventListener('click', async () => {
      if (bulkRunning || qualityRunning) return;
      const languages = getSelectedTargetLanguages();
      const jobs = [];
      languages.forEach((language) => {
        Array.from(checkedSet)
          .filter((idx) => Number.isInteger(idx) && idx >= 0 && idx < items.length)
          .sort((a, b) => a - b)
          .forEach((idx) => {
            const translateTemplateIds = getFailedTranslateTemplateIds(items[idx], language);
            const qualityTranslateTemplateIds = getFailedQualityTranslateTemplateIds(items[idx], language);
            if (translateTemplateIds.length || qualityTranslateTemplateIds.length) {
              jobs.push({ idx, language, translateTemplateIds, qualityTranslateTemplateIds });
            }
          });
      });

      if (!jobs.length) {
        setStatus('没有需要重试的失败任务', 'success');
        updateBulkControls();
        return;
      }

      bulkRunning = true;
      qualityRunning = true;
      activeBatchStage = 'retry';
      activeBatchLanguage = '';
      batchAbortController = new AbortController();
      updateBulkControls();
      await requestBatchWakeLock();
      beginWorkflowOperation();
      try {
        const MAX_ROUNDS = 3;
        let pendingJobs = jobs.map((job) => ({ idx: job.idx, language: job.language }));
        const originalJobCount = pendingJobs.length;
        setStatus(`开始失败重试：共 ${originalJobCount} 组，采用全量轮次重试，最多 ${MAX_ROUNDS} 轮`, '');

        for (let round = 1; round <= MAX_ROUNDS && pendingJobs.length; round += 1) {
          throwIfAborted(batchAbortController?.signal);
          const currentRoundJobs = pendingJobs;
          const nextRoundJobs = [];
          let roundDone = 0;
          await runLimitedQueue(currentRoundJobs, 2, async (job) => {
            throwIfAborted(batchAbortController?.signal);
            activeBatchLanguage = job.language;
            updateHeaderSummaries();
            const remainingTranslate = getFailedTranslateTemplateIds(items[job.idx], job.language);
            const remainingQuality = getFailedQualityTranslateTemplateIds(items[job.idx], job.language);
            if (!remainingTranslate.length && !remainingQuality.length) {
              roundDone += 1;
              return;
            }

            try {
              setStatus(`失败重试中：第 ${round}/${MAX_ROUNDS} 轮，本轮 ${roundDone}/${currentRoundJobs.length}（#${job.idx + 1} ${getLanguageLabel(job.language)}）`, '');
              if (remainingTranslate.length) {
                await retranslateItem(job.idx, remainingTranslate, [job.language], batchAbortController?.signal);
              }
              const retryQualityTemplateIds = Array.from(new Set(getFailedQualityTranslateTemplateIds(items[job.idx], job.language)))
                .filter((templateId) => {
                  const translateResult = getItemTranslateResult(items[job.idx], templateId, job.language);
                  return isUsableTranslateResult(items[job.idx], translateResult);
                });
              if (retryQualityTemplateIds.length) {
                await qualityCheckItem(job.idx, retryQualityTemplateIds, [job.language], batchAbortController?.signal);
              }
              const postTranslateFailed = getFailedTranslateTemplateIds(items[job.idx], job.language);
              const postQualityFailed = getFailedQualityTranslateTemplateIds(items[job.idx], job.language);
              if (postTranslateFailed.length || postQualityFailed.length) nextRoundJobs.push(job);
            } catch (err) {
              console.error('失败任务重试异常:', err);
              nextRoundJobs.push(job);
            }
            roundDone += 1;
            setStatus(`失败重试中：第 ${round}/${MAX_ROUNDS} 轮，本轮完成 ${roundDone}/${currentRoundJobs.length}，仍待重试 ${nextRoundJobs.length}`, '');
          }, batchAbortController?.signal);

          pendingJobs = nextRoundJobs;
          if (pendingJobs.length && round < MAX_ROUNDS) {
            const cooldownMs = round === 1 ? 15000 : 30000;
            setStatus(`第 ${round} 轮结束：仍有 ${pendingJobs.length} 组失败，等待 ${cooldownMs / 1000} 秒后继续`, '');
            await sleep(cooldownMs, batchAbortController?.signal);
          }
        }

        const failed = pendingJobs.length;
        setStatus(`失败重试完成：共 ${originalJobCount} 组${failed ? `，仍有 ${failed} 组未完全恢复` : ''}`, failed ? 'error' : 'success');
      } catch (err) {
        if (isAbortError(err)) {
          setStatus('失败重试已停止', 'error');
        } else {
          setStatus(`失败重试中断：${err && err.message ? err.message : String(err)}`, 'error');
        }
      } finally {
        bulkRunning = false;
        qualityRunning = false;
        batchAbortController = null;
        activeBatchStage = '';
        activeBatchLanguage = '';
        updateBulkControls();
        updateHeaderSummaries();
        finishWorkflowOperation();
        await releaseBatchWakeLock();
      }
    });

    function toUtf8Bytes(text) {
      return new TextEncoder().encode(String(text));
    }

    function crc32(bytes) {
      const table = crc32.table || (crc32.table = (() => {
        const t = new Uint32Array(256);
        for (let i = 0; i < 256; i += 1) {
          let c = i;
          for (let k = 0; k < 8; k += 1) {
            c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          }
          t[i] = c >>> 0;
        }
        return t;
      })());
      let c = 0xffffffff;
      for (let i = 0; i < bytes.length; i += 1) {
        c = table[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
      }
      return (c ^ 0xffffffff) >>> 0;
    }

    function u16(v) {
      return [v & 0xff, (v >>> 8) & 0xff];
    }

    function u32(v) {
      return [v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff];
    }

    function concatUint8Arrays(chunks) {
      const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
      const out = new Uint8Array(total);
      let offset = 0;
      chunks.forEach((chunk) => {
        out.set(chunk, offset);
        offset += chunk.length;
      });
      return out;
    }

    function buildZipBlob(files) {
      const localParts = [];
      const centralParts = [];
      let localOffset = 0;

      files.forEach((file) => {
        const nameBytes = toUtf8Bytes(file.path.replace(/\\/g, '/'));
        const dataBytes = file.data instanceof Uint8Array ? file.data : toUtf8Bytes(file.data);
        const crc = crc32(dataBytes);
        const size = dataBytes.length;
        const entryOffset = localOffset;

        const localHeader = new Uint8Array([
          0x50, 0x4b, 0x03, 0x04,
          ...u16(20),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(crc),
          ...u32(size),
          ...u32(size),
          ...u16(nameBytes.length),
          ...u16(0),
        ]);
        localParts.push(localHeader, nameBytes, dataBytes);
        localOffset += localHeader.length + nameBytes.length + dataBytes.length;

        const centralHeader = new Uint8Array([
          0x50, 0x4b, 0x01, 0x02,
          ...u16(20),
          ...u16(20),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(crc),
          ...u32(size),
          ...u32(size),
          ...u16(nameBytes.length),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u16(0),
          ...u32(0),
          ...u32(entryOffset),
        ]);
        centralParts.push(centralHeader, nameBytes);
      });

      const localData = concatUint8Arrays(localParts);
      const centralDir = concatUint8Arrays(centralParts);
      const endRecord = new Uint8Array([
        0x50, 0x4b, 0x05, 0x06,
        ...u16(0),
        ...u16(0),
        ...u16(files.length),
        ...u16(files.length),
        ...u32(centralDir.length),
        ...u32(localData.length),
        ...u16(0),
      ]);
      return new Blob([localData, centralDir, endRecord], { type: 'application/zip' });
    }

        try {
          // 获取原文数组
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');

          // 获取 key 参数
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          // 生成 key（检测重复并添加后缀）
          const baseKey = `${originLang}_${targetLang}_${firstS}`;
          let key = baseKey;
          let suffix = 1;
          while (resultObj.hasOwnProperty(key)) {
            key = `${baseKey}_${suffix}`;
            suffix++;
          }

          // 添加到结果对象
          resultObj[key] = originArr;
        } catch (err) {
          failed++;
          console.error(`处理条目失败:`, err);
        }
      }

      const exportedCount = Object.keys(resultObj).length;
      if (exportedCount === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      // 获取文件名（去掉扩展名）
      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_原始.json`;

      // 下载文件
      downloadJsonFile(outputFileName, resultObj);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${exportedCount} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${exportedCount} 个条目）`, 'success');
      }
    });

    // 批量导出已勾选的条目（原始文本格式，不检查翻译状态）
    if (exportOriginBtn) exportOriginBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      if (checkedSet.size === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      // 筛选：仅已勾选的条目
      const selectedItems = [];
      for (const idx of checkedSet) {
        if (idx < 0 || idx >= items.length) continue;
        const it = items[idx];
        if (!it || typeof it !== 'object') continue;
        selectedItems.push(it);
      }

      if (selectedItems.length === 0) {
        setStatus('没有有效的勾选条目', 'error');
        return;
      }

      setStatus(`正在导出 ${selectedItems.length} 个勾选的条目...`, '');

      // 整理所有原始文本到一个文件
      const sections = [];
      let failed = 0;

      for (let i = 0; i < selectedItems.length; i++) {
        const it = selectedItems[i];
        try {
          // 获取原文数组
          const originArr = deserializeContentArray(it.origin_content, 'origin_content');

          // 获取标题参数
          const originLang = it.origin_lang || 'unknown';
          const targetLang = it.target_lang || 'unknown';
          const firstS = originArr.length > 0 && originArr[0].s != null ? originArr[0].s : 0;

          // 生成标题
          const sectionTitle = `${originLang}_${targetLang}_${firstS}:`;
          // 提取 t 值并逐行拼接
          const originLines = originArr.map(item => (item && item.t != null ? String(item.t) : '')).join('\n');

          // 组合为一个段落
          sections.push(`${sectionTitle}\n${originLines}`);
        } catch (err) {
          failed++;
          console.error(`处理条目失败:`, err);
        }
      }

      if (sections.length === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      // 合并所有段落，用两个空行分隔
      const fileContent = sections.join('\n\n\n');

      // 获取文件名（去掉扩展名）
      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      const outputFileName = `${sourceFileName}_原始文档.txt`;

      // 下载文件
      downloadTextFile(outputFileName, fileContent);

      if (failed > 0) {
        setStatus(`导出完成：${outputFileName}（${sections.length} 个条目，${failed} 个失败）`, 'error');
      } else {
        setStatus(`导出成功：${outputFileName}（${sections.length} 个条目）`, 'success');
      }
    });

    exportProofreadOriginBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      const selectedItems = getCheckedItemsSorted();
      if (selectedItems.length === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      const { groups, failed } = buildProofreadGroups(selectedItems, 'origin');
      if (groups.size === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      const sourceFileName = (fileNameEl.textContent || 'export').replace(/\.[^/.]+$/, '');
      groups.forEach((sections, groupKey) => {
        const outputFileName = `${sourceFileName}_校对原文_${groupKey}.txt`;
        downloadTextFile(outputFileName, sections.join('\n\n\n'));
      });

      if (failed > 0) {
        setStatus(`导出校对原文完成：共 ${groups.size} 个文件，${failed} 个条目失败`, 'error');
      } else {
        setStatus(`导出校对原文成功：共 ${groups.size} 个文件`, 'success');
      }
    });

    exportProofreadBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      const selectedItems = getCheckedItemsSorted().filter((it) => hasTranslateText(it));
      if (selectedItems.length === 0) {
        setStatus('请先勾选至少一个已翻译的条目', 'error');
        return;
      }

      const templateIds = Array.from(new Set(
        selectedItems.flatMap((it) => getOrderedTranslateTemplateIdsForItem(it))
      ));
      if (templateIds.length === 0) {
        setStatus('导出失败：没有成功处理的条目', 'error');
        return;
      }

      let totalFiles = 0;
      let failed = 0;
      templateIds.forEach((templateId) => {
        const matchedItems = selectedItems.filter((it) => {
          const translateResult = getItemTranslateResult(it, templateId);
          return !!getTranslateResultText(translateResult);
        });
        if (!matchedItems.length) return;

        const result = buildProofreadGroups(matchedItems, 'translate', templateId);
        failed += result.failed;
        result.groups.forEach((sections, groupKey) => {
          const outputFileName = `${templateId}_${groupKey}.txt`;
          downloadTextFile(outputFileName, sections.join('\n\n\n'));
          totalFiles++;
        });
      });

      if (totalFiles === 0) {
        setStatus('导出失败：没有可导出的模板译文结果', 'error');
        return;
      }

      if (failed > 0) {
        setStatus(`导出校对译文完成：共 ${totalFiles} 个文件，${failed} 个条目失败`, 'error');
      } else {
        setStatus(`导出校对译文成功：共 ${totalFiles} 个文件`, 'success');
      }
    });

    exportQualityResultBtn.addEventListener('click', async () => {
      if (!Array.isArray(items) || items.length === 0) {
        setStatus('没有可导出的条目', 'error');
        return;
      }

      const selectedItems = getCheckedItemsSorted();
      if (selectedItems.length === 0) {
        setStatus('请先勾选要导出的条目', 'error');
        return;
      }

      const qualityTemplateId = selectedQualityTemplateId || getPrimaryQualityTemplateId();
      if (!qualityTemplateId) {
        setStatus('请先填写质量分析模板id', 'error');
        return;
      }

      const templateIds = Array.from(new Set(
        selectedItems.flatMap((it) => getOrderedTranslateTemplateIdsForItem(it))
      ));
      if (templateIds.length === 0) {
        setStatus('导出失败：没有可导出的翻译模板', 'error');
        return;
      }

      let totalFiles = 0;
      let failed = 0;

      templateIds.forEach((translateTemplateId) => {
        const sections = [];

        selectedItems.forEach((it, index) => {
          try {
            const qualityResult = getItemQualityResult(it, qualityTemplateId, translateTemplateId);
            if (!qualityResult) return;
            const text = qualityResult.error_msg || qualityResult.text || (
              qualityResult.query_response && qualityResult.query_response.data
                ? qualityResult.query_response.data.text || ''
                : ''
            );
            if (!text) return;

            const parsed = tryParseQualityResult(text);
            const content = parsed ? JSON.stringify(parsed, null, 2) : String(text);
            sections.push(`文件${index + 1}:\n${content}`);
          } catch (err) {
            failed++;
            console.error('处理质检结果导出条目失败:', err);
          }
        });

        if (!sections.length) return;
        const outputFileName = `质检结果_${translateTemplateId}.txt`;
        downloadTextFile(outputFileName, sections.join('\n\n\n'));
        totalFiles++;
      });

      if (totalFiles === 0) {
        setStatus('导出失败：没有可导出的质检结果', 'error');
        return;
      }

      if (failed > 0) {
        setStatus(`导出质检结果完成：共 ${totalFiles} 个文件，${failed} 个条目失败`, 'error');
      } else {
        setStatus(`导出质检结果成功：共 ${totalFiles} 个文件`, 'success');
      }
    });
  </script>
</body>
</html>
